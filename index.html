<style>
:root{
  --brand:#00529b;
  --green:#16a37a;
  --v2:#5b7aa6;
  --navy:#071a33;
  --cyan:#39c6f4;
  --orange:#e0642a;
  --red:#c62828;
  --bg:#f3f5f8;
  --card:#ffffff;
  --text:#1b2430;
  --muted:#6b7683;
  --line:#dde2e9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.page,.page *{-webkit-text-size-adjust:none;text-size-adjust:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
#app{max-width:760px;margin:0 auto;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.top .tag{font-size:11.5px;opacity:.8;text-align:right;line-height:1.25;letter-spacing:.02em}
.wm{display:inline-flex;align-items:baseline;white-space:nowrap;text-transform:uppercase;line-height:1;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
.wm .a{font-weight:300;letter-spacing:.3em;margin-right:.32em}
.wm .b{font-weight:800;letter-spacing:.14em}
.top .wm{font-size:19px;color:#fff}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:15px;font-weight:600;padding:10px 6px;border-radius:10px 10px 0 0;cursor:pointer;font-family:inherit}
.tab.on{background:var(--bg);color:var(--brand)}
.view{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font-size:16px;color:var(--brand)}
.cflip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 0;margin:0;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.cflip:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px}
.ctitle{font-size:16px;font-weight:700;color:var(--brand);line-height:1.25}
.chev{width:7px;height:7px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 2px 3px 1px;color:var(--brand)}
.card.folded .chev{transform:rotate(-45deg);margin-bottom:0}
.card .note{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card .note.blk{color:#a35a00;font-weight:600}
.cbody{margin-top:4px;transition:opacity .15s}
.card.off .cbody{opacity:.4}
.card.off h2,.card.off .ctitle,.card.off .chev{color:var(--muted)}
.card.folded .note,.card.folded .cbody{display:none}
.chead .sw{flex:none}
.sep{margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.field{margin-top:10px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.fhead label{font-size:13px;font-weight:600}
.fhead .hint{font-weight:400;color:var(--muted)}
.mbadge{display:none;flex:none;border-radius:8px;background:#fdeaea;color:var(--red);font-size:11px;font-weight:700;padding:3px 8px}
.field.miss .fhead label{color:var(--red)}
.field.miss .inp{border-color:var(--red);background:#fff6f6}
.field.miss .mbadge{display:inline-block}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.inp:focus-within{border-color:var(--brand)}
.inp input,.inp select.full{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:11px 12px;background:transparent;color:var(--text);font-family:inherit}
.inp input:disabled,.inp select:disabled{color:var(--muted)}
.inp input[readonly]{background:#f4f8fc;color:var(--brand);font-weight:700;cursor:default}
.inp .unit{padding:0 12px;font-size:13px;color:var(--muted);white-space:nowrap;background:#f6f8fa;align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--line)}
.inp select.usel{flex:none;max-width:52%;border:0;border-left:1px solid var(--line);outline:0;background:#f6f8fa;color:var(--brand);font-size:14px;font-weight:600;padding:0 8px;align-self:stretch;font-family:inherit}
.calc{margin-top:8px;font-size:13px;color:var(--brand);background:#eaf2fb;border-radius:8px;padding:6px 10px}
.calc.alert{color:#8a4b00;background:#fff4e5}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#c5ccd6;position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on span{left:25px}
.live{background:linear-gradient(135deg,#0b3d91,#00529b);color:#fff}
.live h2{color:#fff}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lbox{background:rgba(255,255,255,.14);border-radius:10px;padding:10px}
.lbox .t{font-size:12px;opacity:.85}
.lbox .v{font-size:18px;font-weight:700;margin-top:2px}
.lbox .s{font-size:11px;opacity:.8;margin-top:3px;line-height:1.3}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.main{background:var(--brand);color:#fff}
.btn.sec{background:#e6edf5;color:var(--brand)}
.btn.danger{background:#fdeaea;color:#b42318}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.warn{background:#fff4e5;border:1px solid #f5c98b;color:#8a4b00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.warn.red{background:#fff1f1;border-color:#f0b4b4;color:var(--red)}
.warn .redlist{margin:6px 0 8px;padding-left:18px;color:var(--red)}
.warn .redlist li{margin-bottom:2px}
.warn .btn{padding:9px 12px;font-size:14px;margin-top:2px}
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pgwrap{margin:0 auto 14px;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.pgscale{transform-origin:top left;width:794px}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;max-height:86vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox .redlist{margin:0 0 12px;padding-left:18px;color:var(--red);font-size:14px}
/* Dossiers clients */
.dbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dbar .di{flex:1;min-width:0}
.dbar .dl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.dbar .dn{font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .ds{font-size:12px;color:var(--muted)}
.dbar .ds.mod{color:#a35a00;font-weight:600}
.dbar .btn{flex:none;padding:10px 12px;font-size:14px}
#dossiers{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;flex-direction:column}
#dossiers.on{display:flex}
.dhead{background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead h3{margin:0;font-size:17px}
.dhead .x{border:0;background:rgba(255,255,255,.18);color:#fff;font-size:15px;font-weight:700;border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit}
.dscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.dwrap{max-width:760px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.dsearch{width:100%;border:1.5px solid var(--line);border-radius:10px;font-size:16px;padding:11px 12px;font-family:inherit;margin-bottom:12px;background:#fff;color:var(--text);outline:0}
.dsearch:focus{border-color:var(--brand)}
.dclient{margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.4px}
.dstudy{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:2px solid transparent}
.dstudy.cur{border-color:var(--brand)}
.dstudy .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dstudy .nm{font-weight:700}
.dstudy .eco{font-weight:800;white-space:nowrap}
.dstudy .eco.pos{color:var(--green)}
.dstudy .eco.neg{color:var(--red)}
.dstudy .meta{font-size:12px;color:var(--muted);margin-top:2px}
.dacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dacts .btn{flex:1;padding:9px 6px;font-size:13px;min-width:70px}
.dempty{text-align:center;color:var(--muted);padding:30px 10px}
.dsave{background:#eaf2fb;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--brand);margin-bottom:12px}
.dsave.late{background:#fff4e5;color:#8a4b00}
#prompt{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:110;padding:20px}
#prompt.on{display:flex}
.pfield{margin-bottom:10px}
.pfield label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.pfield input{width:100%;border:1.5px solid var(--line);border-radius:10px;font-size:16px;padding:11px 12px;font-family:inherit;outline:0}
.pfield input:focus{border-color:var(--brand)}
.perr{color:var(--red);font-size:13px;margin:-4px 0 10px;display:none}
#modal{z-index:120}
#cmpPick{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:115;padding:20px}
#cmpPick.on{display:flex}
.cpbtn{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--text)}
.cpbtn b{display:block;font-size:15px;color:var(--brand)}
.cpbtn span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.cpbtn:active,.cpbtn:hover{border-color:var(--brand);background:#f3f8fd}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b2430;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:130;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Pages A4 (96 dpi) */
.page{width:794px;height:1122px;padding:26px 44px 58px;background:#fff;color:#1b2430;position:relative;overflow:hidden;font-size:13px;line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.page.last{padding-bottom:128px}
.ph{border-bottom:1px solid #cfd6df;padding-bottom:12px;margin-bottom:14px}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.wmwrap{display:inline-block}
.wmwrap .wm{font-size:17px;color:#1b2430}
.wmwrap .wm .b{color:var(--brand)}
.wmbar{height:3px;margin-top:7px;border-radius:2px;background:linear-gradient(90deg,#00529b,#39c6f4)}
.ph-r{text-align:right;font-size:11.5px;color:#6b7683;line-height:1.45}
.ph-t{font-size:22px;font-weight:800;color:#0b2a4a;line-height:1.15}
.ph-s{font-size:12.5px;color:#6b7683;margin-top:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.kpi{border-radius:14px;padding:11px 16px;color:#0b2a4a;position:relative;overflow:hidden;border:1.5px solid #bcd3ea;background:#f3f8fd}
.kpi.g{background:#eefaf4;border-color:#9fdcc1}
.kpi.b{background:#f3f8fd;border-color:#bcd3ea}
.kpi .k1{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:800;color:#00529b}
.kpi.g .k1{color:#0d6b49}
.kpi.g .k2{color:#0d6b49}
.kpi .k3{color:#3a4552}
.kpi .k2{font-size:28px;font-weight:800;margin-top:1px}
.kpi .k3{font-size:12px;opacity:.9}
.basis{font-size:11.5px;color:#6b7683;margin:6px 0 8px}
.st{font-size:15px;font-weight:800;color:#0b2f5e;margin:12px 0 6px;border-left:4px solid var(--brand);padding-left:8px}
/* Mode « correction » : formules en rouge par-dessus le rapport */
.fxw{position:relative;display:inline-block;border-bottom:1.6px solid #d40000;line-height:inherit}
.fxn{position:absolute!important;right:0;bottom:84%;white-space:nowrap!important;color:#d40000!important;font:600 10px/1.05 'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive!important;transform:rotate(-2.2deg);transform-origin:right bottom;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 3px #fff;z-index:60;pointer-events:none;letter-spacing:0!important;text-transform:none!important;font-style:normal!important;display:block!important;background:none!important;padding:0!important;margin:0!important;width:auto!important}
.fxn.fxl{right:auto!important;left:0;transform-origin:left bottom}
.fxn.fxb{bottom:auto!important;top:92%}
.fxn.fxu{bottom:calc(84% + 10px)!important}
.t.fxt td{padding-top:19px!important}
.btn.fxon{background:#fff0f0;border-color:#d40000;color:#b00000}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#0b2f5e;color:#fff;text-align:right;padding:6px 8px;font-weight:700}
table.t tr:first-child th:first-child{border-radius:6px 0 0 0}
table.t tr:first-child th:last-child{border-radius:0 6px 0 0}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 8px;text-align:right;border-bottom:1px solid #e6eaf0}
table.t td:not(:first-child){white-space:nowrap}
table.t.bt th,table.t.bt td{white-space:nowrap;font-size:10.4px;padding:4px 5px}
table.t.sm{font-size:11.5px}
table.t.sm th{padding:4px 6px}
table.t.sm td{padding:3px 6px}
table.t tr.hl td{font-weight:800;background:#eaf7f1;color:#0d6b49}
.flex2{display:flex;gap:16px;align-items:flex-start}
.fx1{flex:0 0 380px}
.fx2{flex:1;min-width:0}
.foot{position:absolute;left:44px;right:44px;bottom:8px;display:block;color:#8a94a1}
.foot .legal{font-size:9px;line-height:1.32;color:#5c6570;text-align:left;margin:0 0 4px;font-weight:500}
.page.last .foot .legal{font-size:6.7px;line-height:1.28;text-align:justify}
.foot .legal b{font-weight:800;color:#3a4552}
.foot .frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:10px;border-top:1px solid #e6eaf0;padding-top:4px}
.keys{margin:0;padding-left:18px;font-size:12.5px}
.keys li{margin-bottom:3px}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:0 5px 5px 0;background:#e3f5ec;color:#0d6b49}
.callout{background:#eaf2fb;border-left:4px solid var(--brand);padding:8px 12px;border-radius:6px;font-size:12px;margin:10px 0}
.callout.ok{background:#e9f7f0;border-color:var(--green)}
.callout.bad{background:#fff3e8;border-color:var(--orange)}
/* Seuils et sensibilité */
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thr.c4{grid-template-columns:repeat(4,1fr);gap:8px}
.thr.c4 .tc{padding:8px 10px 9px}
.thr.c4 .tc .v{font-size:17px}
.thr.c4 .tc .l{font-size:9.5px}
.tc{border:1px solid #dde3ea;border-radius:10px;padding:9px 12px 10px;background:#fbfcfe}
.tc .l{font-size:10px;text-transform:uppercase;letter-spacing:.45px;color:#6b7683;font-weight:700}
.tc .q{font-size:10.5px;color:#6b7683;margin-top:1px}
.tc .v{font-size:20px;font-weight:800;color:#0b2a4a;margin-top:4px;line-height:1.1}
.tc .c{font-size:11px;color:#3a4552;margin-top:3px}
.tc .m{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;border-radius:8px;padding:2px 8px}
.m.ok{background:#e3f5ec;color:#0d6b49}
.m.ko{background:#fff1e6;color:#a34a0b}
.m.na{background:#eef0f3;color:#6b7683}
table.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:11.5px}
table.hm th{font-weight:700;color:#fff;padding:4px 6px;text-align:center;background:#0b2f5e;border-radius:4px}
table.hm th.rh{text-align:right}
table.hm td{text-align:center;padding:4px 4px;border-radius:4px;font-weight:700;color:#1b2430}
table.hm td.cur{outline:3.5px solid #d6232a;outline-offset:-2px;font-size:13px;font-weight:900}
.annex{font-size:9.4px;line-height:1.26}
.a1grid{display:flex;gap:18px}
.a1col{flex:1;min-width:0}
.a1g{margin-bottom:6px}
.a1g h4{margin:0 0 2px;font-size:9.8px;color:var(--brand);border-bottom:1px solid #cfd8e3;padding-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.a1r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;border-bottom:1px dotted #dfe5ec}
.a1r span:first-child{color:#3a4552}
.a1r span:last-child{font-weight:700;text-align:right}
table.a2{width:100%;border-collapse:collapse;font-size:8.8px;line-height:1.25}
table.a2 th{background:#0b2f5e;color:#fff;text-align:left;padding:3px 5px;font-weight:700}
table.a2 td{padding:2.2px 5px;border-bottom:1px solid #e6eaf0;vertical-align:top}
table.a2 td:first-child{font-weight:700;width:21%}
table.a2 td:nth-child(2){color:#3a4552;width:55%}
table.a2 td:last-child{text-align:right;font-weight:700;width:24%}
table.a2 tr.sec td{background:#f4f7fb;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:8.4px;text-align:left}
/* Semaine type de la batterie */
.wk{background:#fbfdff;border:1.5px solid #cfdbe8;border-radius:14px;padding:12px 12px 10px;margin:6px 0 10px;color:#0b2a4a}
.wkh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 4px 2px}
.wkt{font-size:14px;font-weight:800;letter-spacing:.2px}
.wks{font-size:10px;color:#5d6876;margin-top:2px}
.wkl{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:flex-end;font-size:9px;color:#3a4552;max-width:270px}
.wkl span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.wkl i{display:inline-block;width:10px;height:6px;border-radius:3px}
.wkk{display:flex;gap:6px;margin-top:4px}
.wkk div{flex:1;background:#fff;border:1px solid #dde6ef;border-radius:9px;padding:6px 8px}
.wkk div.bad{background:#fff3ec;border-color:#f5c2a4}
.wkk div.pub{background:#fff8e6;border-color:#f1d58a}
.wkk b{display:block;font-size:15px;font-weight:800;line-height:1.1;color:#0b2a4a}
.wkk span{display:block;font-size:8.6px;color:#5d6876;margin-top:2px;line-height:1.2}
.dial{display:flex;gap:16px;align-items:center;background:#f6f9fc;border:1px solid #e3e9f0;border-radius:14px;padding:10px 14px}
.dtx{flex:1;min-width:0}
.dtt{font-size:12.5px;font-weight:800;color:#0b2a4a;margin-bottom:6px}
.dli{display:flex;align-items:baseline;gap:7px;font-size:10.5px;padding:3px 0;border-bottom:1px dotted #d6dee8}
.dli i{flex:none;width:9px;height:9px;border-radius:50%;transform:translateY(1px)}
.dli b{flex:none;width:84px;color:#0b2a4a}
.dli span{color:#3a4552}
.dlg{font-size:9px;color:#6b7683;margin-top:6px}
table.t.bt.btw th{white-space:normal;font-size:8.2px;line-height:1.15;padding:3px 2px;text-align:center}
table.t.bt.btw td{white-space:nowrap;font-size:9.2px;padding:3px 3px;text-align:right}
table.t.bt.btw td:first-child{text-align:left}
.gar{border:2px solid #16a37a;background:#f3fbf7;border-radius:14px;padding:12px 14px;margin-top:6px}
.gar1{display:flex;gap:16px;align-items:center}
.gbig{flex:none;width:150px;text-align:center;border-right:2px solid #bfe6d3;padding-right:14px}
.gbig b{display:block;font-size:46px;line-height:1;font-weight:900;color:#0d6b49}
.gbig span{display:block;font-size:11px;font-weight:700;color:#0d6b49;margin-top:4px;line-height:1.2}
.gtx{flex:1;font-size:11.5px;color:#26323f;line-height:1.4}
.gtx .gh{font-size:13px;font-weight:800;color:#0b2a4a;margin-bottom:3px}
.gar3{display:flex;gap:8px;margin-top:10px}
.gar3 div{flex:1;background:#fff;border:1px solid #bfe6d3;border-radius:10px;padding:7px 10px}
.gar3 b{display:block;font-size:24px;font-weight:900;color:#0d6b49;line-height:1.05}
.gar3 i{display:block;font-style:normal;font-size:10.5px;font-weight:800;color:#0b2a4a;margin-top:1px}
.gar3 span{display:block;font-size:9.2px;color:#5d6876;margin-top:2px;line-height:1.25}
.gch{margin-top:6px;background:#fff;border:1px solid #dde6ef;border-radius:10px;padding:6px 8px}
.gct{font-size:10.5px;font-weight:800;color:#0b2a4a}.gct span{font-weight:500;color:#6b7683}
.gk{display:flex;gap:8px;margin-top:6px}
.gk div{flex:1;background:#fff;border:1px solid #dde6ef;border-radius:10px;padding:6px 10px}
.gk div.ok{border-color:#bfe6d3;background:#f3fbf7}.gk div.ko{border-color:#f5c2a4;background:#fff3ec}
.gk b{display:block;font-size:19px;font-weight:900;color:#0b2a4a;line-height:1.1}
.gk i{display:block;font-style:normal;font-size:10px;font-weight:800;color:#0b2a4a;margin-top:1px}
.gk span{display:block;font-size:9px;color:#5d6876;margin-top:2px;line-height:1.25}
.gk span b{display:inline;font-size:9px;color:#0d6b49}
.gnote{font-size:9.6px;color:#5d6876;margin-top:6px;line-height:1.35}
.dbars{background:#f6f9fc;border:1px solid #e3e9f0;border-radius:12px;padding:6px 10px 4px;margin-top:8px}
.dbn{font-size:11.5px;font-weight:800;color:#0b2a4a}
/* Synthèse */
.syh{background:#f3f8fd;border:1.5px solid #bcd3ea;border-left:6px solid #00529b;border-radius:16px;padding:18px 20px;color:#0b2a4a;display:flex;gap:22px;align-items:center}
.syh .v{flex:0 0 250px}
.syh .v i{font-style:normal;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#00529b;font-weight:800}
.syh .v b{display:block;font-size:38px;font-weight:800;line-height:1.05;margin:4px 0}
.syh .v span{font-size:11.5px;color:#3a4552}
.syh .bars{flex:1;min-width:0}
.syb{margin:6px 0 10px}
.syb div{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px}
.syb div b{font-weight:800}
.syb p{margin:0;height:18px;border-radius:9px;background:#e3eaf2;overflow:hidden}
.syb p i{display:block;height:100%;border-radius:9px}
.syk{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.syk div{border:1px solid #dde3ea;border-radius:12px;padding:10px 12px;background:#fbfcfe}
.syk i{font-style:normal;display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.45px;color:#6b7683;font-weight:800}
.syk b{display:block;font-size:20px;font-weight:800;color:#0b2a4a;margin-top:4px;line-height:1.1}
.syk span{display:block;font-size:10.5px;color:#3a4552;margin-top:3px;line-height:1.25}
.syk div.ok{border-color:#9fdcc1;background:#effaf4}
.syk div.ko{border-color:#f5c2a4;background:#fff5ee}
.syt{display:flex;gap:10px;margin-top:12px}
.syt>div{flex:1}
/* Pile de la batterie */
.pl{background:#fbfdff;border:1.5px solid #cfdbe8;border-radius:16px;padding:16px 18px 14px;color:#0b2a4a;display:flex;gap:18px}
.pll{flex:0 0 358px}
.plr{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.plhd{font-size:14.5px;font-weight:800}
.plsub{font-size:10px;color:#5d6876;margin-top:2px}
.plspec{background:#fff;border:1px solid #dde6ef;border-radius:11px;padding:9px 11px}
.plspec h5{margin:0 0 7px;font-size:13px;letter-spacing:.6px;color:#00529b;text-transform:uppercase;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.plrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:3px 0;border-bottom:1px dotted #d6dee8}
.plrow:last-child{border-bottom:0}
.plrow span:first-child{color:#5d6876}
.plrow b{font-weight:800;text-align:right;white-space:nowrap}
.plbig{display:flex;gap:8px}
.plbig div{flex:1;border-radius:11px;padding:8px 10px;background:#fff;border:1px solid #dde6ef}
.plbig div.n{background:#eaf6fd;border-color:#9fd6f5}
.plbig div.o{background:#fff3ec;border-color:#f5c2a4}
.plbig b{display:block;font-size:21px;font-weight:800;line-height:1.05}
.plbig span{font-size:9px;color:#5d6876}
.plbar{height:16px;border-radius:8px;background:#e3eaf2;position:relative;overflow:hidden;margin-top:5px}
.plbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#1c7fd0,#39c6f4)}
.plbl{font-size:10px;color:#5d6876;margin-top:6px}
.plbl:first-of-type{margin-top:0}
.plnote{font-size:9px;color:#6b7683;margin-top:3px}
.plfoot{font-size:10.5px;color:#3a4552;background:#f4f7fb;border-left:4px solid #00529b;border-radius:6px;padding:7px 11px;margin-top:10px}
/* Kilomètres possibles par jour */
.kmb{background:#f6f9fc;border:1px solid #e3e9f0;border-radius:14px;padding:9px 14px 10px;margin-top:9px}
.kmt{font-size:12.5px;font-weight:800;color:#0b2a4a;margin-bottom:7px}
.kmg{display:flex;gap:8px}
.kmg>div{flex:1;background:#fff;border:1px solid #dde6ef;border-radius:10px;padding:7px 9px}
.kmg>div.win{background:#e7f1fb;border:1.5px solid #00529b;color:#0b2a4a}

/* ===================== ÉTAT, MODE, ACTIVATION ===================== */
var state = copyDefaults();
var ons = copyOn();
var modalOk = null;

function copyDefaults() { return copyObj(DEFAULTS); }
function copyOn() { return copyObj(DEFAULT_ON); }
/* Postes réellement pris en compte : interrupteurs, mode du rapport et dépendances */
function effOn() {
  var o = {};
  var k, i, g;
  for (k in DEFAULT_ON) {
    if (Object.prototype.hasOwnProperty.call(DEFAULT_ON, k)) { o[k] = !!ons[k]; }
  }
  for (i = 0; i < GROUPS.length; i++) {
    g = GROUPS[i];
    if (g.on && !needOk(g)) { o[g.on] = false; }
  }
  for (i = 0; i < GROUPS.length; i++) {
    g = GROUPS[i];
    if (g.on && g.req && !o[g.req]) { o[g.on] = false; }
  }
  o.remb = !!(o.energie && anyTherm(state) && state.rembOn === 'oui');
  o.chauf = false; o.scen = false;
  o.fisc = !!(o.regl && anyElec(state));
  if (o.aides && !((o.achat && anyElec(state)) || o.borne)) { o.aides = false; }
  if (o.fin && !(state.modeE === 'achat' || state.modeD === 'achat')) { o.fin = false; }
  if (o.revente && !(ownsS(state, 'E') || ownsS(state, 'D'))) { o.revente = false; }
  if (anyElec(state)) { o.batterie = true; }
  o.suram = !!(o.suram && cmpOf(state) === 'ed' && isElec(state, 'E'));
  return o;
}
function blockReason(g) {
  var o = effOn();
  if (!g.on || !ons[g.on] || o[g.on] || !needOk(g)) { return ''; }
  if (g.req && !o[g.req]) { return 'Inactif : active d’abord « ' + GROUP_BY_ON[g.req].title + ' ».'; }
  if (g.on === 'aides') { return 'Inactif : ni acquisition d’un tracteur électrique ni investissement dans une borne activé.'; }
  if (g.on === 'fin') { return 'Inactif : aucun tracteur n’est en achat.'; }
  if (g.on === 'revente') { return 'Inactif : le client n’est propriétaire d’aucun tracteur en fin de période.'; }
  return '';
}
function isComplet() { return true; }

/* Suramortissement (art. 39 decies A CGI) : information seule, jamais intégrée au coût total.
   Méthode de la formation DAF : base = prix électrique − prix thermique, avant toute aide ; taux selon le PTAC ; étalé sur la durée de l'étude. */
var SURAM_FIN = 2030;
function suramCalc(d) {
  var on = effOn();
  if (!on.suram) { return null; }
  var S = { ok: false }, cat = catOf(state, 'E'), n = d.annees;
  var pE = d.prixE, pD = d.prixD;
  S.cat = cat; S.rate = cat.rate; S.n = n;
  if (d.modeE === 'location') { S.msg = 'Non applicable : le suramortissement concerne le client qui achète le camion (achat, crédit-bail ou location avec option d’achat), pas la location simple.'; return S; }
  if (!(pE > 0) || !(pD > 0) || !(n > 0)) { S.msg = 'Renseigne les prix d’achat des deux camions pour obtenir ce calcul.'; return S; }
  var an0 = num(state.anneeDebut);
  S.late = an0 > SURAM_FIN;
  S.vrE = d.resU === 'eur' ? d.resE : pE * d.resE / 100;
  S.vrD = d.resU === 'eur' ? d.resD : pD * d.resD / 100;
  if (!(S.vrE >= 0)) { S.vrE = 0; }
  if (!(S.vrD >= 0)) { S.vrD = 0; }
  S.pE = pE; S.pD = pD;
  S.delta = Math.max(0, pE - pD);
  S.sur = S.delta * S.rate;
  S.surYr = S.sur / n;
  S.baseE = pE - S.vrE; S.baseD = pD - S.vrD;
  S.totE = S.baseE + S.sur; S.totD = S.baseD;
  S.yrE = S.totE / n; S.yrD = S.totD / n;
  S.ok = true;
  return S;
}
function suramHtml(S, d, rep) {
  if (!S) { return ''; }
  var h = '', n1 = esc(N1(d)), n2 = esc(N2(d));
  if (!S.ok) { return rep ? '' : '<b>Suramortissement</b> : ' + S.msg; }
  var F = rep ? fx : function (x) { return x; };
  h += '<b>Suramortissement fiscal</b> (information, non inclus dans le coût total). ';
  h += 'Surcoût d’achat <b>' + F(eur(S.delta), fmt(S.pE, 0) + FXM + fmt(S.pD, 0)) + '</b> (' + eur(S.pE) + ' − ' + eur(S.pD) + ', avant aides) × <b>' + fmt(S.rate * 100, 0) + ' %</b> (' + esc(S.cat.l) + ') = <b>' + F(eur(S.sur), fmt(S.delta, 0) + ' × ' + fmt(S.rate * 100, 0) + ' %') + '</b> de déduction supplémentaire, soit <b>' + F(eur(S.surYr), fmt(S.sur, 0) + ' ÷ ' + S.n, 'b') + ' par an</b> sur ' + ans(S.n) + '.';
  h += '<table class="t sm" style="margin-top:6px"><tr><th></th><th>' + n1 + '</th><th>' + n2 + '</th></tr>';
  h += '<tr><td>Prix d’achat</td><td>' + eur(S.pE) + '</td><td>' + eur(S.pD) + '</td></tr>';
  var fvr = function (p0, q) { return d.resU === 'eur' ? 'montant saisi' : fmt(p0, 0) + ' × ' + fmt(q, 0) + ' %'; };
  h += '<tr><td>Valeur de revente estimée, fin d’année ' + S.n + '</td><td>' + F('– ' + eur(S.vrE), fvr(S.pE, d.resE)) + '</td><td>' + F('– ' + eur(S.vrD), fvr(S.pD, d.resD)) + '</td></tr>';
  h += '<tr><td>Amortissement classique par an</td><td>' + F(eur(S.baseE / S.n), '(' + fmt(S.pE, 0) + FXM + fmt(S.vrE, 0) + ') ÷ ' + S.n) + '</td><td>' + F(eur(S.baseD / S.n), '(' + fmt(S.pD, 0) + FXM + fmt(S.vrD, 0) + ') ÷ ' + S.n) + '</td></tr>';
  h += '<tr><td>Suramortissement par an</td><td>' + F(eur(S.surYr), fmt(S.sur, 0) + ' ÷ ' + S.n) + '</td><td>–</td></tr>';
  h += '<tr class="hl"><td>Total déduit par an</td><td>' + F(eur(S.yrE), fmt(S.baseE / S.n, 0) + ' + ' + fmt(S.surYr, 0)) + '</td><td>' + eur(S.yrD) + '</td></tr>';

function co2Block(r, d) {

  h += '<tr><td>Par an</td><td>' + fx(fmt(r.V.E.kg1 / 1000, 1) + ' t', fC(r.V.E) + ' kg') + '</td><td>' + fx(fmt(r.V.D.kg1 / 1000, 1) + ' t', fC(r.V.D) + ' kg') + '</td><td>' + fx(fmt(r.co2Year, 1) + ' t', fxTag('co2d') + fmt(r.V.D.kg1 / 1000, 1) + FXM + fmt(r.V.E.kg1 / 1000, 1)) + '</td></tr>';

  h += '</table>';

}
/* Lien entre CO₂ et marchandise transportée (charge moyenne saisie) */
function co2FreightBlock(r, d) {
  var t = d.chargeT, tkmAn = t * r.kmAn;
  if (!(t > 0) || !(tkmAn > 0)) { return '<div class="basis">Renseigne la charge transportée moyenne (carte Usage et chargement) pour rapporter le CO₂ aux tonnes transportées.</div>'; }
  var day = r.P.days > 0 ? r.kmAn / r.P.days : 0;
  var gE = r.V.E.kg1 * 1000 / tkmAn, gD = r.V.D.kg1 * 1000 / tkmAn;
  var a = esc(N1(d)), b = esc(N2(d));
  var h = '<div class="st">CO₂ et marchandise transportée</div>';
  var mxg = Math.max(gE, gD, 1e-9);
  h += '<div class="syh" style="margin:6px 0 10px;display:block"><div style="font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#00529b;font-weight:800">Grammes de CO₂ par tonne transportée sur un kilomètre</div>';
  h += '<div class="syb"><div><span>' + a + '</span><b>' + fmt(gE, 1) + ' g/t·km</b></div><p><i style="width:' + Math.max(1.5, gE / mxg * 100).toFixed(1) + '%;background:linear-gradient(90deg,#16a37a,#4ef0b5)"></i></p></div>';
  h += '<div class="syb"><div><span>' + b + '</span><b>' + fmt(gD, 1) + ' g/t·km</b></div><p><i style="width:' + Math.max(1.5, gD / mxg * 100).toFixed(1) + '%;background:linear-gradient(90deg,#3b5e8c,#8fa9c8)"></i></p></div>';
  h += '<div style="font-size:9.5px;color:#6b7683">Charge moyenne de ' + fmt(t, 1) + ' t, ' + fmt(r.kmAn, 0) + ' km par an ; émissions à l’usage (facteurs de la carte CO₂).</div></div>';
  h += '<table class="t sm">' + th2(d, 'Évité par ' + a);
  h += '<tr><td>Par tonne-kilomètre</td><td>' + fmt(gE, 1) + ' g</td><td>' + fmt(gD, 1) + ' g</td><td>' + fmt(gD - gE, 1) + ' g</td></tr>';
  if (day > 0) { h += '<tr><td>Par tonne livrée sur la tournée type (' + fmt(day, 0) + ' km)</td><td>' + fmt(gE * day / 1000, 1) + ' kg</td><td>' + fmt(gD * day / 1000, 1) + ' kg</td><td>' + fmt((gD - gE) * day / 1000, 1) + ' kg</td></tr>'; }
  h += '<tr class="hl"><td>Par an, pour ' + fmt(tkmAn / 1e6, 2) + (tkmAn / 1e6 >= 2 ? ' millions' : ' million') + ' de t·km</td><td>' + fmt(r.V.E.kg1 / 1000, 1) + ' t</td><td>' + fmt(r.V.D.kg1 / 1000, 1) + ' t</td><td>' + fmt(r.co2Year, 1) + ' t</td></tr>';
  h += '</table>';
  var ok = r.co2Total >= 0;
  h += '<div class="callout ' + (ok ? 'ok' : 'bad') + '">Avec ' + fmt(t, 1) + ' t de marchandise en moyenne, ' + a + ' transporte ' + fmt(tkmAn * r.n / 1e6, 2) + (tkmAn * r.n / 1e6 >= 2 ? ' millions' : ' million') + ' de tonnes-kilomètres sur ' + ans(r.n) + ' en émettant <b>' + fmt(gE, 1) + ' g de CO₂ par tonne-kilomètre</b>, contre ' + fmt(gD, 1) + ' g pour ' + b + '. ' + (ok ? 'Chaque tonne livrée sur la tournée type évite ' + fmt((gD - gE) * day / 1000, 1) + ' kg de CO₂, soit ' + fmtT(r.co2Total) + ' t évitées sur la période.' : a + ' émet davantage de CO₂ par tonne transportée.') + '</div>';
  return h;
}

function scenarioText(d, on) {
  var parts = [];
  if (on.energie && anyTherm(d)) { parts.push('gazole ' + sgn(d.scDiesel) + ' %'); }
  if (on.energie && anyElec(d)) { parts.push('électricité ' + sgn(d.scElec) + ' %'); }

  return parts.join(', ');
}

/* Tableau d'exploitation : comparaison poste par poste, année 1, au total et au km (c'est le résultat de l'indicateur « Exploitation » de la page 1) */
/* Exploitation avec acquisition : coûts d'usage de l'année 1 + acquisition nette étalée sur la durée de l'étude
   (achat ou loyers, borne, intérêts, batterie, moins aides, avantages fiscaux et revente). Total = coût total de possession. */
function acqRows(r, X) {
  var c = X === 'E' ? r.cE : r.cD, it = r.IT[X], n = r.n, y, abo = 0, cert = 0, res = X === 'E' ? r.resE : r.resD;
  for (y = 1; y <= n; y++) { abo += it.borneAbo[y] || 0; cert += r.V[X].yr.certif[y] || 0; }
  return [
    ['Achat ou loyers', (c.achat + c.loyer) / n],
    ['Borne de recharge (investissement)', (c.borne - abo) / n],
    ['Intérêts du financement', c.fin / n],
    ['Batterie (remplacement)', c.batt / n],
    ['Aides et avantages fiscaux (déduits)', -(c.aides + c.recettes - cert) / n],
    ['Valeur de revente (déduite)', -res / n]
  ];
}
function exploitAcq(r) {
  var o = { n: r.n }, X, rows, t, k;
  for (X in { E: 1, D: 1 }) {
    rows = acqRows(r, X); t = 0;
    for (k = 0; k < rows.length; k++) { t += rows[k][1]; }
    o[X] = { op: X === 'E' ? r.opE1 : r.opD1, acq: t };
    o[X].tot = o[X].op + o[X].acq;
  }
  o.sav = o.D.tot - o.E.tot;
  o.perKm = r.kmAn > 0 ? o.sav / r.kmAn : 0;
  return o;
}
function exploitTable(r, d, on) {
  var km = r.kmAn > 0 ? r.kmAn : 1, rows = [], X;
  var itv = function (k, X) { return r.IT[X][k][1] || 0; };
  var def = [
    ['Énergie', 'ene', function (X) { return itv('ene', X); }],
    ['Entretien', 'ent', function (X) { return itv('ent', X); }],
    ['Assurance et taxes', 'ass', function (X) { return itv('ass', X); }],
    ['AdBlue', 'adb', function (X) { return itv('adb', X); }],
    ['Abonnement de la borne (part de ce camion)', 'borne', function (X) { return itv('borneAbo', X); }],
    ['Temps chauffeur en recharge', null, function (X) { return itv('chauf', X); }],
    ['Taxes à venir (carbone, péages)', null, function (X) { return itv('taxes', X); }],
    ['Certificats sur la recharge au dépôt (déduits)', null, function (X) { return -(r.V[X].yr.certif[1] || 0); }]
  ];
  var h = '<div class="st">Exploitation · comparaison poste par poste, par an et par km · HT</div>';
  h += '<table class="t sm"><tr><th rowspan="2"></th><th colspan="2">' + esc(N1(d)) + '</th><th colspan="2">' + esc(N2(d)) + '</th><th colspan="2">Avantage ' + esc(N1(d)) + '</th></tr>';
  h += '<tr><th>€ par an</th><th>€ / km</th><th>€ par an</th><th>€ / km</th><th>€ par an</th><th>€ / km</th></tr>';
  var i, a, b, tE = 0, tD = 0;
  for (i = 0; i < def.length; i++) {
    a = def[i][2]('E'); b = def[i][2]('D');
    if (Math.abs(a) < 0.5 && Math.abs(b) < 0.5) { continue; }
    tE += a; tD += b;
    var kd = def[i][1];
    h += '<tr><td>' + def[i][0] + '</td><td>' + fx(eur(a), kd ? fxTag(kd, 'E') + fmt(a, 0) + ' €/an' : '') + '</td><td>' + fx(fmt(a / km, 3) + ' €', '÷ ' + fmt(km, 0) + ' km') + '</td><td>' + fx(eur(b), kd ? fxTag(kd, 'D') + fmt(b, 0) + ' €/an' : '') + '</td><td>' + fx(fmt(b / km, 3) + ' €', '÷ ' + fmt(km, 0) + ' km') + '</td><td>' + fx(eur(b - a), fmt(b, 0) + FXM + fmt(a, 0)) + '</td><td>' + fx(fmt((b - a) / km, 3) + ' €', fmt(b - a, 0) + ' ÷ ' + fmt(km, 0)) + '</td></tr>';
  }
  var kmv = function (v) { return fx(fmt(v / km, 3) + ' €', '÷ ' + fmt(km, 0) + ' km'); };
  var row3 = function (label, a2, b2, cls) {
    return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td><td>' + eur(a2) + '</td><td>' + kmv(a2) + '</td><td>' + eur(b2) + '</td><td>' + kmv(b2) + '</td><td>' + eur(b2 - a2) + '</td><td>' + kmv(b2 - a2) + '</td></tr>';
  };
  h += row3('Exploitation (hors acquisition)', tE, tD, 'hl');
  var AE = acqRows(r, 'E'), AD = acqRows(r, 'D'), aE = 0, aD = 0;
  h += '<tr><td colspan="7" style="background:#f4f7fb;font-weight:700;color:#00529b;font-size:10.5px">Acquisition, étalée sur ' + ans(r.n) + ' (total de la période ÷ ' + r.n + ')</td></tr>';
  for (i = 0; i < AE.length; i++) {
    a = AE[i][1]; b = AD[i][1];
    if (Math.abs(a) < 0.5 && Math.abs(b) < 0.5) { continue; }
    aE += a; aD += b;
    h += row3(AE[i][0] === 'Intérêts du financement' ? esc(finLabel(r)) : AE[i][0], a, b);
  }
  h += row3('Acquisition (hors exploitation)', aE, aD, 'hl');
  h += row3('Exploitation, acquisition incluse', tE + aE, tD + aD, 'hl');
  h += '</table>';
  h += '<div class="basis">Exploitation : année 1, ' + fmt(km, 0) + ' km par an, hors acquisition. Acquisition : coûts d’achat ou de location, borne, intérêts et batterie, moins aides, avantages fiscaux et revente, répartis sur ' + ans(r.n) + '. Exploitation et acquisition réunies, le total est le coût total de possession ramené à une année moyenne (énergie de l’année 1). Sans acquisition, ' + esc(N1(d)) + ' coûte <b>' + eur(Math.abs(tD - tE)) + '</b> ' + (tD >= tE ? 'de moins' : 'de plus') + ' par an à l’usage ; avec acquisition, <b>' + eur(Math.abs((tD + aD) - (tE + aE))) + '</b> ' + ((tD + aD) >= (tE + aE) ? 'de moins' : 'de plus') + '.</div>';
  return h;
}

function modelWarnings(d, on, r) {
  var w = [];

  if (on.achat && (r.leaseShortE || r.leaseShortD)) {

  }
  if (isComplet()) {
    if (!on.entretien) { w.push('Entretien désactivé : ce poste est exclu du coût total.'); }

    if (anyElec(d) && !on.batterie) { w.push('Carte Batterie désactivée : la dégradation n’est pas intégrée aux coûts, mais le schéma de niveau de charge d’une semaine type reste dans le rapport.'); }
    if (!on.assur) { w.push('Assurance désactivée : ce poste est exclu du coût total.'); }
    if (anyElec(d) && !on.borne) { w.push('Investissement et abonnement de recharge au dépôt désactivés : vérifier qu’ils sont déjà pris en charge ailleurs.'); }
    if (on.energie && !on.recharge && bats.some(function (b) { return !b.okRange; })) { w.push('La tournée dépasse les km possibles par jour pour la tournée prévue : la recharge en route n’est pas chiffrée car la recharge publique est désactivée. Tu peux activer des recharges d’appoint au dépôt et/ou la recharge publique.'); }
    if (on.appoint && !appointActive(on, d)) { w.push('Recharges d’appoint au dépôt activées mais nombre, durée ou énergie nuls : aucun kWh d’appoint n’est compté.'); }
    if (on.appoint && on.recharge && d.rechMode !== 'auto') { w.push('L’appoint au dépôt allonge l’autonomie mais ne réduit pas le volume public saisi (kWh ou durée). Passe la recharge publique en mode automatique pour que l’appoint diminue le complément public.'); }
    if (on.recharge && d.rechMode === 'auto' && !on.batterie) { w.push('Le mode automatique (ce que le dépôt ne couvre pas) nécessite la carte Batterie ; sans elle le mix public ne peut pas être estimé.'); }
    if (on.batterie && d.bornePuis > 0 && bats.some(function (b) { return b.cap > 0 && !b.okWindow; })) { w.push('Le temps de recharge estimé au dépôt dépasse la fenêtre disponible ; une borne plus puissante ou une recharge complémentaire peut être nécessaire.'); }
    if (on.batterie && (d.socFin > 100 || d.socFin <= marginPct(d))) { w.push('Les niveaux de charge sont incohérents : le niveau de recharge visé doit être compris entre 1 et 100 %.'); }
    if (on.recharge && (d.rechPow <= 0 || (d.rechMode === 'dur' && d.rechDur <= 0))) { w.push('Les paramètres de puissance ou de durée de recharge publique ne permettent pas d’estimer une recharge exploitable.'); }
    if (on.revente) { w.push('La valeur de revente est une estimation forfaitaire saisie par l’utilisateur ; elle n’est pas prédite à partir du kilométrage, de l’âge ou de l’état de santé de la batterie.'); }
  }
  ['E', 'D'].forEach(function (X) { if (r.A[X].aideBlocked) { w.push('Aide au tracteur ' + r.V[X].name + ' non prise en compte : elle n’est acquise que si le client garde le véhicule au moins ' + AIDE_MIN_ANS + ' ans, or l’étude porte sur ' + ans(r.n) + '.'); } });
  if (anyElec(d) && d.win.hcWait && on.contrat && hcRanges(state)) { w.push('Heures creuses activées sans heure de retour au dépôt : la recharge est comptée au prix des heures pleines.'); }
  if (anyElec(d) && on.batterie && d.win.given && d.win.D > 24 - REPOS_MIN + 1e-9) { w.push('Journée de travail de plus de 13 h : un chauffeur seul n’a plus ses ' + REPOS_MIN + ' h de repos journalier (double équipage ?).'); }
  if (on.recharge && d.rechMode === 'auto') { w.push('Recharge publique automatique : mix dépôt / public (besoin journalier moins le maximum injectable au dépôt pendant l’arrêt' + (on.appoint ? ' et l’appoint au dépôt' : '') + '). Ce n’est pas une simulation d’itinérance (pertes, files, détours, multi-top-up). Le graphe de semaine illustre une semaine type, distinct du total annuel du TCO.'); }
  else if (on.recharge) { w.push('La recharge publique est un modèle simplifié : pertes de charge, courbe de puissance, disponibilité des bornes, files d’attente et détours ne sont pas simulés.'); }
  if (on.co2 && bats.some(function (b) { return b.replYears.length > 0; })) { w.push('Les émissions de CO₂ à l’usage intègrent la consommation électrique liée au vieillissement de la batterie, mais pas les émissions de fabrication/remplacement de la batterie.'); }
  return w;
}

/* Si le contenu d'une page dépasse la hauteur A4 (polices plus grandes selon l'appareil), il est réduit pour tenir */
var PAGE_AVAIL = 1122 - 34 - 52;
function fitPageContent(root) {
  var pages = root.getElementsByClassName('page');
  var tooDense = [];
  var i, j, pg, pc, kids, hgt, k;
  for (i = 0; i < pages.length; i++) {
    pg = pages[i];
    pc = pg.querySelector(':scope > .pgc');
    if (!pc) {
      pc = document.createElement('div');
      pc.className = 'pgc';
      kids = [];
      for (j = 0; j < pg.childNodes.length; j++) { if (!(pg.childNodes[j].classList && pg.childNodes[j].classList.contains('foot'))) { kids.push(pg.childNodes[j]); } }
      for (j = 0; j < kids.length; j++) { pc.appendChild(kids[j]); }
      pg.insertBefore(pc, pg.firstChild);
    }
    pc.style.transform = ''; pc.style.width = '';
    hgt = pc.offsetHeight;
    if (hgt > PAGE_AVAIL) {
      k = PAGE_AVAIL / hgt;
      pc.style.transformOrigin = 'top left';
      pc.style.transform = 'scale(' + k.toFixed(4) + ')';
      pc.style.width = (100 / k).toFixed(3) + '%';
      if (k < 0.86) { tooDense.push(i + 1); }
    }
  }
  return tooDense;
}
function fitPages() {
  var host = document.getElementById('pagesHost');
  var w = host.clientWidth;
  if (!w) { return; }
  var sc = Math.min(1, w / 794);
  var wraps = host.getElementsByClassName('pgwrap');
  var i, sEl;
  for (i = 0; i < wraps.length; i++) {
    sEl = wraps[i].firstChild;
    sEl.style.transform = 'scale(' + sc + ')';
    wraps[i].style.width = (794 * sc) + 'px';
    wraps[i].style.height = (1122 * sc) + 'px';
  }
}

/* ----- PDF ----- */
function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function startPdf() {
  var d = readData(state);
  var on = effOn();
  var r = compute(d, on);
  if (!r.valid) { return; }
  var pages = buildPages(r, d, on);
  if (!window.html2canvas || !window.jspdf) {
    printFallback(pages);
    return;
  }
  var btn = document.getElementById('btnPdf');
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Génération du PDF…';
  var stage = document.getElementById('stage');
  stage.innerHTML = pages.join('');
  fitPageContent(stage);
  var els = stage.getElementsByClassName('page');
  var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
  var idx = 0;
  var name = fileSafe('MasterTCO - ' + dosAutoName(d.client, { valid: !!r.valid, complet: isComplet(), n: r.n, tcoSav: r.tcoSav, eneSav: r.an ? r.an.ecoHT : 0 })) + '.pdf';

  function finish(ok) {
    stage.innerHTML = '';
    btn.disabled = false;
    btn.textContent = label;
    if (!ok) { printFallback(pages); }
  }
  function next() {
    if (idx >= els.length) {
      finish(true);
      pdfDeliver(pdf.output('blob'), name);
      return;
    }
    /* JPEG haute qualité : ~250 dpi, rendu net pour quelques Mo au lieu de centaines en PNG */
    window.html2canvas(els[idx], { scale: 2.6, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0 }).then(function (canvas) {
      if (idx > 0) { pdf.addPage(); }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      idx++;
      next();
    }).catch(function () {
      finish(false);
    });
  }
  next();
}
/* PDF prêt : partage direct (mail, messagerie, Drive…) sur téléphone, sinon téléchargement */
function pdfDownloadBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
}
function pdfDeliver(blob, name) {
  var file = null;
  try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) { file = null; }
  var canShare = !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
  var mobile = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (!canShare || !mobile) { pdfDownloadBlob(blob, name); return; }
  var size = blob.size >= 1048576 ? fmt(blob.size / 1048576, 1) + ' Mo' : fmt(blob.size / 1024, 0) + ' Ko';
  showModal('Rapport prêt', name + ' · ' + size + '. Partage-le directement (mail, messagerie, Drive…) ou enregistre-le sur l’appareil.', 'Partager', function () {
    navigator.share({ files: [file], title: name }).catch(function (err) {
      if (!err || err.name !== 'AbortError') { pdfDownloadBlob(blob, name); }
    });
  }, '', 'Télécharger', function () { pdfDownloadBlob(blob, name); });
  document.getElementById('mOk').className = 'btn main';
}
function downloadPdf() {
  var miss = missingList();
  if (miss.length > 0) {
    showModal('Données manquantes', miss.length + ' donnée(s) ne sont pas renseignées ou sont invalides. Les as-tu oubliées ?', 'Télécharger quand même', startPdf, missingHtml(miss), 'Compléter', goToFirstMissing);
  } else {
    startPdf();
  }
}
function printFallback(pages) {
  var pa = document.getElementById('printArea');
  pa.innerHTML = pages.join('');
  window.print();
}

/* ----- Événements ----- */
var KM_DEFAULT_NB = { jour: '220', sem: '46', mois: '11' };
function fmtNb(n, d) {
  var x = Math.round(n * Math.pow(10, d || 0)) / Math.pow(10, d || 0);
  return String(x).replace('.', ',');
}
function linkUsageCalendar(s, key, prev) {
  var jS = Math.min(7, Math.max(1, Math.round(num(s.joursSem)) || 5));
  var prevD = prev && prev.joursSem > 0 && prev.joursSem <= 7 ? prev.joursSem : jS;
  var weeks, ja;
  s.joursSem = String(jS);
  if (key === 'joursSem') {
    if (s.kmUnit === 'sem' && num(s.kmNb) > 0) { weeks = num(s.kmNb); }
    else if (s.kmUnit === 'mois' && num(s.kmNb) > 0) { weeks = num(s.kmNb) * WEEKS_PER_YEAR / MONTHS_PER_YEAR; }
    else if (s.kmUnit === 'jour' && num(prev && prev.kmNb) > 0) { weeks = num(prev.kmNb) / prevD; }
    else if (prev && prev.joursAn > 0) { weeks = prev.joursAn / prevD; }
    else { weeks = 44; }
    if (!(weeks > 0)) { weeks = 44; }
    ja = Math.max(1, Math.min(366, Math.round(jS * weeks)));
    s.joursAn = String(ja);
    if (s.kmUnit === 'jour') { s.kmNb = String(ja); }
    else if (s.kmUnit === 'sem') { s.kmNb = fmtNb(weeks, 1); }
  } else if (key === 'joursAn') {
    ja = Math.max(1, Math.min(366, Math.round(num(s.joursAn))));
    s.joursAn = String(ja);
    if (s.kmUnit === 'jour') { s.kmNb = String(ja); }
    else if (s.kmUnit === 'sem') { s.kmNb = fmtNb(ja / jS, 1); }
    else if (s.kmUnit === 'mois') { s.kmNb = fmtNb(ja / jS * MONTHS_PER_YEAR / WEEKS_PER_YEAR, 1); }
  } else if (key === 'kmNb') {
    if (s.kmUnit === 'jour') {
      ja = Math.max(1, Math.min(366, Math.round(num(s.kmNb))));
      s.kmNb = String(ja);
      s.joursAn = String(ja);
    } else if (s.kmUnit === 'sem') {
      weeks = num(s.kmNb);
      s.joursAn = String(Math.max(1, Math.min(366, Math.round(weeks * jS))));
    } else if (s.kmUnit === 'mois') {
      weeks = num(s.kmNb) * WEEKS_PER_YEAR / MONTHS_PER_YEAR;
      s.joursAn = String(Math.max(1, Math.min(366, Math.round(weeks * jS))));
    }
  } else if (key === 'kmUnit') {
    if (s.kmUnit === 'jour') { s.kmNb = s.joursAn || KM_DEFAULT_NB.jour; }
    else if (s.kmUnit === 'sem') {
      weeks = num(s.joursAn) > 0 ? num(s.joursAn) / jS : 44;
      s.kmNb = fmtNb(weeks, 1);
    } else if (s.kmUnit === 'mois') {
      weeks = num(s.joursAn) > 0 ? num(s.joursAn) / jS : 44;
      s.kmNb = fmtNb(weeks * MONTHS_PER_YEAR / WEEKS_PER_YEAR, 1);
    } else { s.kmNb = ''; }
  }
}
function onFieldEvent(e) {

      var prevN = DEF_NAMES[cmpOf(state)], nextN = DEF_NAMES[newCmp];
      var n1 = String(state.nom1 || '').replace(/^\s+|\s+$/g, ''), n2 = String(state.nom2 || '').replace(/^\s+|\s+$/g, '');
      if (!n1 || n1 === prevN.E) { state.nom1 = nextN.E; }
      if (!n2 || n2 === prevN.D) { state.nom2 = nextN.D; }
      state.cmp = newCmp; saveState(); fillInputs(); refreshAll();

    });

    return;
  }
  if (e.type === 'change' && t.tagName === 'INPUT' && state[key] === t.value) { return; }
  var prevAnnual = (key === 'kmUnit') ? annualKm(readData(state)) : 0;
  var prevCal = { joursSem: num(state.joursSem), joursAn: num(state.joursAn), kmNb: num(state.kmNb) };
  state[key] = t.value;
  if (key === 'kmUnit' || key === 'joursSem' || key === 'joursAn' || key === 'kmNb') {
    linkUsageCalendar(state, key, prevCal);
  }
  if (key === 'kmUnit') {
    var nbP = t.value === 'an' ? 1 : num(state.kmNb);
    if (prevAnnual > 0 && nbP > 0) {
      state.kmPer = (t.value === 'an' ? String(Math.round(prevAnnual)) : String(Math.round(prevAnnual / nbP * 10) / 10)).replace('.', ',');
    }
  }
  if (e.type === 'change' || t.tagName === 'SELECT') { fillInputs(); }
  saveState();
  refreshAll();
}
document.addEventListener('input', onFieldEvent);

document.addEventListener('click', function (e) {

    if (el.getAttribute && el.getAttribute('data-action')) {
      action = el.getAttribute('data-action');

    }

  }
  if (!action || el.disabled) { return; }

  if (action === 'fx') { FX_ON = !FX_ON; renderReport(); }
  else if (action === 'go-rapport') { showTab('rapport'); }
  else if (action === 'toggle') {

    if (GROUP_BY_ON[key] && GROUP_BY_ON[key].fixed) { return; }
    ons[key] = !ons[key];
    saveState();
    refreshAll();
  }
  else if (action === 'fold') {
    var fid = el.getAttribute('data-id');
    if (fid) { setFolded(fid, !isFolded(fid)); }
  }

/* ===================== DOSSIERS CLIENTS (stockage local + fichier de sauvegarde) ===================== */
var DOS_KEY = 'masterTCO_dossiers_v1';

function dosLoad() {

  dosStudies = [];

    try { o = JSON.parse(raw); if (o && o.studies && o.studies.length >= 0) { dosStudies = o.studies.filter(dosValidStudy); } } catch (e2) { dosStudies = []; }
  }

}
function dosPersist() {
  try {
    localStorage.setItem(DOS_KEY, JSON.stringify({ format: DOS_FORMAT, version: 1, studies: dosStudies }));
    return true;
  } catch (e) {
    showModal('Enregistrement impossible', 'Le navigateur a refusé l’enregistrement (mémoire pleine ou navigation privée). Exporte tes dossiers dans un fichier pour ne rien perdre.', 'Exporter', dosExport);
    return false;
  }
}
function dosSetCurrent(id) {
  dosCurrent = id || null;
  try { if (dosCurrent) { localStorage.setItem(DOS_CUR_KEY, dosCurrent); } else { localStorage.removeItem(DOS_CUR_KEY); } } catch (e) {}
}
function dosValidStudy(x) {
  return !!(x && typeof x.id === 'string' && x.data && typeof x.data === 'object' && x.data.v && typeof x.data.v === 'object');
}
function dosFind(id) {
  var i;
  for (i = 0; i < dosStudies.length; i++) { if (dosStudies[i].id === id) { return dosStudies[i]; } }
  return null;
}
function dosNewId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dosSnapshot() { return { v: copyObj(state), on: copyObj(ons) }; }
function dosSig(o) {
  var v = o.v || {}, on = o.on || {};
  var keys = Object.keys(v).sort(), okeys = Object.keys(on).sort();
  var a = [], i;
  for (i = 0; i < keys.length; i++) { a.push(keys[i] + '=' + v[keys[i]]); }
  for (i = 0; i < okeys.length; i++) { a.push(okeys[i] + ':' + (on[okeys[i]] ? 1 : 0)); }
  return a.join('|');
}
function dosKpi() {
  try {
    var d = readData(state);
    var r = compute(d, effOn());
    return { valid: !!r.valid, complet: isComplet(), n: r.n, tcoSav: r.tcoSav, eneSav: r.an ? r.an.ecoHT : 0 };
  } catch (e) { return { valid: false }; }
}
function dosModified() {

}
function dosDate(ts) {

  var d = new Date(ts);

}
function dosToday() { return new Date().toLocaleDateString('fr-FR'); }
/* Nom d'enregistrement : client, date du jour et résultat financier */
function dosEurPlain(v) { return fmt(Math.abs(v), 0).replace(/[\u202f\u00a0]/g, ' ') + ' €'; }
function dosResult(k) {
  if (!k || !k.valid) { return 'résultat non calculé'; }
  if (k.complet) { return (k.tcoSav >= 0 ? 'Économie ' : 'Surcoût ') + dosEurPlain(k.tcoSav) + ' sur ' + ans(k.n); }
  return (k.eneSav >= 0 ? 'Économie énergie ' : 'Surcoût énergie ') + dosEurPlain(k.eneSav) + ' par an';
}
function dosDateFile() { var t = new Date(); return ('0' + t.getDate()).slice(-2) + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + t.getFullYear(); }
function dosAutoName(client, k) {
  var c = String(client || '').replace(/^\s+|\s+$/g, '') || 'Sans client';

}
function fileSafe(s) {
  var t = String(s).replace(/€/g, 'EUR').replace(/[\u202f\u00a0]/g, ' ');
  if (t.normalize) { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  t = t.replace(/[œŒ]/g, 'oe').replace(/[æÆ]/g, 'ae').replace(/[^\x20-\x7e]/g, '');
  return t.replace(/[\/\\:*?"<>|]+/g, '-').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');

function dosNorm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function renderDossiers() {

  var groups = {}, names = [];

/* ----- Export / import du fichier de sauvegarde ----- */
function dosExport() {
  if (!dosStudies.length) { toast('Aucune étude à exporter'); return; }
  var now = new Date();
  var stamp = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
  var clients = {}, nCl = 0, latest = null, i0;
  for (i0 = 0; i0 < dosStudies.length; i0++) {
    var cn = dosClientName(dosStudies[i0]);
    if (!clients[cn]) { clients[cn] = 1; nCl++; }
    if (!latest || (dosStudies[i0].updated || 0) > (latest.updated || 0)) { latest = dosStudies[i0]; }
  }
  var name = fileSafe('MasterTCO - ' + (nCl === 1 ? dosAutoName(dosClientName(latest), latest.kpi) : nCl + ' clients - ' + dosDateFile() + ' - ' + dosStudies.length + ' études')) + '.json';
  var json = JSON.stringify({ format: DOS_FORMAT, version: 1, exported: now.getTime(), studies: dosStudies }, null, 1);
  var blob = new Blob([json], { type: 'application/json' });
  function done() {
    try { localStorage.setItem(DOS_EXPORT_KEY, String(Date.now())); } catch (e) {}
    renderDossiers();
    toast(dosStudies.length + ' étude(s) exportée(s)');
  }
  function download() {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    done();
  }
  var file = null;
  try { file = new File([blob], name, { type: 'application/json' }); } catch (e) { file = null; }
  var mobile = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (mobile && file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    navigator.share({ files: [file], title: name }).then(done).catch(function (err) {
      if (!err || err.name !== 'AbortError') { download(); }
    });
  } else { download(); }
}
function dosImportClick() {
  var f = document.getElementById('dosFile');
  f.value = '';
  f.click();
}
function dosImportFile(file) {
  if (!file) { return; }
  var rd = new FileReader();
  rd.onload = function () {
    var o = null;
    try { o = JSON.parse(String(rd.result)); } catch (e) { o = null; }
    if (!o || o.format !== DOS_FORMAT || !o.studies || typeof o.studies.length !== 'number') {
      showModal('Fichier non reconnu', 'Ce fichier n’est pas une sauvegarde de dossiers MasterTCO.', 'OK', null);
      return;
    }
    var add = 0, upd = 0, same = 0, bad = 0, i, x, cur;
    var prev = JSON.parse(JSON.stringify(dosStudies));
    for (i = 0; i < o.studies.length; i++) {
      x = o.studies[i];
      if (!dosValidStudy(x)) { bad++; continue; }
      x = { id: x.id, client: String(x.client || ''), name: String(x.name || 'Étude'), created: +x.created || Date.now(), updated: +x.updated || Date.now(), data: { v: x.data.v, on: x.data.on || {} }, kpi: x.kpi || {} };
      cur = dosFind(x.id);
      if (!cur) { dosStudies.push(x); add++; }
      else if (x.updated > cur.updated) { dosStudies[dosStudies.indexOf(cur)] = x; upd++; }
      else { same++; }
    }
    if (!dosPersist()) { dosStudies = prev; return; }
    renderDossiers();
    refreshAll();
    var parts = [];
    parts.push(add + ' étude(s) ajoutée(s)');
    if (upd) { parts.push(upd + ' mise(s) à jour par une version plus récente'); }
    if (same) { parts.push(same + ' déjà présente(s) et conservée(s)'); }
    if (bad) { parts.push(bad + ' illisible(s) ignorée(s)'); }
    showModal('Import terminé', parts.join(' · ') + '.', 'OK', null);
  };
  rd.onerror = function () { showModal('Lecture impossible', 'Le fichier n’a pas pu être lu.', 'OK', null); };
  rd.readAsText(file);
}
document.getElementById('dosFile').addEventListener('change', function (e) { dosImportFile(e.target.files && e.target.files[0]); });
