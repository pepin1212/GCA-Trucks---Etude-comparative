<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MasterTCO</title>
<style>
:root{
  --brand:#00529b;
  --green:#1a9b6c;
  --orange:#e0642a;
  --red:#c62828;
  --bg:#f3f5f8;
  --card:#ffffff;
  --text:#1b2430;
  --muted:#6b7683;
  --line:#dde2e9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
#app{max-width:760px;margin:0 auto;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.top .tag{font-size:12px;opacity:.85}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:15px;font-weight:600;padding:10px 6px;border-radius:10px 10px 0 0;cursor:pointer;font-family:inherit}
.tab.on{background:var(--bg);color:var(--brand)}
.view{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font-size:16px;color:var(--brand)}
.card .note{margin:4px 0 0;font-size:13px;color:var(--muted)}
.cbody{margin-top:4px;transition:opacity .15s}
.card.off .cbody{opacity:.4}
.card.off h2{color:var(--muted)}
.sep{margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.field{margin-top:10px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.fhead label{font-size:13px;font-weight:600}
.fhead .hint{font-weight:400;color:var(--muted)}
.exb{display:none;flex:none;border:0;border-radius:8px;background:#fff0d9;color:#a35a00;font-size:11px;font-weight:700;padding:3px 8px;font-family:inherit;cursor:pointer}
.field.unmod .fhead label{color:var(--red)}
.field.unmod .inp{border-color:var(--red);background:#fff6f6}
.field.unmod .exb{background:#fdeaea;color:var(--red)}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.inp:focus-within{border-color:var(--brand)}
.inp input,.inp select.full{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:11px 12px;background:transparent;color:var(--text);font-family:inherit}
.inp select.full{appearance:auto}
.inp input:disabled,.inp select:disabled{color:var(--muted)}
.inp .unit{padding:0 12px;font-size:13px;color:var(--muted);white-space:nowrap;background:#f6f8fa;align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--line)}
.inp select.usel{flex:none;max-width:52%;border:0;border-left:1px solid var(--line);outline:0;background:#f6f8fa;color:var(--brand);font-size:14px;font-weight:600;padding:0 8px;align-self:stretch;font-family:inherit}
.calc{margin-top:8px;font-size:13px;color:var(--brand);background:#eaf2fb;border-radius:8px;padding:6px 10px}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#c5ccd6;position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on span{left:25px}
.modebar{background:#fff;border-radius:14px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modebar .mt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.mslider{position:relative;display:flex;background:#e6edf5;border-radius:12px;padding:3px}
.mthumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--brand);border-radius:10px;transition:transform .22s}
.mslider.right .mthumb{transform:translateX(100%)}
.mopt{position:relative;flex:1;text-align:center;padding:11px 4px;font-weight:700;font-size:14px;color:var(--brand);transition:color .2s;border:0;background:transparent;font-family:inherit;cursor:pointer}
.mopt.on{color:#fff}
.live{background:linear-gradient(135deg,#0b3d91,#00529b);color:#fff}
.live h2{color:#fff}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lbox{background:rgba(255,255,255,.14);border-radius:10px;padding:10px}
.lbox .t{font-size:12px;opacity:.85}
.lbox .v{font-size:18px;font-weight:700;margin-top:2px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.main{background:var(--brand);color:#fff}
.btn.sec{background:#e6edf5;color:var(--brand)}
.btn.danger{background:#fdeaea;color:#b42318}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.warn{background:#fff4e5;border:1px solid #f5c98b;color:#8a4b00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.warn.red{background:#fff1f1;border-color:#f0b4b4;color:var(--red)}
.warn .redlist{margin:6px 0 8px;padding-left:18px;color:var(--red)}
.warn .redlist li{margin-bottom:2px}
.warn .btn{padding:9px 12px;font-size:14px;margin-top:2px}
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pgwrap{margin:0 auto 14px;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.pgscale{transform-origin:top left;width:794px}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;max-height:86vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox .redlist{margin:0 0 12px;padding-left:18px;color:var(--red);font-size:14px}
/* Pages A4 (96 dpi) */
.page{width:794px;height:1122px;padding:30px 44px 52px;background:#fff;color:#1b2430;position:relative;overflow:hidden;font-size:13px;line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ph{border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:12px}
.ph-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ph-logos{display:flex;align-items:center;gap:14px}
.ph-logos img{display:block;height:38px;width:auto}
.lg-sep{width:1px;height:30px;background:#cfd6df}
.ph-brand{font-size:15px;font-weight:800;color:var(--brand);letter-spacing:.3px}
.ph-brand span{color:#6b7683;font-weight:600}
.ph-main{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.ph-t{font-size:22px;font-weight:800;color:var(--brand);line-height:1.15}
.ph-s{font-size:12.5px;color:#6b7683;margin-top:2px}
.ph-r{text-align:right;font-size:12px;color:#6b7683;white-space:nowrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.kpi{border-radius:12px;padding:10px 16px;color:#fff}
.kpi.g{background:var(--green)}
.kpi.b{background:var(--brand)}
.kpi .k1{font-size:12px;opacity:.92;text-transform:uppercase;letter-spacing:.4px}
.kpi .k2{font-size:28px;font-weight:800;margin-top:1px}
.kpi .k3{font-size:12px;opacity:.9}
.basis{font-size:11.5px;color:#6b7683;margin:6px 0 8px}
.st{font-size:15px;font-weight:700;color:var(--brand);margin:12px 0 6px;border-left:4px solid var(--brand);padding-left:8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#eef3f9;color:#00386b;text-align:right;padding:6px 8px;font-weight:700}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 8px;text-align:right;border-bottom:1px solid #e6eaf0}
table.t.sm{font-size:11.5px}
table.t.sm th{padding:4px 6px}
table.t.sm td{padding:3px 6px}
table.t tr.hl td{font-weight:800;background:#eaf7f1;color:#0d6b49}
.foot{position:absolute;left:44px;right:44px;bottom:20px;display:flex;justify-content:space-between;font-size:11px;color:#8a94a1;border-top:1px solid #e6eaf0;padding-top:6px}
.keys{margin:0;padding-left:18px;font-size:12.5px}
.keys li{margin-bottom:4px}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:0 5px 5px 0;background:#e3f5ec;color:#0d6b49}
.callout{background:#eaf2fb;border-left:4px solid var(--brand);padding:8px 12px;border-radius:6px;font-size:12px;margin:10px 0}
.callout.ok{background:#e9f7f0;border-color:var(--green)}
.callout.bad{background:#fff3e8;border-color:var(--orange)}
.annex{font-size:10.2px;line-height:1.3}
.a1grid{display:flex;gap:20px}
.a1col{flex:1;min-width:0}
.a1g{margin-bottom:9px}
.a1g h4{margin:0 0 3px;font-size:10.4px;color:var(--brand);border-bottom:1px solid #cfd8e3;padding-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.a1r{display:flex;justify-content:space-between;gap:8px;padding:1.6px 0;border-bottom:1px dotted #dfe5ec}
.a1r span:first-child{color:#3a4552}
.a1r span:last-child{font-weight:700;text-align:right}
table.a2{width:100%;border-collapse:collapse;font-size:9.2px;line-height:1.28}
table.a2 th{background:#eef3f9;color:#00386b;text-align:left;padding:3px 5px;font-weight:700}
table.a2 td{padding:2.6px 5px;border-bottom:1px solid #e6eaf0;vertical-align:top}
table.a2 td:first-child{font-weight:700;width:21%}
table.a2 td:nth-child(2){color:#3a4552;width:55%}
table.a2 td:last-child{text-align:right;font-weight:700;width:24%}
table.a2 tr.sec td{background:#f4f7fb;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:8.8px;text-align:left}
#stage{position:absolute;left:-10000px;top:0;width:794px}
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,#modal{display:none !important}
  #printArea{display:block}
  #printArea .page{break-after:page;page-break-after:always}
  #printArea .page:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1>MasterTCO</h1><span class="tag">Comparateur de coût total · électrique vs diesel</span></div>
    <div class="tabs">
      <button class="tab on" type="button" data-action="tab" data-tab="saisie" id="tab-saisie">Données</button>
      <button class="tab" type="button" data-action="tab" data-tab="rapport" id="tab-rapport">Rapport</button>
    </div>
  </header>

  <section class="view" id="view-saisie">
    <div class="modebar">
      <div class="mt">Type de rapport</div>
      <div class="mslider"><div class="mthumb"></div>
        <button type="button" class="mopt" data-action="mode" data-mode="conso">Consommation</button>
        <button type="button" class="mopt" data-action="mode" data-mode="complet">Étude complète</button>
      </div>
    </div>
    <div id="reviewBanner"></div>
    <div id="formHost"></div>
    <div class="card live" id="liveBox"></div>
    <div class="btns">
      <button class="btn main" type="button" data-action="go-rapport">Voir le rapport</button>
      <div class="row2">
        <button class="btn sec" type="button" data-action="reset">Réinitialiser</button>
        <button class="btn danger" type="button" data-action="clear">Tout effacer</button>
      </div>
    </div>
  </section>

  <section class="view" id="view-rapport" style="display:none">
    <div class="modebar">
      <div class="mt">Type de rapport</div>
      <div class="mslider"><div class="mthumb"></div>
        <button type="button" class="mopt" data-action="mode" data-mode="conso">Consommation</button>
        <button type="button" class="mopt" data-action="mode" data-mode="complet">Étude complète</button>
      </div>
    </div>
    <div id="reportWarn"></div>
    <div class="toolbar">
      <button class="btn main" type="button" data-action="pdf" id="btnPdf">Télécharger le rapport en PDF</button>
      <button class="btn sec" type="button" data-action="tab" data-tab="saisie">Modifier les données</button>
    </div>
    <div id="pagesHost"></div>
  </section>
</div>

<div id="stage"></div>
<div id="printArea"></div>

<div id="modal">
  <div class="mbox">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div id="mList"></div>
    <div class="row2">
      <button class="btn sec" type="button" data-action="modal-cancel" id="mCancel">Annuler</button>
      <button class="btn danger" type="button" data-action="modal-ok" id="mOk">Confirmer</button>
    </div>
  </div>
</div>

function niceStep(x) {

  var steps = Math.round((sc.max - sc.min) / sc.step);
  var t, y;
  for (i = 0; i <= steps; i++) {
    t = sc.min + i * sc.step;
    y = yv(t);
    s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y + '" y2="' + y + '" stroke="#e3e8ee" stroke-width="1"/>';

  }
  var gw = plotW / groups.length;

  s += '<rect x="' + padL + '" y="8" width="12" height="12" rx="2" fill="' + o.ca + '"/><text x="' + (padL + 18) + '" y="18" font-size="12" fill="#3a4552">' + esc(o.na) + '</text>';
  s += '<rect x="' + (padL + 150) + '" y="8" width="12" height="12" rx="2" fill="' + o.cb + '"/><text x="' + (padL + 168) + '" y="18" font-size="12" fill="#3a4552">' + esc(o.nb) + '</text>';
  s += '</svg>';

}

function stackedChart(w, h, bars, comps) {
  var padL = 70, plotRight = 420, padT = 28, padB = 30;
  var plotH = h - padT - padB;
  var maxT = 0, i, j, tot;
  for (i = 0; i < bars.length; i++) {
    tot = 0;
    for (j = 0; j < bars[i].vals.length; j++) { tot += bars[i].vals[j]; }
    if (tot > maxT) { maxT = tot; }
  }
  var sc = niceScale(0, maxT * 1.12, 4);
  var yv = function (v) { return padT + (sc.max - v) / (sc.max - sc.min) * plotH; };
  var s = svgOpen(w, h);
  var steps = Math.round((sc.max - sc.min) / sc.step);
  var t, y;
  for (i = 0; i <= steps; i++) {
    t = sc.min + i * sc.step;
    y = yv(t);
    s += '<line x1="' + padL + '" x2="' + plotRight + '" y1="' + y + '" y2="' + y + '" stroke="#e3e8ee" stroke-width="1"/>';
    s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" font-size="10.5" fill="#6b7683" text-anchor="end">' + fmt(t, 0) + '</text>';
  }
  var bw = 110;
  var gw = (plotRight - padL) / bars.length;
  var cx, cum, v, y0, y1;
  for (i = 0; i < bars.length; i++) {
    cx = padL + gw * i + gw / 2;
    cum = 0;
    for (j = 0; j < comps.length; j++) {
      v = bars[i].vals[j];
      if (v <= 0) { continue; }
      y0 = yv(cum);
      y1 = yv(cum + v);
      s += '<rect x="' + (cx - bw / 2) + '" y="' + y1 + '" width="' + bw + '" height="' + (y0 - y1) + '" fill="' + comps[j].color + '" stroke="#fff" stroke-width="1"/>';
      if (y0 - y1 >= 16) {
        s += '<text x="' + cx + '" y="' + ((y0 + y1) / 2 + 4) + '" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">' + eur(v) + '</text>';
      }
      cum += v;
    }
    s += '<text x="' + cx + '" y="' + (yv(cum) - 7) + '" font-size="12" font-weight="800" fill="#1b2430" text-anchor="middle">' + eur(cum) + '</text>';
    s += '<text x="' + cx + '" y="' + (h - 10) + '" font-size="12.5" font-weight="700" fill="#3a4552" text-anchor="middle">' + esc(bars[i].label) + '</text>';
  }
  s += '<line x1="' + padL + '" x2="' + plotRight + '" y1="' + yv(0) + '" y2="' + yv(0) + '" stroke="#9aa5b1" stroke-width="1.2"/>';
  var ly = 40, sum;
  for (j = comps.length - 1; j >= 0; j--) {
    sum = 0;
    for (i = 0; i < bars.length; i++) { sum += bars[i].vals[j]; }
    if (sum <= 0) { continue; }
    s += '<rect x="' + (plotRight + 36) + '" y="' + (ly - 11) + '" width="13" height="13" rx="2" fill="' + comps[j].color + '"/>';
    s += '<text x="' + (plotRight + 56) + '" y="' + ly + '" font-size="12" fill="#3a4552">' + esc(comps[j].name) + '</text>';
    ly += 24;
  }
  s += '</svg>';
  return s;
}

function lineChart(w, h, n, A, B, o) {
  var padL = 70, padR = 46, padT = 34, padB = 30;
  var plotW = w - padL - padR, plotH = h - padT - padB;
  var minV = 0, maxV = 0, i;
  for (i = 0; i <= n; i++) {
    if (A[i] > maxV) { maxV = A[i]; }
    if (B[i] > maxV) { maxV = B[i]; }
    if (A[i] < minV) { minV = A[i]; }
    if (B[i] < minV) { minV = B[i]; }
  }
  var sc = niceScale(minV, maxV * 1.12, 4);
  var yv = function (v) { return padT + (sc.max - v) / (sc.max - sc.min) * plotH; };
  var xv = function (k) { return padL + (n === 0 ? 0 : k / n * plotW); };
  var s = svgOpen(w, h);
  var steps = Math.round((sc.max - sc.min) / sc.step);
  var t, y;
  for (i = 0; i <= steps; i++) {
    t = sc.min + i * sc.step;
    y = yv(t);
    s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y + '" y2="' + y + '" stroke="#e3e8ee" stroke-width="1"/>';
    s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" font-size="10.5" fill="#6b7683" text-anchor="end">' + fmt(t, 0) + '</text>';
  }
  var ptsA = [], ptsB = [];
  for (i = 0; i <= n; i++) {
    ptsA.push(xv(i) + ',' + yv(A[i]));
    ptsB.push(xv(i) + ',' + yv(B[i]));
    s += '<text x="' + xv(i) + '" y="' + (h - 10) + '" font-size="11" fill="#3a4552" text-anchor="middle">' + (i === 0 ? o.x0 : 'An ' + i) + '</text>';
  }
  s += '<polyline points="' + ptsA.join(' ') + '" fill="none" stroke="' + o.ca + '" stroke-width="3" stroke-linejoin="round"/>';
  s += '<polyline points="' + ptsB.join(' ') + '" fill="none" stroke="' + o.cb + '" stroke-width="3" stroke-linejoin="round"/>';
  var showAll = n <= 6;
  var up, pa, pb, tx, anc;
  for (i = 0; i <= n; i++) {
    s += '<circle cx="' + xv(i) + '" cy="' + yv(A[i]) + '" r="4" fill="' + o.ca + '"/>';
    s += '<circle cx="' + xv(i) + '" cy="' + yv(B[i]) + '" r="4" fill="' + o.cb + '"/>';
    if ((showAll && i > 0) || i === n || (i === 0 && o.label0)) {
      up = A[i] >= B[i];
      pa = up ? yv(A[i]) - 9 : yv(A[i]) + 17;
      pb = up ? yv(B[i]) + 17 : yv(B[i]) - 9;
      tx = (i === n) ? xv(i) - 6 : xv(i);
      anc = (i === n) ? 'end' : 'middle';
      if (i === 0) { tx = xv(i) + 4; anc = 'start'; }
      s += '<text x="' + tx + '" y="' + pa + '" font-size="10" font-weight="700" fill="' + o.ca + '" text-anchor="' + anc + '">' + eur(A[i]) + '</text>';
      s += '<text x="' + tx + '" y="' + pb + '" font-size="10" font-weight="700" fill="' + o.cb + '" text-anchor="' + anc + '">' + eur(B[i]) + '</text>';
    }
  }
  s += '<line x1="' + padL + '" x2="' + (w - padR) + '" y1="' + yv(0) + '" y2="' + yv(0) + '" stroke="#9aa5b1" stroke-width="1.2"/>';
  s += '<rect x="' + padL + '" y="8" width="12" height="12" rx="2" fill="' + o.ca + '"/><text x="' + (padL + 18) + '" y="18" font-size="12" fill="#3a4552">' + esc(o.na) + '</text>';
  s += '<rect x="' + (padL + 200) + '" y="8" width="12" height="12" rx="2" fill="' + o.cb + '"/><text x="' + (padL + 218) + '" y="18" font-size="12" fill="#3a4552">' + esc(o.nb) + '</text>';
  s += '</svg>';
  return s;
}

/* ===================== ÉTAT, MODE, ACTIVATION ===================== */
var state = copyDefaults();
var ons = copyOn();
var touched = {};
var review = false;
var modalCb = null;

function copyDefaults() {
  var o = {};
  var k;
  for (k in DEFAULTS) {
    if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) { o[k] = DEFAULTS[k]; }
  }
  return o;
}
function copyOn() {
  var o = {};
  var k;
  for (k in DEFAULT_ON) {
    if (Object.prototype.hasOwnProperty.call(DEFAULT_ON, k)) { o[k] = DEFAULT_ON[k]; }
  }
  return o;
}
function effOn() {
  var o = copyOn();
  var k, i;
  for (k in ons) {
    if (Object.prototype.hasOwnProperty.call(ons, k)) { o[k] = !!ons[k]; }
  }
  if (state.mode === 'conso') {
    for (i = 0; i < CONSO_OFF.length; i++) { o[CONSO_OFF[i]] = false; }
  }
  return o;
}
function isComplet() { return state.mode !== 'conso'; }

function groupActive(g) {
  if (g.cx && !isComplet()) { return false; }
  if (g.on && !effOn()[g.on]) { return false; }
  return true;
}
function fieldVisible(f) {
  if (f.cx && !isComplet()) { return false; }
  if (f.vis && !f.vis(state)) { return false; }
  return true;
}
function fieldActive(k) {
  var g = GROUP_OF[k];
  var f = FIELD[k];
  if (!g || !f) { return false; }
  return groupActive(g) && fieldVisible(f);
}
function pendingKeys() {
  var list = [];
  var k;
  for (k in EX_KEYS) {
    if (Object.prototype.hasOwnProperty.call(EX_KEYS, k)) {
      if (!touched[k] && fieldActive(k)) { list.push(k); }
    }
  }
  return list;
}

function optLabel(list, v) {
  var i;
  for (i = 0; i < list.length; i++) { if (list[i][0] === v) { return list[i][1]; } }
  return '';
}
var DYN = { jour: 'jours', sem: 'semaines', mois: 'mois' };
function unitLabel(f) {
  if (f.unitKey) { return optLabel(f.units, state[f.unitKey]); }
  if (f.dynUnit) { return DYN[state.kmUnit] || ''; }
  return f.u || '';
}
function valueText(f) {
  if (f.select) { return optLabel(f.select, state[f.k]); }
  var v = String(state[f.k]);
  if (v === '') { return '–'; }
  if (!isText(f.k) && /^\s*-?[0-9][0-9\s]*([.,][0-9]+)?\s*$/.test(v)) {
    var dec = /[.,]([0-9]+)\s*$/.exec(v);
    v = fmt(num(v), dec ? dec[1].length : 0);
  }
  var u = unitLabel(f);
  return v + (u ? ' ' + u : '');
}

/* ----- Annexe 1 : données saisies ----- */
function annex1(r, d, on) {
  var cols = [[], []];
  var groups = [];
  var gi, fi, g, f, rows;
  var head = [['Type de rapport', isComplet() ? 'Étude complète' : 'Consommation seule']];
  groups.push({ title: 'Rapport', rows: head });
  for (gi = 0; gi < GROUPS.length; gi++) {
    g = GROUPS[gi];
    if (!groupActive(g)) { continue; }
    rows = [];
    for (fi = 0; fi < g.fields.length; fi++) {
      f = g.fields[fi];
      if (!f.k || !fieldVisible(f)) { continue; }
      if (TEXT_KEYS[f.k] && String(state[f.k]) === '') { continue; }
      rows.push([f.l, valueText(f)]);
    }
    if (rows.length > 0) { groups.push({ title: g.title, rows: rows }); }
  }
  var total = 0, i;
  for (i = 0; i < groups.length; i++) { total += groups[i].rows.length + 2; }
  var acc = 0;
  for (i = 0; i < groups.length; i++) {
    if (acc >= total / 2 && cols[1].length === 0 && cols[0].length > 0) { cols[1].push(groups[i]); }
    else if (cols[1].length > 0) { cols[1].push(groups[i]); }
    else { cols[0].push(groups[i]); }
    acc += groups[i].rows.length + 2;
  }
  var h = '<div class="page annex">' + headHtml(d);
  h += '<div class="st">Annexe 1 · Données renseignées</div><div class="a1grid">';
  var c, j, gg, k2;
  for (c = 0; c < 2; c++) {
    h += '<div class="a1col">';
    for (j = 0; j < cols[c].length; j++) {
      gg = cols[c][j];
      h += '<div class="a1g"><h4>' + esc(gg.title) + '</h4>';
      for (k2 = 0; k2 < gg.rows.length; k2++) {
        h += '<div class="a1r"><span>' + esc(gg.rows[k2][0]) + '</span><span>' + esc(gg.rows[k2][1]) + '</span></div>';
      }
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  h += footHtml(d, 'Annexe 1') + '</div>';
  return h;
}

var PER_NAME = { jour: 'jours', sem: 'semaines', mois: 'mois' };
function annex2(r, d, on) {
  var rows = [];
  var n = r.n;
  function sec(t) { rows.push({ sec: t }); }
  function add(a, b, c) { rows.push({ a: a, b: b, c: c }); }

  sec('Kilométrage et consommation');
  if (d.kmUnit === 'an') { add('Kilométrage annuel', 'Saisi directement', fmt(r.kmAn, 0) + ' km/an'); }
  else { add('Kilométrage annuel', fmt(d.kmPer, 0) + ' ' + optLabel(U_KM, d.kmUnit) + ' × ' + fmt(d.kmNb, 0) + ' ' + PER_NAME[d.kmUnit], fmt(r.kmAn, 0) + ' km/an'); }
  if (d.consMode === 'direct') { add('Consommation électrique', 'Saisie directe', fmt(r.conso100, 1) + ' kWh/100 km'); }
  else { add('Consommation électrique', fmt(d.kwh, 1) + ' kWh ÷ ' + fmt(d.km, 1) + ' km × 100', fmt(r.conso100, 1) + ' kWh/100 km'); }
  add('Énergie électrique annuelle', fmt(r.conso100, 1) + ' × ' + fmt(r.kmAn, 0) + ' ÷ 100', fmt(r.kwhAn0, 0) + ' kWh/an');
  add('Gazole annuel', fmt(d.cDiesel, 1) + ' L/100 km × ' + fmt(r.kmAn, 0) + ' ÷ 100', fmt(r.LAn, 0) + ' L/an');

  if (on.energie) {
    sec('Énergie');
    if (on.recharge) {
      add('Part en borne publique', d.rechMode === 'pct' ? fmt(d.partPublic, 1) + ' % de l’énergie annuelle' : fmt(r.occ, 0) + ' recharges/an × ' + (d.rechMode === 'kwh' ? fmt(d.rechKwh, 0) + ' kWh' : fmt(d.rechPow, 0) + ' kW × ' + fmt(d.rechDurU === 'min' ? d.rechDur / 60 : d.rechDur, 2) + ' h'), fmt(r.kwhPub, 0) + ' kWh (' + fmt(r.share * 100, 1) + ' %)');
      add('Prix moyen de l’électricité', '(1 − ' + fmt(r.share, 3) + ') × ' + fmt(r.pDepTTC, 3) + ' + ' + fmt(r.share, 3) + ' × ' + fmt(r.pPubTTC, 3) + ' €/kWh TTC', fmt(r.pEffTTC, 3) + ' €/kWh TTC');
    } else {
      add('Prix de l’électricité', 'Prix saisi' + (d.pElecBase === 'ht' ? ' (HT) × (1 + TVA)' : ''), fmt(r.pEffTTC, 3) + ' €/kWh TTC');
    }
    add('Prix de l’électricité HT', fmt(r.pEffTTC, 3) + ' ÷ (1 + ' + fmt(d.tvaElec, 0) + ' %)', fmt(r.pEffHT, 4) + ' €/kWh');
    add('Coût annuel électricité', fmt(r.kwhAn0, 0) + ' kWh × prix', 'TTC ' + eur(r.an.eleTTC) + ' · HT ' + eur(r.an.eleHT));
    add('Prix du gazole HT', fmt(r.pDieTTC, 3) + ' ÷ (1 + ' + fmt(d.tvaDiesel, 0) + ' %)' + (on.remb ? ' − ' + fmt(d.rembTicpe, 3) + ' (remb. TICPE)' : ''), fmt(r.pDieHTnet, 3) + ' €/L');
    add('Coût annuel gazole', fmt(r.LAn, 0) + ' L × prix', 'TTC ' + eur(r.an.dieTTC) + ' · HT ' + eur(r.an.dieHT));
    add('Économie d’énergie annuelle', 'Gazole − électricité', 'TTC ' + eur(r.an.ecoTTC) + ' · HT ' + eur(r.an.ecoHT));
    add('Économie d’énergie sur ' + ans(n), 'Somme des écarts annuels' + (on.evol ? ' (avec évolution des prix)' : '') + (on.batterie ? ' et vieillissement batterie' : ''), 'TTC ' + eur(r.totEneTTC) + ' · HT ' + eur(r.totEneHT));
  }

  if (isComplet()) {
    sec('Autres coûts annuels et investissements (HT)');
    if (on.entretien) { add('Entretien annuel', (d.entU === 'mois' ? 'Montant mensuel × 12' : 'Montant annuel saisi') + ', par camion', 'Élec. ' + eur(r.oc.entE) + ' · Diesel ' + eur(r.oc.entD)); }
    if (on.adblue) { add('AdBlue annuel (diesel)', fmt(r.oc.adbLitres, 0) + ' L × ' + fmt(d.adbP, 2) + ' €/L' + (d.adbU === 'pct' ? ' (' + fmt(d.adbL, 1) + ' % du gazole)' : ''), eur(r.oc.adb)); }
    if (on.assur) { add('Assurance et taxes annuelles', d.assU === 'mois' ? 'Montant mensuel × 12' : 'Montant annuel saisi', 'Élec. ' + eur(r.oc.assE) + ' · Diesel ' + eur(r.oc.assD)); }
    if (on.achat) { add('Prix d’achat net', 'Électrique ' + eur(d.prixE) + (r.aideA > 0 ? ' − aide ' + eur(r.aideA) : '') + ' · Diesel ' + eur(d.prixD), 'Élec. ' + eur(r.netE) + ' · Diesel ' + eur(d.prixD)); }
    if (on.borne) { add('Borne par camion', '(' + eur(d.borneInv) + (r.aideB > 0 ? ' − aide ' + eur(r.aideB) : '') + ') ÷ ' + fmt(r.oc.nb, 0) + ' camion(s) ; abonnement ÷ ' + fmt(r.oc.nb, 0), 'Invest. ' + eur(r.borneNet) + ' · ' + eur(r.oc.borneAbo) + '/an'); }
    if (on.fin && on.achat) { add('Intérêts du crédit', fmt(d.finPart, 0) + ' % financés à ' + fmt(d.finTaux, 2) + ' % sur ' + fmt(d.finDuree, 0) + ' ' + d.finU + ' (mensualités constantes)', 'Élec. ' + eur(r.cE.fin) + ' · Diesel ' + eur(r.cD.fin)); }
    if (on.revente && on.achat) { add('Valeur de revente', d.resU === 'eur' ? 'Montants saisis' : 'Prix d’achat × ' + fmt(d.resE, 0) + ' % (élec.) et × ' + fmt(d.resD, 0) + ' % (diesel)', 'Élec. ' + eur(r.resE) + ' · Diesel ' + eur(r.resD)); }
    if (on.batterie && r.bat) {
      var b = r.bat;
      sec('Batterie LFP');
      add('Perte de capacité annuelle', d.batDegU === 'cycle' ? fmt(d.batDeg, 2) + ' % /1000 cycles × ' + fmt(b.cyclesYr, 0) + ' cycles/an (' + fmt(r.kwhAn0, 0) + ' kWh ÷ ' + fmt(d.capBat, 0) + ' kWh)' : 'Saisie directe', fmt(b.degYr, 2) + ' %/an');
      add('État de santé en fin de période', '100 % − pertes cumulées' + (b.replYears.length > 0 ? ' (batterie remplacée)' : ''), fmt(b.soh[n], 1) + ' %');
      add('Surconsommation moyenne', 'Linéaire jusqu’à ' + fmt(d.batEff, 1) + ' % au seuil de ' + fmt(d.batSeuil, 0) + ' %', '+ ' + fmt((b.avgMult - 1) * 100, 1) + ' %');
      add('Autonomie en fin de période', fmt(b.capU[n], 0) + ' kWh ÷ ' + fmt(r.conso100 * b.mult[n], 1) + ' kWh/100 km', fmt(b.range[n], 0) + ' km');
      add('Recharge complète en fin de période', fmt(b.capU[n], 0) + ' kWh × ' + fmt(d.socFin - d.socArr, 0) + ' % ÷ ' + fmt(d.bornePuis, 0) + ' kW', fmt(b.tFull[n], 1) + ' h');
    }

    add('Économie sur ' + ans(n) + ' (HT)', 'Coût total diesel − coût total électrique', eur(r.tcoSav));
    add('Économie annuelle d’exploitation (HT)', 'Année 1 : (énergie + entretien + AdBlue + assurance + abonnement borne) diesel − électrique', eur(r.opSav));

  }
  if (on.co2) {

    add('CO₂ évité par an', fmt(r.LAn, 0) + ' L × ' + fmt(d.co2D, 2) + ' − ' + fmt(r.kwhAn0, 0) + ' kWh × ' + fmt(d.co2E, 3) + ' kg', fmt(r.co2Year, 1) + ' t/an');
  }

  if (on.scen && CUR_RP && CUR_RP.valid) {
    sec('Scénario prudent');
    add('Hypothèses prudentes', 'Mêmes calculs que ci-dessus avec : ' + scenarioText(d, on), '');
    add('Résultat du scénario prudent', 'Prix, kilométrage et paramètres ajustés', isComplet() ? 'Éco. annuelle ' + eur(CUR_RP.opSav) + ' · ' + ans(n) + ' : ' + eur(CUR_RP.tcoSav) : 'Éco. annuelle HT ' + eur(CUR_RP.an.ecoHT) + ' · ' + ans(n) + ' : ' + eur(CUR_RP.totEneHT));
  }
  var h = '<div class="page annex">' + headHtml(d);
  h += '<div class="st">Annexe 2 · Détail des calculs</div>';
  h += '<table class="a2"><tr><th>Résultat</th><th>Calcul</th><th style="text-align:right">Valeur</th></tr>';
  var i;
  for (i = 0; i < rows.length; i++) {
    if (rows[i].sec) { h += '<tr class="sec"><td colspan="3">' + esc(rows[i].sec) + '</td></tr>'; }
    else { h += '<tr><td>' + rows[i].a + '</td><td>' + rows[i].b + '</td><td>' + rows[i].c + '</td></tr>'; }
  }
  h += '</table>';
  h += footHtml(d, 'Annexe 2') + '</div>';
  return h;
}

function buildPages(r, d, on) {
  var pages;
  CUR_RP = on.scen ? compute(prudentData(d), on) : null;
  if (isComplet()) { pages = [pageComplet1(r, d, on), pageComplet2(r, d, on), pageComplet3(r, d, on), pageComplet4(r, d, on)]; }
  else { pages = [pageConso1(r, d, on), pageConso2(r, d, on)]; }
  pages.push(annex1(r, d, on));
  pages.push(annex2(r, d, on));
  var tot = pages.length;
  var i;
  for (i = 0; i < pages.length; i++) {
    pages[i] = pages[i].split('{{PG}}').join(String(i + 1)).split('{{TOT}}').join(String(tot));
  }
  return pages;
}

function loadState() {
  var raw = null;
  var o, k, i;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (raw) {
    try {
      o = JSON.parse(raw);
      if (o.v) {
        for (k in state) {
          if (Object.prototype.hasOwnProperty.call(o.v, k) && typeof o.v[k] === 'string') { state[k] = o.v[k]; }
        }
      }
      if (o.on) {
        for (k in ons) {
          if (Object.prototype.hasOwnProperty.call(o.on, k)) { ons[k] = !!o.on[k]; }
        }
      }
      if (o.t) { touched = o.t; }
      for (k in state) {
        if (Object.prototype.hasOwnProperty.call(state, k) && !touched[k] && !(touched.kmUnit && (k === 'kmNb' || k === 'kmPer'))) { state[k] = DEFAULTS[k]; }
      }
    } catch (e2) {}
    return;
  }
  for (i = 0; i < OLD_KEYS.length; i++) {
    try { raw = localStorage.getItem(OLD_KEYS[i]); } catch (e3) { raw = null; }
    if (raw) {
      try {
        o = JSON.parse(raw);
        if (o.v) {
          for (k in state) {
            if (Object.prototype.hasOwnProperty.call(o.v, k) && typeof o.v[k] === 'string') { state[k] = o.v[k]; }
          }
          if (typeof o.v.kmAn === 'string') { state.kmPer = o.v.kmAn; }
          if (typeof o.v.perEntretien === 'string') { state.entU = o.v.perEntretien; }
        }
        if (o.on) {
          for (k in ons) {
            if (Object.prototype.hasOwnProperty.call(o.on, k)) { ons[k] = !!o.on[k]; }
          }
        }
        if (o.t) { touched = o.t; }
        if (touched.kmAn) { touched.kmPer = 1; }
      } catch (e4) {}
      return;
    }
  }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: state, on: ons, t: touched })); } catch (e) {}
}

/* ----- PDF ----- */
function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function startPdf() {
  var d = readData(state);
  var on = effOn();
  var r = compute(d, on);
  if (!r.valid) { return; }
  var pages = buildPages(r, d, on);
  if (!window.html2canvas || !window.jspdf) {
    printFallback(pages);
    return;
  }
  var btn = document.getElementById('btnPdf');
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Génération du PDF…';
  var stage = document.getElementById('stage');
  stage.innerHTML = pages.join('');
  var els = stage.getElementsByClassName('page');
  var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  var idx = 0;
  var name = 'MasterTCO' + (d.client ? '-' + slug(d.client) : '') + '.pdf';

  function finish(ok) {
    stage.innerHTML = '';
    btn.disabled = false;
    btn.textContent = label;
    if (!ok) { printFallback(pages); }
  }
  function next() {
    if (idx >= els.length) {
      pdf.save(name);
      finish(true);
      return;
    }
    window.html2canvas(els[idx], { scale: 2, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0 }).then(function (canvas) {
      if (idx > 0) { pdf.addPage(); }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
      idx++;
      next();
    }).catch(function () {
      finish(false);
    });
  }
  next();
}
function downloadPdf() {
  var pend = pendingList();
  if (pend.length > 0) {
    review = true;
    refreshBadges();
    showModal('Valeurs d’exemple non modifiées', pend.length + ' valeur(s) n’ont pas été modifiées. Les as-tu laissées volontairement ?', 'Télécharger quand même', startPdf, pendingHtml(pend), 'Vérifier');
  } else {
    startPdf();
  }
}
function printFallback(pages) {
  var pa = document.getElementById('printArea');
  pa.innerHTML = pages.join('');
  window.print();
}

/* ----- Événements ----- */
var KM_DEFAULT_NB = { jour: '220', sem: '46', mois: '11' };
function onFieldEvent(e) {
  var t = e.target;
  var key = t.getAttribute ? t.getAttribute('data-key') : null;
  if (!key) { return; }
  var prevAnnual = (key === 'kmUnit') ? annualKm(readData(state)) : 0;
  state[key] = t.value;
  touched[key] = 1;
  if (key === 'kmUnit') {
    if (!touched.kmNb) { state.kmNb = KM_DEFAULT_NB[t.value] || ''; }
    if (!touched.kmPer && prevAnnual > 0) {
      var nbP = t.value === 'an' ? 1 : num(state.kmNb);
      if (nbP > 0) { state.kmPer = t.value === 'an' ? String(Math.round(prevAnnual)) : String(Math.round(prevAnnual / nbP * 1000) / 1000); }
    }
  }
  if (e.type === 'change' || t.tagName === 'SELECT') { fillInputs(); }
  saveState();
  refreshAll();
}
document.addEventListener('input', onFieldEvent);
document.addEventListener('change', onFieldEvent);

document.addEventListener('click', function (e) {
  var el = e.target;
  var action = null;
  while (el && el !== document) {
    if (el.getAttribute && el.getAttribute('data-action')) {
      action = el.getAttribute('data-action');
      break;
    }
    el = el.parentNode;
  }
  if (!action || el.disabled) { return; }
  if (action === 'tab') { showTab(el.getAttribute('data-tab')); }
  else if (action === 'go-rapport') { showTab('rapport'); }
  else if (action === 'toggle') {
    var key = el.getAttribute('data-on');
    ons[key] = !ons[key];
    saveState();
    refreshAll();
  }
  else if (action === 'mode') {
    state.mode = el.getAttribute('data-mode');
    touched.mode = 1;
    saveState();
    refreshAll();
    if (document.getElementById('view-rapport').style.display !== 'none') { renderReport(); }
  }
  else if (action === 'validate') {
    touched[el.getAttribute('data-key')] = 1;
    saveState();
    refreshAll();
  }
  else if (action === 'review-go') { review = true; showTab('saisie'); refreshAll(); }
  else if (action === 'review-off') { review = false; refreshAll(); }
  else if (action === 'reset') {
    showModal('Réinitialiser les données ?', 'Les valeurs et les interrupteurs reviennent à l’exemple de départ (tracteur 44 t, essai de 368,4 km).', 'Réinitialiser', doReset);
  }
  else if (action === 'clear') {
    showModal('Tout effacer ?', 'Tous les champs seront vidés. Les interrupteurs et les unités restent tels quels. Tu pourras revenir à l’exemple avec « Réinitialiser ».', 'Tout effacer', doClear);
  }
  else if (action === 'pdf') { downloadPdf(); }
  else if (action === 'modal-cancel') {
    var wasPdf = document.getElementById('mCancel').textContent === 'Vérifier';
    closeModal();
    if (wasPdf) { review = true; showTab('saisie'); refreshAll(); }
  }
  else if (action === 'modal-ok') {
    var cb = modalCb;
    closeModal();
    if (cb) { cb(); }
  }
});

window.addEventListener('resize', fitPages);
window.addEventListener('orientationchange', function () { setTimeout(fitPages, 200); });

buildMaps();
loadState();
buildForm();
</script>
</body>
</html>
