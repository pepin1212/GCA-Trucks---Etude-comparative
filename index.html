<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MasterTCO</title>
<style>
:root{
  --brand:#00529b;
  --green:#1a9b6c;
  --orange:#e0642a;
  --red:#c62828;
  --bg:#f3f5f8;
  --card:#ffffff;
  --text:#1b2430;
  --muted:#6b7683;
  --line:#dde2e9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.page,.page *{-webkit-text-size-adjust:none;text-size-adjust:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
#app{max-width:760px;margin:0 auto;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.top .tag{font-size:11.5px;opacity:.8;text-align:right;line-height:1.25;letter-spacing:.02em}
.wm{display:inline-flex;align-items:baseline;white-space:nowrap;text-transform:uppercase;line-height:1;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
.wm .a{font-weight:300;letter-spacing:.3em;margin-right:.32em}
.wm .b{font-weight:800;letter-spacing:.14em}
.top .wm{font-size:19px;color:#fff}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:15px;font-weight:600;padding:10px 6px;border-radius:10px 10px 0 0;cursor:pointer;font-family:inherit}
.tab.on{background:var(--bg);color:var(--brand)}
.view{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font-size:16px;color:var(--brand)}
.card .note{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card .note.blk{color:#a35a00;font-weight:600}
.cbody{margin-top:4px;transition:opacity .15s}
.card.off .cbody{opacity:.4}
.card.off h2{color:var(--muted)}
.sep{margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.field{margin-top:10px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.fhead label{font-size:13px;font-weight:600}
.fhead .hint{font-weight:400;color:var(--muted)}
.mbadge{display:none;flex:none;border-radius:8px;background:#fdeaea;color:var(--red);font-size:11px;font-weight:700;padding:3px 8px}
.field.miss .fhead label{color:var(--red)}
.field.miss .inp{border-color:var(--red);background:#fff6f6}
.field.miss .mbadge{display:inline-block}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.inp:focus-within{border-color:var(--brand)}
.inp input,.inp select.full{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:11px 12px;background:transparent;color:var(--text);font-family:inherit}
.inp input:disabled,.inp select:disabled{color:var(--muted)}
.inp .unit{padding:0 12px;font-size:13px;color:var(--muted);white-space:nowrap;background:#f6f8fa;align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--line)}
.inp select.usel{flex:none;max-width:52%;border:0;border-left:1px solid var(--line);outline:0;background:#f6f8fa;color:var(--brand);font-size:14px;font-weight:600;padding:0 8px;align-self:stretch;font-family:inherit}
.calc{margin-top:8px;font-size:13px;color:var(--brand);background:#eaf2fb;border-radius:8px;padding:6px 10px}
.calc.alert{color:#8a4b00;background:#fff4e5}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#c5ccd6;position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on span{left:25px}
.modebar{background:#fff;border-radius:14px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modebar .mt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.mslider{position:relative;display:flex;background:#e6edf5;border-radius:12px;padding:3px}
.mthumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--brand);border-radius:10px;transition:transform .22s}
.mslider.right .mthumb{transform:translateX(100%)}
.mopt{position:relative;flex:1;text-align:center;padding:11px 4px;font-weight:700;font-size:14px;color:var(--brand);transition:color .2s;border:0;background:transparent;font-family:inherit;cursor:pointer}
.mopt.on{color:#fff}
.live{background:linear-gradient(135deg,#0b3d91,#00529b);color:#fff}
.live h2{color:#fff}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lbox{background:rgba(255,255,255,.14);border-radius:10px;padding:10px}
.lbox .t{font-size:12px;opacity:.85}
.lbox .v{font-size:18px;font-weight:700;margin-top:2px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.main{background:var(--brand);color:#fff}
.btn.sec{background:#e6edf5;color:var(--brand)}
.btn.danger{background:#fdeaea;color:#b42318}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.warn{background:#fff4e5;border:1px solid #f5c98b;color:#8a4b00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.warn.red{background:#fff1f1;border-color:#f0b4b4;color:var(--red)}
.warn .redlist{margin:6px 0 8px;padding-left:18px;color:var(--red)}
.warn .redlist li{margin-bottom:2px}
.warn .btn{padding:9px 12px;font-size:14px;margin-top:2px}
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pgwrap{margin:0 auto 14px;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.pgscale{transform-origin:top left;width:794px}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;max-height:86vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox .redlist{margin:0 0 12px;padding-left:18px;color:var(--red);font-size:14px}
/* Dossiers clients */
.dbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dbar .di{flex:1;min-width:0}
.dbar .dl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.dbar .dn{font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .ds{font-size:12px;color:var(--muted)}
.dbar .ds.mod{color:#a35a00;font-weight:600}
.dbar .btn{flex:none;padding:10px 12px;font-size:14px}
#dossiers{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;flex-direction:column}
#dossiers.on{display:flex}
.dhead{background:var(--brand);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead h3{margin:0;font-size:17px}
.dhead .x{border:0;background:rgba(255,255,255,.18);color:#fff;font-size:15px;font-weight:700;border-radius:10px;padding:8px 12px;cursor:pointer;font-family:inherit}
.dscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.dwrap{max-width:760px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.dsearch{width:100%;border:1.5px solid var(--line);border-radius:10px;font-size:16px;padding:11px 12px;font-family:inherit;margin-bottom:12px;background:#fff;color:var(--text);outline:0}
.dsearch:focus{border-color:var(--brand)}
.dclient{margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.4px}
.dstudy{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:2px solid transparent}
.dstudy.cur{border-color:var(--brand)}
.dstudy .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dstudy .nm{font-weight:700}
.dstudy .eco{font-weight:800;white-space:nowrap}
.dstudy .eco.pos{color:var(--green)}
.dstudy .eco.neg{color:var(--red)}
.dstudy .meta{font-size:12px;color:var(--muted);margin-top:2px}
.dacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dacts .btn{flex:1;padding:9px 6px;font-size:13px;min-width:70px}
.dempty{text-align:center;color:var(--muted);padding:30px 10px}
.dsave{background:#eaf2fb;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--brand);margin-bottom:12px}
.dsave.late{background:#fff4e5;color:#8a4b00}
#prompt{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:110;padding:20px}
#prompt.on{display:flex}
.pfield{margin-bottom:10px}
.pfield label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.pfield input{width:100%;border:1.5px solid var(--line);border-radius:10px;font-size:16px;padding:11px 12px;font-family:inherit;outline:0}
.pfield input:focus{border-color:var(--brand)}
.perr{color:var(--red);font-size:13px;margin:-4px 0 10px;display:none}
#modal{z-index:120}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1b2430;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:130;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Pages A4 (96 dpi) */
.page{width:794px;height:1122px;padding:34px 44px 52px;background:#fff;color:#1b2430;position:relative;overflow:hidden;font-size:13px;line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ph{border-bottom:1px solid #cfd6df;padding-bottom:12px;margin-bottom:14px}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.wmwrap{display:inline-block}
.wmwrap .wm{font-size:17px;color:#1b2430}
.wmwrap .wm .b{color:var(--brand)}
.wmbar{height:2px;margin-top:7px;background:var(--brand)}
.ph-r{text-align:right;font-size:11.5px;color:#6b7683;line-height:1.45}
.ph-t{font-size:22px;font-weight:800;color:#0b2a4a;line-height:1.15}
.ph-s{font-size:12.5px;color:#6b7683;margin-top:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.kpi{border-radius:12px;padding:10px 16px;color:#fff}
.kpi.g{background:var(--green)}
.kpi.b{background:var(--brand)}
.kpi .k1{font-size:12px;opacity:.92;text-transform:uppercase;letter-spacing:.4px}
.kpi .k2{font-size:28px;font-weight:800;margin-top:1px}
.kpi .k3{font-size:12px;opacity:.9}
.basis{font-size:11.5px;color:#6b7683;margin:6px 0 8px}
.st{font-size:15px;font-weight:700;color:var(--brand);margin:12px 0 6px;border-left:4px solid var(--brand);padding-left:8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#eef3f9;color:#00386b;text-align:right;padding:6px 8px;font-weight:700}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 8px;text-align:right;border-bottom:1px solid #e6eaf0}
table.t.sm{font-size:11.5px}
table.t.sm th{padding:4px 6px}
table.t.sm td{padding:3px 6px}
table.t tr.hl td{font-weight:800;background:#eaf7f1;color:#0d6b49}
.flex2{display:flex;gap:16px;align-items:flex-start}
.fx1{flex:0 0 380px}
.fx2{flex:1;min-width:0}
.foot{position:absolute;left:44px;right:44px;bottom:20px;display:flex;justify-content:space-between;font-size:11px;color:#8a94a1;border-top:1px solid #e6eaf0;padding-top:6px}
.keys{margin:0;padding-left:18px;font-size:12.5px}
.keys li{margin-bottom:3px}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:0 5px 5px 0;background:#e3f5ec;color:#0d6b49}
.callout{background:#eaf2fb;border-left:4px solid var(--brand);padding:8px 12px;border-radius:6px;font-size:12px;margin:10px 0}
.callout.ok{background:#e9f7f0;border-color:var(--green)}
.callout.bad{background:#fff3e8;border-color:var(--orange)}
/* Seuils et sensibilité */
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.thr.c4{grid-template-columns:repeat(4,1fr);gap:8px}
.thr.c4 .tc{padding:8px 10px 9px}
.thr.c4 .tc .v{font-size:17px}
.thr.c4 .tc .l{font-size:9.5px}
.tc{border:1px solid #dde3ea;border-radius:10px;padding:9px 12px 10px;background:#fbfcfe}
.tc .l{font-size:10px;text-transform:uppercase;letter-spacing:.45px;color:#6b7683;font-weight:700}
.tc .q{font-size:10.5px;color:#6b7683;margin-top:1px}
.tc .v{font-size:20px;font-weight:800;color:#0b2a4a;margin-top:4px;line-height:1.1}
.tc .c{font-size:11px;color:#3a4552;margin-top:3px}
.tc .m{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;border-radius:8px;padding:2px 8px}
.m.ok{background:#e3f5ec;color:#0d6b49}
.m.ko{background:#fff1e6;color:#a34a0b}
.m.na{background:#eef0f3;color:#6b7683}
table.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:11.5px}
table.hm th{font-weight:700;color:#3a4552;padding:4px 6px;text-align:center;background:#f2f5f9;border-radius:4px}
table.hm th.rh{text-align:right}
table.hm td{text-align:center;padding:4px 4px;border-radius:4px;font-weight:700;color:#1b2430}
table.hm td.cur{outline:2px solid #0b2a4a;outline-offset:-2px}
.annex{font-size:9.4px;line-height:1.26}
.a1grid{display:flex;gap:18px}
.a1col{flex:1;min-width:0}
.a1g{margin-bottom:6px}
.a1g h4{margin:0 0 2px;font-size:9.8px;color:var(--brand);border-bottom:1px solid #cfd8e3;padding-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.a1r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;border-bottom:1px dotted #dfe5ec}
.a1r span:first-child{color:#3a4552}
.a1r span:last-child{font-weight:700;text-align:right}
table.a2{width:100%;border-collapse:collapse;font-size:8.8px;line-height:1.25}
table.a2 th{background:#eef3f9;color:#00386b;text-align:left;padding:3px 5px;font-weight:700}
table.a2 td{padding:2.2px 5px;border-bottom:1px solid #e6eaf0;vertical-align:top}
table.a2 td:first-child{font-weight:700;width:21%}
table.a2 td:nth-child(2){color:#3a4552;width:55%}
table.a2 td:last-child{text-align:right;font-weight:700;width:24%}
table.a2 tr.sec td{background:#f4f7fb;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:8.4px;text-align:left}
#stage{position:absolute;left:-10000px;top:0;width:794px}
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,#modal,#dossiers,#prompt,#toast{display:none !important}
  #printArea{display:block}
  #printArea .page{break-after:page;page-break-after:always}
  #printArea .page:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="wm"><span class="a">Master</span><span class="b">TCO</span></div><span class="tag">Coût total de possession<br>électrique et diesel</span></div>
    <div class="tabs">
      <button class="tab on" type="button" data-action="tab" data-tab="saisie" id="tab-saisie">Données</button>
      <button class="tab" type="button" data-action="tab" data-tab="rapport" id="tab-rapport">Rapport</button>
    </div>
  </header>

  <section class="view" id="view-saisie">
    <div class="dbar" id="dosBar">
      <div class="di"><div class="dl">Étude</div><div class="dn" id="dosName">Étude non enregistrée</div><div class="ds" id="dosState"></div></div>
      <button class="btn sec" type="button" data-action="dos-save">Enregistrer</button>
      <button class="btn main" type="button" data-action="dos-panel">Dossiers</button>
    </div>
    <div class="modebar">
      <div class="mt">Type de rapport</div>
      <div class="mslider"><div class="mthumb"></div>
        <button type="button" class="mopt" data-action="mode" data-mode="conso">Consommation</button>
        <button type="button" class="mopt" data-action="mode" data-mode="complet">Étude complète</button>
      </div>
    </div>
    <div id="missBanner"></div>
    <div id="formHost"></div>
    <div class="card live" id="liveBox"></div>
    <div class="btns">
      <button class="btn main" type="button" data-action="go-rapport">Voir le rapport</button>
      <div class="row2">
        <button class="btn sec" type="button" data-action="dos-save">Enregistrer</button>
        <button class="btn sec" type="button" data-action="dos-panel">Dossiers</button>
      </div>
      <div class="row2">
        <button class="btn sec" type="button" data-action="reset">Réinitialiser</button>
        <button class="btn danger" type="button" data-action="clear">Tout effacer</button>
      </div>
    </div>
  </section>

  <section class="view" id="view-rapport" style="display:none">
    <div class="modebar">
      <div class="mt">Type de rapport</div>
      <div class="mslider"><div class="mthumb"></div>
        <button type="button" class="mopt" data-action="mode" data-mode="conso">Consommation</button>
        <button type="button" class="mopt" data-action="mode" data-mode="complet">Étude complète</button>
      </div>
    </div>
    <div id="reportWarn"></div>
    <div class="toolbar">
      <button class="btn main" type="button" data-action="pdf" id="btnPdf">Télécharger le rapport en PDF</button>
      <button class="btn sec" type="button" data-action="tab" data-tab="saisie">Modifier les données</button>
    </div>
    <div id="pagesHost"></div>
  </section>
</div>

<div id="dossiers" role="dialog" aria-modal="true" aria-labelledby="dosTitle">
  <div class="dhead"><h3 id="dosTitle">Dossiers clients</h3><button class="x" type="button" data-action="dos-close">Fermer</button></div>
  <div class="dscroll"><div class="dwrap">
    <div id="dosSaveInfo"></div>
    <div class="row2" style="margin-bottom:8px">
      <button class="btn main" type="button" data-action="dos-new">Nouvelle étude</button>
    </div>
    <div class="row2" style="margin-bottom:12px">
      <button class="btn sec" type="button" data-action="dos-export">Exporter mes dossiers</button>
      <button class="btn sec" type="button" data-action="dos-import">Importer</button>
    </div>
    <input class="dsearch" type="search" id="dosSearch" placeholder="Rechercher un client ou une étude" autocomplete="off">
    <div id="dosList"></div>
  </div></div>
  <input type="file" id="dosFile" accept=".json,application/json" style="display:none">
</div>

<div id="prompt" role="dialog" aria-modal="true">
  <div class="mbox">
    <h3 id="pTitle"></h3>
    <p id="pText"></p>
    <div class="pfield"><label for="pClient">Client</label><input type="text" id="pClient" autocomplete="off" placeholder="Ex. Transports Nicolas"></div>
    <div class="pfield"><label for="pName">Nom de l’étude</label><input type="text" id="pName" autocomplete="off" placeholder="Ex. Offre crédit-bail"></div>
    <div class="perr" id="pErr"></div>
    <div class="row2">
      <button class="btn sec" type="button" data-action="prompt-cancel">Annuler</button>
      <button class="btn main" type="button" data-action="prompt-ok" id="pOk">Enregistrer</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="stage"></div>
<div id="printArea"></div>

<div id="modal">
  <div class="mbox">
    <h3 id="mTitle"></h3>

/* ----- Seuils de rentabilité et sensibilité ----- */
function metricOf(r, complet) { return complet ? r.tcoSav : r.totEneHT; }

/* Cherche le facteur f (le plus proche de 1) qui annule l'économie, toutes autres données inchangées */
function solveFactor(d, on, complet, apply, lo, hi) {
  function m(f) { var dc = copyObj(d); apply(dc, f); return metricOf(compute(dc, on), complet); }
  var N = 90, i, f, v, pf = null, pv = null, cands = [];
  var la = Math.log(lo), lb = Math.log(hi);
  for (i = 0; i <= N; i++) {
    f = Math.exp(la + (lb - la) * i / N);
    v = m(f);
    if (pv !== null && ((pv < 0 && v >= 0) || (pv > 0 && v <= 0))) { cands.push([pf, f, pv]); }
    pf = f; pv = v;
  }
  if (cands.length === 0) { return null; }
  var best = cands[0], bd = Infinity, dd2, j;
  for (j = 0; j < cands.length; j++) {
    dd2 = Math.abs(Math.log((cands[j][0] + cands[j][1]) / 2));
    if (dd2 < bd) { bd = dd2; best = cands[j]; }
  }
  var a = best[0], b = best[1], va = best[2], mid, vm;
  for (i = 0; i < 50; i++) {
    mid = (a + b) / 2;
    vm = m(mid);
    if ((va < 0 && vm < 0) || (va > 0 && vm > 0)) { a = mid; va = vm; } else { b = mid; }
  }
  return (a + b) / 2;
}

function sensitivity(d, on, complet, r) {

  var base = metricOf(r, complet);
  var thr = [];
  function m(apply, f) { var dc = copyObj(d); apply(dc, f); return metricOf(compute(dc, on), complet); }
  function addThr(key, label, cur, unit, dec, apply) {
    var up = m(apply, 1.01) >= base;
    var f = solveFactor(d, on, complet, apply, 0.02, 20);
    thr.push({ key: key, label: label, cur: cur, unit: unit, dec: dec, seuil: f === null ? null : cur * f, kind: up ? 'min' : 'max' });
  }
  var kmApply = function (dc, f) { dc.kmPer *= f; };
  var dieApply = function (dc, f) { dc.pDiesel *= f; };
  var eleApply = function (dc, f) { scaleElec(dc, f); };
  var conApply = function (dc, f) { scaleConso(dc, f); };

  if (on.energie) {
    addThr('die', 'Prix du gazole', r.pDieHT, ' €/L HT', 3, dieApply);
    addThr('ele', 'Prix de l’électricité', r.pVar1, ' €/kWh HT', 3, eleApply);
    addThr('con', 'Consommation électrique', r.conso100, ' kWh/100 km', 1, conApply);
  }
  if (complet && on.achat) {
    if (d.modeE === 'achat') { addThr('prix', 'Prix d’achat électrique', d.prixE, ' € HT', 0, function (dc, f) { dc.prixE *= f; }); }
    else { addThr('prix', 'Loyer électrique', d.loyE, ' € HT/mois', 0, function (dc, f) { dc.loyE *= f; }); }
  }

  }

  if (on.energie) {
    addVar('Consommation électrique', conApply);
    addVar('Consommation diesel', function (dc, f) { dc.cDiesel *= f; });
  }
  if (complet) {
    if (on.achat) {
      if (d.modeE === 'achat') { addVar('Prix d’achat électrique', function (dc, f) { dc.prixE *= f; }); }
      else { addVar('Loyer électrique', function (dc, f) { dc.loyE *= f; }); }
      if (d.modeD === 'achat') { addVar('Prix d’achat diesel', function (dc, f) { dc.prixD *= f; }); }
      else { addVar('Loyer diesel', function (dc, f) { dc.loyD *= f; }); }
    }
    if (on.entretien) {
      addVar('Entretien électrique', function (dc, f) { dc.entE *= f; });
      addVar('Entretien diesel', function (dc, f) { dc.entD *= f; });

  }
  vars.sort(function (a, b) { return b.spread - a.spread; });
  var kept = [];
  var i;
  for (i = 0; i < vars.length; i++) { if (vars[i].spread > 0.5) { kept.push(vars[i]); } }
  /* Carte kilométrage × prix du gazole */
  var steps = [1 - 2 * amp, 1 - amp, 1, 1 + amp, 1 + 2 * amp];

function niceStep(x) {
  if (x <= 0) { return 1; }
  var e = Math.floor(Math.log(x) / Math.LN10);
  var p = Math.pow(10, e);

}
function niceScale(minV, maxV, n) {

  if (maxV < 0) { maxV = 0; }

  return { min: Math.floor(minV / step) * step, max: Math.ceil(maxV / step) * step, step: step };
}

/* Graphique tornade : effet de ± X % de chaque donnée sur l'économie */
function tornadoChart(w, vars, base, amp) {
  var rowH = 19, padT = 40, padB = 16, labW = 168, valW = 64;
  var h = padT + vars.length * rowH + padB;
  var x0 = labW + valW, x1 = w - valW;
  var lo = base, hi = base, i;
  for (i = 0; i < vars.length; i++) {
    lo = Math.min(lo, vars[i].low, vars[i].high);
    hi = Math.max(hi, vars[i].low, vars[i].high);
  }
  var span = Math.max(hi - base, base - lo);
  if (span <= 0) { span = 1; }
  lo = base - span * 1.04;
  hi = base + span * 1.04;
  var xv = function (v) { return x0 + (v - lo) / (hi - lo) * (x1 - x0); };
  var s = svgOpen(w, h);
  var cMinus = '#8fb3d9', cPlus = '#00529b';
  s += '<rect x="' + x0 + '" y="6" width="12" height="12" rx="2" fill="' + cMinus + '"/><text x="' + (x0 + 18) + '" y="16" font-size="11.5" fill="#3a4552">Donnée −' + fmt(amp * 100, 0) + ' %</text>';
  s += '<rect x="' + (x0 + 140) + '" y="6" width="12" height="12" rx="2" fill="' + cPlus + '"/><text x="' + (x0 + 158) + '" y="16" font-size="11.5" fill="#3a4552">Donnée +' + fmt(amp * 100, 0) + ' %</text>';
  if (lo < 0 && hi > 0) {
    s += '<line x1="' + xv(0) + '" x2="' + xv(0) + '" y1="' + (padT - 4) + '" y2="' + (h - padB + 2) + '" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>';
    s += '<text x="' + xv(0) + '" y="' + (h - 6) + '" font-size="10" fill="#c62828" text-anchor="middle">équilibre</text>';
  }
  var y, v, k, xa, xb, vals, col, tx, anc;
  for (i = 0; i < vars.length; i++) {
    y = padT + i * rowH;
    s += '<text x="' + (labW - 6) + '" y="' + (y + 16) + '" font-size="11.5" font-weight="600" fill="#1b2430" text-anchor="end">' + esc(vars[i].label) + '</text>';
    vals = [[vars[i].low, cMinus], [vars[i].high, cPlus]];
    for (k = 0; k < 2; k++) {
      v = vals[k][0];
      col = vals[k][1];
      xa = Math.min(xv(base), xv(v));
      xb = Math.max(xv(base), xv(v));
      s += '<rect x="' + xa + '" y="' + (y + 4) + '" width="' + Math.max(1, xb - xa) + '" height="' + (rowH - 8) + '" fill="' + col + '" rx="2"/>';
      tx = v >= base ? xb + 4 : xa - 4;
      anc = v >= base ? 'start' : 'end';
      s += '<text x="' + tx + '" y="' + (y + 16) + '" font-size="10" fill="#3a4552" text-anchor="' + anc + '">' + fmt(v / 1000, 0) + ' k€</text>';
    }
  }
  s += '<line x1="' + xv(base) + '" x2="' + xv(base) + '" y1="' + (padT - 4) + '" y2="' + (h - padB + 2) + '" stroke="#1b2430" stroke-width="1.4"/>';
  s += '<text x="' + xv(base) + '" y="' + (padT - 8) + '" font-size="10.5" font-weight="700" fill="#1b2430" text-anchor="middle">Situation actuelle : ' + eur(base) + '</text>';
  s += '</svg>';
  return s;
}

/* ===================== ÉTAT, MODE, ACTIVATION ===================== */
var state = copyDefaults();
var ons = copyOn();
var modalOk = null;
var modalCancel = null;

function copyDefaults() { return copyObj(DEFAULTS); }
function copyOn() { return copyObj(DEFAULT_ON); }
/* Postes réellement pris en compte : interrupteurs, mode du rapport et dépendances */
function effOn() {
  var o = {};
  var k, i, g;
  for (k in DEFAULT_ON) {
    if (Object.prototype.hasOwnProperty.call(DEFAULT_ON, k)) { o[k] = !!ons[k]; }
  }
  if (state.mode === 'conso') {
    for (i = 0; i < CONSO_OFF.length; i++) { o[CONSO_OFF[i]] = false; }
  }
  for (i = 0; i < GROUPS.length; i++) {
    g = GROUPS[i];
    if (g.on && g.req && !o[g.req]) { o[g.on] = false; }
  }
  if (o.aides && !((o.achat && state.modeE === 'achat') || o.borne)) { o.aides = false; }
  if (o.fin && !(state.modeE === 'achat' || state.modeD === 'achat')) { o.fin = false; }
  if (o.revente && !(ownsS(state, 'E') || ownsS(state, 'D'))) { o.revente = false; }
  return o;
}
function blockReason(g) {
  var o = effOn();
  if (!g.on || !ons[g.on] || o[g.on]) { return ''; }
  if (g.cx && state.mode === 'conso') { return ''; }
  if (g.req && !o[g.req]) { return 'Inactif : active d’abord « ' + GROUP_BY_ON[g.req].title + ' ».'; }
  if (g.on === 'aides') { return 'Inactif : ni achat du tracteur électrique ni investissement dans une borne activé.'; }
  if (g.on === 'fin') { return 'Inactif : aucun tracteur n’est en achat.'; }
  if (g.on === 'revente') { return 'Inactif : le client n’est propriétaire d’aucun tracteur en fin de période.'; }
  return '';
}
function isComplet() { return state.mode !== 'conso'; }

function groupActive(g) {
  if (g.cx && !isComplet()) { return false; }
  if (g.on && !effOn()[g.on]) { return false; }
  return true;
}
function fieldVisible(f) {
  if (f.cx && !isComplet()) { return false; }
  if (f.vis && !f.vis(state, effOn())) { return false; }
  return true;
}
function fieldActive(k) {
  var g = GROUP_OF[k];
  var f = FIELD[k];
  if (!g || !f) { return false; }
  return groupActive(g) && fieldVisible(f);
}

/* Données manquantes ou invalides */
function missReason(k) {
  var f = FIELD[k];
  if (!f || !fieldActive(k)) { return ''; }
  if (k === 'rechMode' && state.rechMode === 'auto' && !effOn().batterie) { return 'nécessite la carte Batterie (étude complète)'; }
  if (f.select) { return ''; }
  var v = String(state[k] === undefined || state[k] === null ? '' : state[k]).replace(/^\s+|\s+$/g, '');
  if (v === '') { return 'à renseigner'; }
  if (f.text) { return ''; }
  var s = v.replace(/\s/g, '').replace(',', '.');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) { return 'valeur invalide'; }
  var needPos = typeof f.pos === 'function' ? f.pos(state) : !!f.pos;
  if (needPos && parseFloat(s) <= 0) { return 'doit être supérieur à 0'; }
  var mx = typeof f.max === 'function' ? f.max(state) : f.max;
  if (mx !== undefined && mx !== null && parseFloat(s) > mx) { return 'maximum ' + fmt(mx, 0); }
  if (k === 'cbPremierMontantE' || k === 'cbPremierMontantD') {
    var X = k.slice(-1);
    if (creditLeaseFirst(state, X) + aideLeaseFin(state, X) + creditLeaseResidual(state, X) >= Math.max(0, num(state['prix' + X]))) { return aideLeaseFin(state, X) > 0 ? 'premier loyer + aide + valeur résiduelle doivent rester inférieurs au prix' : 'premier loyer + valeur résiduelle doivent rester inférieurs au prix'; }
  }
  if (k === 'aideAchat') {
    var av = parseFloat(s);
    if (av < 0) { return 'ne peut pas être négative'; }
    if (state.modeE === 'location') {
      var totL = num(state.loyE) * leaseMonths(state, 'E');
      if (totL > 0 && av > totL) { return 'ne peut pas dépasser le total des loyers'; }
    } else if (av > num(state.prixE)) { return 'ne peut pas dépasser le prix d’achat'; }
    else if (aideLeaseFin(state, 'E') > 0 && creditLeaseFirst(state, 'E') + av + creditLeaseResidual(state, 'E') >= num(state.prixE)) { return 'aide + premier loyer + valeur résiduelle doivent rester inférieurs au prix'; }
  }
  if (k === 'rembTicpe' && num(state.ticpe) > 0 && parseFloat(s) >= num(state.ticpe)) { return 'égal ou supérieur à toute la TICPE : vérifie le taux'; }
  if (k === 'aideBorne') {
    if (parseFloat(s) < 0) { return 'ne peut pas être négative'; }
    if (effOn().borne && parseFloat(s) > num(state.borneInv)) { return 'ne peut pas dépasser le prix de la borne'; }
  }
  return '';
}
function isMissing(k) { return missReason(k) !== ''; }
function missingKeys() {
  var out = [];
  var k;
  for (k in FIELD) {
    if (Object.prototype.hasOwnProperty.call(FIELD, k) && isMissing(k)) { out.push(k); }
  }
  return out;
}

/* Page seuils de rentabilité et sensibilité */
function thrCard(t, S) {
  var h = '<div class="tc"><div class="l">' + esc(t.label) + '</div>';
  h += '<div class="q">' + (t.kind === 'min' ? 'Minimum pour être rentable' : 'Maximum pour rester rentable') + '</div>';
  var pct, cls, txt;
  if (t.abs) {
    if (t.seuil === null) {
      h += '<div class="v">Hors plage</div><div class="c">Actuel : ' + fmt(t.cur, 0) + ' €</div><span class="m na">Aucune aide ne suffit seule</span>';
    } else {
      h += '<div class="v">' + (t.seuil <= 0 ? 'Aucune' : fmt(t.seuil, 0) + ' €') + '</div><div class="c">Actuel : ' + fmt(t.cur, 0) + ' €</div>';
      if (t.seuil <= 0) { h += '<span class="m ok">Rentable même sans aide</span>'; }
      else if (t.cur >= t.seuil) { h += '<span class="m ok">Marge : ' + fmt(t.cur - t.seuil, 0) + ' €</span>'; }
      else { h += '<span class="m ko">À ajouter : +' + fmt(t.seuil - t.cur, 0) + ' €</span>'; }
    }
    return h + '</div>';
  }
  if (t.seuil === null) {
    h += '<div class="v">Aucun seuil détecté</div><div class="c">Actuel : ' + fmt(t.cur, t.dec) + t.unit + ' · plage testée × 0,02 à × 20</div>'; 
    txt = 'Aucun croisement détecté dans la plage testée';
    h += '<span class="m ' + (S.base >= 0 ? 'ok' : 'na') + '">' + txt + '</span>';
  } else {
    h += '<div class="v">' + fmt(t.seuil, t.dec) + t.unit + '</div><div class="c">Actuel : ' + fmt(t.cur, t.dec) + t.unit + '</div>';
    pct = t.cur !== 0 ? (t.seuil - t.cur) / Math.abs(t.cur) * 100 : 0;
    if (S.base >= 0) { cls = 'ok'; txt = 'Marge de sécurité : ' + fmt(Math.abs(pct), 0) + ' %'; }
    else { cls = 'ko'; txt = 'À atteindre : ' + sgn(pct) + ' %'; }
    h += '<span class="m ' + cls + '">' + txt + '</span>';
  }
  return h + '</div>';
}
function heatColor(v, maxAbs) {
  var a = maxAbs > 0 ? Math.min(1, Math.abs(v) / maxAbs) : 0;
  var alpha = 0.12 + 0.55 * a;
  return v >= 0 ? 'rgba(26,155,108,' + alpha.toFixed(3) + ')' : 'rgba(198,40,40,' + alpha.toFixed(3) + ')';
}
function pageSens(r, d, on, S) {
  var complet = isComplet();
  var what = complet ? 'l’économie sur ' + ans(r.n) + ' (coût total)' : 'l’économie d’énergie sur ' + ans(r.n);
  var h = '<div class="page">' + headHtml(d);
  h += '<div class="st">Seuils de rentabilité</div>';
  h += '<div class="basis" style="margin-top:0">Valeur de chaque donnée pour laquelle ' + what + ' devient nulle, toutes les autres données restant inchangées. Base actuelle : <b>' + eur(S.base) + '</b>. La marge indique de combien la donnée peut se dégrader avant que l’électrique perde son avantage.</div>';
  var nCards = S.thr.length + (complet && on.achat ? 1 : 0);
  h += '<div class="thr' + (nCards > 6 ? ' c4' : '') + '">';
  var i;
  for (i = 0; i < S.thr.length; i++) { h += thrCard(S.thr[i], S); }
  if (complet && on.achat) {
    h += '<div class="tc"><div class="l">Temps d’équilibre économique</div><div class="q">Durée pour rattraper le surcoût</div><div class="v">' + beMain(r) + '</div><div class="c">Hors valeur de revente</div>';
    h += '<span class="m ' + (r.be !== null ? 'ok' : 'na') + '">' + (r.be !== null ? 'Avant la fin de l’étude' : 'Avec revente : ' + beWithRes(r)) + '</span></div>';
  }
  h += '</div>';

  if (S.vars.length > 0) {
    h += '<div class="st">Sensibilité : effet d’une variation de ± ' + fmt(S.amp * 100, 0) + ' % sur ' + what + '</div>';
    h += tornadoChart(706, S.vars, S.base, S.amp);
    var tv = S.vars[0];
    var pc = fmt(S.amp * 100, 0) + ' %';
    h += '<div class="callout" style="font-size:11px;margin:4px 0 6px;padding:6px 10px"><b>Comment lire ce graphique :</b> chaque ligne fait varier <b>une seule donnée</b> de ' + pc + ' à la baisse (barre claire) ou à la hausse (barre foncée), toutes les autres restant identiques, et indique ' + what + ' obtenue. ';
    h += 'Plus la ligne est longue, plus le résultat dépend de cette donnée : ce sont les hypothèses à vérifier en priorité avec le client. ';
    h += 'Exemple : ' + esc(tv.label.toLowerCase()) + ' à −' + pc + ' donne ' + eur(tv.low) + ', à +' + pc + ' ' + eur(tv.high) + ' (contre ' + eur(S.base) + ' aujourd’hui). ';
    h += 'La ligne pointillée « équilibre » correspond à une économie nulle : une barre qui la franchit signifie que le diesel deviendrait plus avantageux dans ce cas.</div>';
  }

  var k, j, maxAbs = 0;
  for (k = 0; k < S.grid.length; k++) { for (j = 0; j < S.grid[k].length; j++) { maxAbs = Math.max(maxAbs, Math.abs(S.grid[k][j])); } }
  h += '<div class="st">' + (complet ? 'Économie sur ' + ans(r.n) : 'Économie d’énergie sur ' + ans(r.n)) + ' selon le kilométrage et le prix du gazole · HT</div>';
  h += '<table class="hm"><tr><th class="rh">km/an \\ gazole HT</th>';
  for (j = 0; j < S.steps.length; j++) { h += '<th>' + fmt(r.pDieHT * Math.max(0.01, S.steps[j]), 3) + ' €/L</th>'; }
  h += '</tr>';
  for (k = 0; k < S.steps.length; k++) {
    h += '<tr><th class="rh">' + fmt(r.kmAn * Math.max(0.01, S.steps[k]), 0) + '</th>';
    for (j = 0; j < S.steps.length; j++) {
      h += '<td' + (k === 2 && j === 2 ? ' class="cur"' : '') + ' style="background:' + heatColor(S.grid[k][j], maxAbs) + '">' + fmt(Math.round(S.grid[k][j] / 1000) || 0, 0) + ' k€</td>';
    }
    h += '</tr>';
  }
  h += '</table>';
  h += '<div class="basis">Lecture : case encadrée = situation actuelle ; vert = électrique plus avantageux, rouge = diesel plus avantageux. Pas de ± ' + fmt(S.amp * 100, 0) + ' % sur chaque axe.</div>';
  h += footHtml(d, '') + '</div>';
  return h;
}

function modelWarnings(d, on, r) {
  var w = [];
  if (on.achat && (r.leaseShortE || r.leaseShortD)) {
    w.push('Le loyer de location simple est prolongé au même tarif après l’échéance du contrat initial ; confirmer le tarif et la disponibilité du véhicule de renouvellement.');
  }
  if (isComplet()) {
    if (!on.entretien) { w.push('Entretien désactivé : ce poste est exclu du coût total.'); }
    if (!on.adblue) { w.push('AdBlue désactivé : ce poste est exclu du coût total diesel.'); }
    if (!on.chauf && on.recharge) { w.push('Coût du temps de chauffeur désactivé : les heures de recharge publique ne sont pas valorisées.'); }
    if (!on.batterie) { w.push('Vieillissement et remplacement de batterie désactivés : aucune dégradation ni aucun coût de remplacement n’est intégré.'); }
    if (!on.assur) { w.push('Assurance désactivée : ce poste est exclu du coût total.'); }
    if (!on.borne) { w.push('Investissement et abonnement de recharge au dépôt désactivés : vérifier qu’ils sont déjà pris en charge ailleurs.'); }
    if (on.energie && !on.recharge && r.bat && !r.bat.okRange) { w.push('L’autonomie estimée est inférieure au kilométrage journalier : la recharge en route n’est pas chiffrée car la recharge publique est désactivée.'); }
    if (on.recharge && d.rechMode === 'auto' && !on.batterie) { w.push('Le mode de recharge publique automatique nécessite le modèle de batterie ; la recharge automatique ne peut pas être estimée correctement.'); }
    if (on.batterie && d.capBat > 0 && d.bornePuis > 0 && r.bat && r.bat.needHN > d.fenetre) { w.push('Le temps de recharge estimé au dépôt dépasse la fenêtre disponible ; une borne plus puissante ou une recharge complémentaire peut être nécessaire.'); }
    if (on.batterie && (d.socArr < 0 || d.socFin > 100 || d.socFin <= d.socArr)) { w.push('Les seuils de charge de la batterie sont incohérents : vérifier le SOC d’arrivée et le SOC cible.'); }
    if (on.recharge && (d.rechPow <= 0 || (d.rechMode === 'dur' && d.rechDur <= 0))) { w.push('Les paramètres de puissance ou de durée de recharge publique ne permettent pas d’estimer une recharge exploitable.'); }
    if (on.revente) { w.push('La valeur de revente est une estimation forfaitaire saisie par l’utilisateur ; elle n’est pas prédite à partir du kilométrage, de l’âge ou de l’état de santé de la batterie.'); }
  }
  if (on.recharge) { w.push('La recharge publique est un modèle simplifié : pertes de charge, courbe de puissance, disponibilité des bornes, files d’attente et détours ne sont pas simulés.'); }
  if (on.co2 && on.batterie && r.bat && r.bat.replYears.length > 0) { w.push('Les émissions de CO₂ à l’usage intègrent la consommation électrique liée au vieillissement de la batterie, mais pas les émissions de fabrication/remplacement de la batterie.'); }
  return w;
}

function renderReport() {
  var d = readData(state);
  var on = effOn();
  var r = compute(d, on);
  var warn = document.getElementById('reportWarn');

  var w = '';

  if (!r.valid) {
    w += '<div class="warn">Données incomplètes : renseigne le kilométrage et la consommation (ou désactive l’énergie) pour générer le rapport.</div>';
    btn.disabled = true;
  } else {
    btn.disabled = false;
  }
  if (miss.length > 0) {
    w += '<div class="warn red"><b>' + miss.length + ' donnée(s) manquante(s) ou invalide(s)</b> : vérifie que tu ne les as pas oubliées.' + missingHtml(miss) + '<button type="button" class="btn sec" data-action="first-miss">Les compléter dans les données</button></div>';
  }
  var alerts = modelWarnings(d, on, r);
  if (alerts.length > 0) {
    w += '<div class="warn"><b>Points de vigilance du modèle</b><ul class="redlist">';
    for (var ai = 0; ai < alerts.length; ai++) { w += '<li>' + esc(alerts[ai]) + '</li>'; }
    w += '</ul></div>';
  }
  warn.innerHTML = w;
  var pages = buildPages(r, d, on);
  var host = document.getElementById('pagesHost');
  var h = '';

  for (i = 0; i < pages.length; i++) {
    h += '<div class="pgwrap"><div class="pgscale">' + pages[i] + '</div></div>';
  }
  host.innerHTML = h;
  btn.textContent = 'Télécharger le rapport en PDF (' + pages.length + ' pages)';
  fitPages();
  var overflowPages = fitPageContent(host);
  if (overflowPages.length > 0) {
    warn.innerHTML += '<div class="warn red"><b>Rapport dense :</b> le contenu de la/les page(s) ' + overflowPages.join(', ') + ' a dû être nettement réduit pour tenir sur une page. Désactive des options facultatives pour un rendu plus lisible.</div>';
  }
}

/* Si le contenu d'une page dépasse la hauteur A4 (polices plus grandes selon l'appareil), il est réduit pour tenir */
var PAGE_AVAIL = 1122 - 34 - 52;
function fitPageContent(root) {
  var pages = root.getElementsByClassName('page');
  var tooDense = [];
  var i, j, pg, pc, kids, hgt, k;
  for (i = 0; i < pages.length; i++) {
    pg = pages[i];
    pc = pg.querySelector(':scope > .pgc');
    if (!pc) {
      pc = document.createElement('div');
      pc.className = 'pgc';
      kids = [];
      for (j = 0; j < pg.childNodes.length; j++) { if (!(pg.childNodes[j].classList && pg.childNodes[j].classList.contains('foot'))) { kids.push(pg.childNodes[j]); } }
      for (j = 0; j < kids.length; j++) { pc.appendChild(kids[j]); }
      pg.insertBefore(pc, pg.firstChild);
    }
    pc.style.transform = ''; pc.style.width = '';
    hgt = pc.offsetHeight;
    if (hgt > PAGE_AVAIL) {
      k = PAGE_AVAIL / hgt;
      pc.style.transformOrigin = 'top left';
      pc.style.transform = 'scale(' + k.toFixed(4) + ')';
      pc.style.width = (100 / k).toFixed(3) + '%';
      if (k < 0.86) { tooDense.push(i + 1); }
    }
  }
  return tooDense;
}
function fitPages() {
  var host = document.getElementById('pagesHost');
  var w = host.clientWidth;
  if (!w) { return; }
  var sc = Math.min(1, w / 794);
  var wraps = host.getElementsByClassName('pgwrap');
  var i, sEl;
  for (i = 0; i < wraps.length; i++) {
    sEl = wraps[i].firstChild;
    sEl.style.transform = 'scale(' + sc + ')';
    wraps[i].style.width = (794 * sc) + 'px';
    wraps[i].style.height = (1122 * sc) + 'px';
  }
}

  state = copyDefaults();
  ons = copyOn();
  saveState();
  fillInputs();
  refreshAll();
  if (reportVisible()) { renderReport(); }
}
function doClear() {
  var k;
  for (k in state) {
    if (Object.prototype.hasOwnProperty.call(state, k)) {
      if (!SEL_KEYS[k]) { state[k] = ''; }
    }
  }
  saveState();
  fillInputs();
  refreshAll();
  if (reportVisible()) { renderReport(); }
}

/* ----- PDF ----- */
function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function startPdf() {
  var d = readData(state);
  var on = effOn();
  var r = compute(d, on);
  if (!r.valid) { return; }
  var pages = buildPages(r, d, on);
  if (!window.html2canvas || !window.jspdf) {
    printFallback(pages);
    return;
  }
  var btn = document.getElementById('btnPdf');
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Génération du PDF…';
  var stage = document.getElementById('stage');
  stage.innerHTML = pages.join('');
  fitPageContent(stage);
  var els = stage.getElementsByClassName('page');
  var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
  var idx = 0;
  var name = 'MasterTCO' + (d.client ? '-' + slug(d.client) : '') + '.pdf';

  function finish(ok) {
    stage.innerHTML = '';
    btn.disabled = false;
    btn.textContent = label;
    if (!ok) { printFallback(pages); }
  }
  function next() {
    if (idx >= els.length) {
      finish(true);
      pdfDeliver(pdf.output('blob'), name);
      return;
    }
    /* JPEG haute qualité : ~250 dpi, rendu net pour quelques Mo au lieu de centaines en PNG */
    window.html2canvas(els[idx], { scale: 2.6, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0 }).then(function (canvas) {
      if (idx > 0) { pdf.addPage(); }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      idx++;
      next();
    }).catch(function () {
      finish(false);
    });
  }
  next();
}
/* PDF prêt : partage direct (mail, messagerie, Drive…) sur téléphone, sinon téléchargement */
function pdfDownloadBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
}
function pdfDeliver(blob, name) {
  var file = null;
  try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) { file = null; }
  var canShare = !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] }));
  var mobile = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (!canShare || !mobile) { pdfDownloadBlob(blob, name); return; }
  var size = blob.size >= 1048576 ? fmt(blob.size / 1048576, 1) + ' Mo' : fmt(blob.size / 1024, 0) + ' Ko';
  showModal('Rapport prêt', name + ' · ' + size + '. Partage-le directement (mail, messagerie, Drive…) ou enregistre-le sur l’appareil.', 'Partager', function () {
    navigator.share({ files: [file], title: name }).catch(function (err) {
      if (!err || err.name !== 'AbortError') { pdfDownloadBlob(blob, name); }
    });
  }, '', 'Télécharger', function () { pdfDownloadBlob(blob, name); });
  document.getElementById('mOk').className = 'btn main';
}
function downloadPdf() {
  var miss = missingList();
  if (miss.length > 0) {
    showModal('Données manquantes', miss.length + ' donnée(s) ne sont pas renseignées ou sont invalides. Les as-tu oubliées ?', 'Télécharger quand même', startPdf, missingHtml(miss), 'Compléter', goToFirstMissing);
  } else {
    startPdf();
  }
}
function printFallback(pages) {
  var pa = document.getElementById('printArea');
  pa.innerHTML = pages.join('');
  window.print();
}

/* ----- Événements ----- */
var KM_DEFAULT_NB = { jour: '220', sem: '46', mois: '11' };
function onFieldEvent(e) {
  var t = e.target;
  var key = t.getAttribute ? t.getAttribute('data-key') : null;
  if (!key) { return; }
  if (e.type === 'change' && t.tagName === 'INPUT' && state[key] === t.value) { return; }
  var prevAnnual = (key === 'kmUnit') ? annualKm(readData(state)) : 0;
  state[key] = t.value;
  if (key === 'kmUnit') {
    state.kmNb = KM_DEFAULT_NB[t.value] || '';
    var nbP = t.value === 'an' ? 1 : num(state.kmNb);
    if (prevAnnual > 0 && nbP > 0) {
      state.kmPer = (t.value === 'an' ? String(Math.round(prevAnnual)) : String(Math.round(prevAnnual / nbP * 10) / 10)).replace('.', ',');
    }
  }
  if (e.type === 'change' || t.tagName === 'SELECT') { fillInputs(); }
  saveState();
  refreshAll();
}
document.addEventListener('input', onFieldEvent);
document.addEventListener('change', onFieldEvent);

document.addEventListener('click', function (e) {
  var el = e.target;
  var action = null;
  while (el && el !== document) {
    if (el.getAttribute && el.getAttribute('data-action')) {
      action = el.getAttribute('data-action');
      break;
    }
    el = el.parentNode;
  }
  if (!action || el.disabled) { return; }
  if (action === 'tab') { showTab(el.getAttribute('data-tab')); }
  else if (action === 'go-rapport') { showTab('rapport'); }
  else if (action === 'toggle') {
    var key = el.getAttribute('data-on');
    ons[key] = !ons[key];
    saveState();
    refreshAll();
  }
  else if (action === 'mode') {
    state.mode = el.getAttribute('data-mode');
    saveState();
    refreshAll();
    if (reportVisible()) { renderReport(); }
  }
  else if (action === 'first-miss') { goToFirstMissing(); }
  else if (action === 'reset') {
    showModal('Réinitialiser les données ?', 'Les valeurs et les interrupteurs reviennent à l’exemple de départ (tracteur 44 t, essai de 368,4 km).', 'Réinitialiser', doReset);
  }
  else if (action === 'clear') {
    showModal('Tout effacer ?', 'Tous les champs seront vidés. Les interrupteurs et les unités restent tels quels. Tu pourras revenir à l’exemple avec « Réinitialiser ».', 'Tout effacer', doClear);
  }
  else if (action === 'pdf') { downloadPdf(); }
  else if (action === 'dos-save') { dosSaveClick(); }
  else if (action === 'dos-panel') { dosOpenPanel(); }
  else if (action === 'dos-close') { dosClosePanel(); }
  else if (action === 'dos-new') { dosNew(); }
  else if (action === 'dos-load') { dosOpen(el.getAttribute('data-id')); }
  else if (action === 'dos-dup') { dosDuplicate(el.getAttribute('data-id')); }
  else if (action === 'dos-ren') { dosRename(el.getAttribute('data-id')); }
  else if (action === 'dos-del') { dosDelete(el.getAttribute('data-id')); }
  else if (action === 'dos-export') { dosExport(); }
  else if (action === 'dos-import') { dosImportClick(); }
  else if (action === 'prompt-ok') { promptSubmit(); }
  else if (action === 'prompt-cancel') { closePrompt(); }
  else if (action === 'modal-cancel') {
    var cc = modalCancel;
    closeModal();
    if (cc) { cc(); }
  }
  else if (action === 'modal-ok') {
    var cb = modalOk;
    closeModal();
    if (cb) { cb(); }
  }
});

/* ===================== DOSSIERS CLIENTS (stockage local + fichier de sauvegarde) ===================== */
var DOS_KEY = 'masterTCO_dossiers_v1';
var DOS_CUR_KEY = 'masterTCO_dossier_courant';
var DOS_EXPORT_KEY = 'masterTCO_dossiers_export';
var DOS_FORMAT = 'MasterTCO-dossiers';
var dosStudies = [];
var dosCurrent = null;
var promptCb = null;
var toastTimer = null;

function dosLoad() {
  var raw = null, o;
  try { raw = localStorage.getItem(DOS_KEY); } catch (e) { raw = null; }
  dosStudies = [];
  if (raw) {
    try { o = JSON.parse(raw); if (o && o.studies && o.studies.length >= 0) { dosStudies = o.studies.filter(dosValidStudy); } } catch (e2) { dosStudies = []; }
  }
  try { dosCurrent = localStorage.getItem(DOS_CUR_KEY) || null; } catch (e3) { dosCurrent = null; }
  if (dosCurrent && !dosFind(dosCurrent)) { dosCurrent = null; }
}
function dosPersist() {
  try {
    localStorage.setItem(DOS_KEY, JSON.stringify({ format: DOS_FORMAT, version: 1, studies: dosStudies }));
    return true;
  } catch (e) {
    showModal('Enregistrement impossible', 'Le navigateur a refusé l’enregistrement (mémoire pleine ou navigation privée). Exporte tes dossiers dans un fichier pour ne rien perdre.', 'Exporter', dosExport);
    return false;
  }
}
function dosSetCurrent(id) {
  dosCurrent = id || null;
  try { if (dosCurrent) { localStorage.setItem(DOS_CUR_KEY, dosCurrent); } else { localStorage.removeItem(DOS_CUR_KEY); } } catch (e) {}
}
function dosValidStudy(x) {
  return !!(x && typeof x.id === 'string' && x.data && typeof x.data === 'object' && x.data.v && typeof x.data.v === 'object');
}
function dosFind(id) {
  var i;
  for (i = 0; i < dosStudies.length; i++) { if (dosStudies[i].id === id) { return dosStudies[i]; } }
  return null;
}
function dosNewId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dosSnapshot() { return { v: copyObj(state), on: copyObj(ons) }; }
function dosSig(o) {
  var v = o.v || {}, on = o.on || {};
  var keys = Object.keys(v).sort(), okeys = Object.keys(on).sort();
  var a = [], i;
  for (i = 0; i < keys.length; i++) { a.push(keys[i] + '=' + v[keys[i]]); }
  for (i = 0; i < okeys.length; i++) { a.push(okeys[i] + ':' + (on[okeys[i]] ? 1 : 0)); }
  return a.join('|');
}
function dosKpi() {
  try {
    var d = readData(state);
    var r = compute(d, effOn());
    return { valid: !!r.valid, complet: isComplet(), n: r.n, tcoSav: r.tcoSav, eneSav: r.an ? r.an.ecoHT : 0 };
  } catch (e) { return { valid: false }; }
}
function dosModified() {
  var c = dosCurrent ? dosFind(dosCurrent) : null;
  return !!c && dosSig(c.data) !== dosSig(dosSnapshot());
}
function dosDate(ts) {
  if (!ts) { return ''; }
  var d = new Date(ts);
  return d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function dosToday() { return new Date().toLocaleDateString('fr-FR'); }
function dosClientName(x) { return String(x.client || '').replace(/^\s+|\s+$/g, '') || 'Sans client'; }

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on';
  if (toastTimer) { clearTimeout(toastTimer); }
  toastTimer = setTimeout(function () { t.className = ''; }, 2600);
}

function refreshDossierBar() {
  var c = dosCurrent ? dosFind(dosCurrent) : null;
  var nEl = document.getElementById('dosName');
  var sEl = document.getElementById('dosState');
  if (!nEl) { return; }
  if (!c) {
    nEl.textContent = 'Étude non enregistrée';
    sEl.textContent = dosStudies.length ? dosStudies.length + ' étude(s) dans tes dossiers' : 'Enregistre-la pour la retrouver plus tard';
    sEl.className = 'ds';
    return;
  }
  nEl.textContent = dosClientName(c);
  if (dosModified()) { sEl.textContent = (c.name || 'Étude') + ' · modifications non enregistrées'; sEl.className = 'ds mod'; }
  else { sEl.textContent = (c.name || 'Étude') + ' · enregistrée le ' + dosDate(c.updated); sEl.className = 'ds'; }
}

/* ----- Fenêtre de saisie client / nom ----- */
function showPrompt(title, text, client, name, okLabel, cb) {
  document.getElementById('pTitle').textContent = title;
  document.getElementById('pText').textContent = text;
  document.getElementById('pClient').value = client || '';
  document.getElementById('pName').value = name || '';
  document.getElementById('pOk').textContent = okLabel;
  document.getElementById('pErr').style.display = 'none';
  promptCb = cb;
  document.getElementById('prompt').className = 'on';
  setTimeout(function () { var f = document.getElementById(client ? 'pName' : 'pClient'); f.focus(); f.select(); }, 50);
}
function closePrompt() { document.getElementById('prompt').className = ''; promptCb = null; }
function promptSubmit() {
  var c = document.getElementById('pClient').value.replace(/^\s+|\s+$/g, '');
  var n = document.getElementById('pName').value.replace(/^\s+|\s+$/g, '');
  var err = document.getElementById('pErr');
  if (!c) { err.textContent = 'Indique le nom du client.'; err.style.display = 'block'; document.getElementById('pClient').focus(); return; }
  if (!n) { n = 'Étude du ' + dosToday(); }
  var cb = promptCb;
  closePrompt();
  if (cb) { cb(c, n); }
}

/* ----- Enregistrer ----- */
function dosSaveClick() {
  var c = dosCurrent ? dosFind(dosCurrent) : null;
  if (c) {
    if (!dosModified()) { toast('Étude déjà à jour'); return; }
    dosUpdateCurrent(c);
    return;
  }
  dosSaveAs();
}
function dosSaveAs() {
  showPrompt('Enregistrer l’étude', 'Elle sera rangée dans le dossier de ce client. Le nom du client est aussi celui qui figure sur le rapport.', state.client, 'Étude du ' + dosToday(), 'Enregistrer', function (client, name) {
    state.client = client;
    saveState();
    fillInputs();
    var now = Date.now();
    var st = { id: dosNewId(), client: client, name: name, created: now, updated: now, data: dosSnapshot(), kpi: dosKpi() };
    dosStudies.push(st);
    if (dosPersist()) {
      dosSetCurrent(st.id);
      refreshAll();
      toast('Étude enregistrée dans le dossier ' + client);
    } else { dosStudies.pop(); }
  });
}
function dosUpdateCurrent(c) {
  var prev = { data: c.data, kpi: c.kpi, updated: c.updated, client: c.client };
  c.data = dosSnapshot();
  c.kpi = dosKpi();
  c.updated = Date.now();
  if (String(state.client || '').replace(/^\s+|\s+$/g, '')) { c.client = state.client; }
  if (dosPersist()) { refreshAll(); toast('Étude mise à jour'); }
  else { c.data = prev.data; c.kpi = prev.kpi; c.updated = prev.updated; c.client = prev.client; }
}

/* ----- Ouvrir / nouvelle étude (avec garde si modifications non enregistrées) ----- */
function dosGuard(next) {
  var c = dosCurrent ? dosFind(dosCurrent) : null;
  if (c && dosModified()) {
    showModal('Modifications non enregistrées', 'L’étude « ' + (c.name || '') + ' » (' + dosClientName(c) + ') a été modifiée depuis son dernier enregistrement.', 'Continuer sans enregistrer', next, '', 'Annuler');
  } else if (!c && dosSig(dosSnapshot()) !== dosSig({ v: copyDefaults(), on: copyOn() })) {
    showModal('Étude non enregistrée', 'L’étude affichée n’est enregistrée dans aucun dossier : elle sera remplacée.', 'Continuer', next, '', 'Annuler');
  } else { next(); }
}
function dosApply(data) {
  state = copyDefaults();
  ons = copyOn();
  applyStored(data);
  saveState();
  fillInputs();
  refreshAll();
  if (reportVisible()) { renderReport(); }
}
function dosOpen(id) {
  var st = dosFind(id);
  if (!st) { return; }
  dosGuard(function () {
    dosSetCurrent(st.id);
    dosApply(st.data);
    dosClosePanel();
    showTab('saisie');
    toast('Étude ouverte : ' + dosClientName(st) + ' · ' + st.name);
  });
}
function dosNew() {
  dosGuard(function () {
    dosSetCurrent(null);
    dosApply({ v: copyDefaults(), on: copyOn() });
    dosClosePanel();
    showTab('saisie');
    toast('Nouvelle étude à partir de l’exemple de départ');
  });
}

/* ----- Dupliquer, renommer, supprimer ----- */
function dosDuplicate(id) {
  var st = dosFind(id);
  if (!st) { return; }
  showPrompt('Dupliquer l’étude', 'Crée une copie pour tester une variante (financement, kilométrage…). Tu peux la ranger chez un autre client.', st.client, st.name + ' (copie)', 'Dupliquer', function (client, name) {
    var now = Date.now();
    var data = JSON.parse(JSON.stringify(st.data));
    data.v.client = client;
    dosStudies.push({ id: dosNewId(), client: client, name: name, created: now, updated: now, data: data, kpi: st.kpi });
    if (dosPersist()) { renderDossiers(); toast('Copie créée'); } else { dosStudies.pop(); }
  });
}
function dosRename(id) {
  var st = dosFind(id);
  if (!st) { return; }
  showPrompt('Renommer l’étude', 'Le nom du client est aussi mis à jour sur le rapport de cette étude.', st.client, st.name, 'Renommer', function (client, name) {
    var prev = [st.client, st.name, st.data.v.client];
    st.client = client; st.name = name; st.data.v.client = client;
    if (dosCurrent === st.id) { state.client = client; saveState(); fillInputs(); }
    if (dosPersist()) { renderDossiers(); refreshAll(); toast('Étude renommée'); }
    else { st.client = prev[0]; st.name = prev[1]; st.data.v.client = prev[2]; }
  });
}
function dosDelete(id) {
  var st = dosFind(id);
  if (!st) { return; }
  showModal('Supprimer cette étude ?', '« ' + st.name + ' » (' + dosClientName(st) + ') sera supprimée de ce téléphone. Seule une sauvegarde exportée permettra de la récupérer.', 'Supprimer', function () {
    var i, keep = [];
    for (i = 0; i < dosStudies.length; i++) { if (dosStudies[i].id !== id) { keep.push(dosStudies[i]); } }
    var prev = dosStudies;
    dosStudies = keep;
    if (dosPersist()) {
      if (dosCurrent === id) { dosSetCurrent(null); }
      renderDossiers(); refreshAll(); toast('Étude supprimée');
    } else { dosStudies = prev; }
  });
}

/* ----- Liste ----- */
function dosOpenPanel() {
  document.getElementById('dosSearch').value = '';
  renderDossiers();
  document.getElementById('dossiers').className = 'on';
  document.body.style.overflow = 'hidden';
}
function dosClosePanel() {
  document.getElementById('dossiers').className = '';
  document.body.style.overflow = '';
}
function dosNorm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function renderDossiers() {
  var info = document.getElementById('dosSaveInfo');
  var last = null;
  try { last = parseInt(localStorage.getItem(DOS_EXPORT_KEY), 10) || null; } catch (e) { last = null; }
  var newest = 0, i;
  for (i = 0; i < dosStudies.length; i++) { if (dosStudies[i].updated > newest) { newest = dosStudies[i].updated; } }
  if (!dosStudies.length) { info.innerHTML = ''; }
  else if (!last) { info.innerHTML = '<div class="dsave late"><b>Aucune sauvegarde exportée.</b> Tes dossiers ne sont que sur cet appareil : exporte-les pour pouvoir les récupérer ou les ouvrir ailleurs.</div>'; }
  else if (newest > last) {
    var days = Math.floor((Date.now() - last) / 86400000);
    info.innerHTML = '<div class="dsave' + (days >= 7 ? ' late' : '') + '">Dernière sauvegarde exportée le ' + esc(dosDate(last)) + '. Des études ont changé depuis : pense à exporter à nouveau.</div>';
  } else { info.innerHTML = '<div class="dsave">Sauvegarde à jour : exportée le ' + esc(dosDate(last)) + '.</div>'; }

  var q = dosNorm(document.getElementById('dosSearch').value);
  var list = dosStudies.filter(function (x) { return !q || dosNorm(dosClientName(x) + ' ' + x.name).indexOf(q) >= 0; });
  var host = document.getElementById('dosList');
  if (!dosStudies.length) { host.innerHTML = '<div class="dempty">Aucune étude enregistrée.<br>Utilise « Enregistrer » sur la page Données, ou importe un fichier de sauvegarde.</div>'; return; }
  if (!list.length) { host.innerHTML = '<div class="dempty">Aucun résultat.</div>'; return; }
  var groups = {}, names = [];
  for (i = 0; i < list.length; i++) {
    var cn = dosClientName(list[i]);
    var key = dosNorm(cn);
    if (!groups[key]) { groups[key] = { name: cn, items: [], last: 0 }; names.push(key); }
    groups[key].items.push(list[i]);
    if (list[i].updated > groups[key].last) { groups[key].last = list[i].updated; }
  }
  names.sort(function (a, b) { return groups[a].name.localeCompare(groups[b].name, 'fr'); });
  var h = '', g, j, x, eco, k;
  for (i = 0; i < names.length; i++) {
    g = groups[names[i]];
    g.items.sort(function (a, b) { return b.updated - a.updated; });
    h += '<div class="dclient">' + esc(g.name) + ' · ' + g.items.length + ' étude' + (g.items.length > 1 ? 's' : '') + '</div>';
    for (j = 0; j < g.items.length; j++) {
      x = g.items[j];
      k = x.kpi || {};
      eco = '';
      if (k.valid && k.complet) { eco = '<span class="eco ' + (k.tcoSav >= 0 ? 'pos' : 'neg') + '">' + eur(k.tcoSav) + '</span>'; }
      else if (k.valid) { eco = '<span class="eco pos">' + eur(k.eneSav) + '/an</span>'; }
      h += '<div class="dstudy' + (x.id === dosCurrent ? ' cur' : '') + '"><div class="t1"><span class="nm">' + esc(x.name) + (x.id === dosCurrent ? ' <span style="color:var(--brand);font-size:12px">· ouverte</span>' : '') + '</span>' + eco + '</div>';
      h += '<div class="meta">' + (k.valid ? (k.complet ? 'Économie sur ' + ans(k.n) + ' (coût total)' : 'Consommation seule · économie d’énergie') + ' · ' : '') + 'modifiée le ' + esc(dosDate(x.updated)) + '</div>';
      h += '<div class="dacts"><button class="btn main" type="button" data-action="dos-load" data-id="' + esc(x.id) + '">Ouvrir</button>';
      h += '<button class="btn sec" type="button" data-action="dos-dup" data-id="' + esc(x.id) + '">Dupliquer</button>';
      h += '<button class="btn sec" type="button" data-action="dos-ren" data-id="' + esc(x.id) + '">Renommer</button>';
      h += '<button class="btn danger" type="button" data-action="dos-del" data-id="' + esc(x.id) + '">Supprimer</button></div></div>';
    }
  }
  host.innerHTML = h;
}

/* ----- Export / import du fichier de sauvegarde ----- */
function dosExport() {
  if (!dosStudies.length) { toast('Aucune étude à exporter'); return; }
  var now = new Date();
  var stamp = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
  var name = 'MasterTCO-dossiers-' + stamp + '.json';
  var json = JSON.stringify({ format: DOS_FORMAT, version: 1, exported: now.getTime(), studies: dosStudies }, null, 1);
  var blob = new Blob([json], { type: 'application/json' });
  function done() {
    try { localStorage.setItem(DOS_EXPORT_KEY, String(Date.now())); } catch (e) {}
    renderDossiers();
    toast(dosStudies.length + ' étude(s) exportée(s)');
  }
  function download() {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    done();
  }
  var file = null;
  try { file = new File([blob], name, { type: 'application/json' }); } catch (e) { file = null; }
  var mobile = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (mobile && file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    navigator.share({ files: [file], title: name }).then(done).catch(function (err) {
      if (!err || err.name !== 'AbortError') { download(); }
    });
  } else { download(); }
}
function dosImportClick() {
  var f = document.getElementById('dosFile');
  f.value = '';
  f.click();
}
function dosImportFile(file) {
  if (!file) { return; }
  var rd = new FileReader();
  rd.onload = function () {
    var o = null;
    try { o = JSON.parse(String(rd.result)); } catch (e) { o = null; }
    if (!o || o.format !== DOS_FORMAT || !o.studies || typeof o.studies.length !== 'number') {
      showModal('Fichier non reconnu', 'Ce fichier n’est pas une sauvegarde de dossiers MasterTCO.', 'OK', null);
      return;
    }
    var add = 0, upd = 0, same = 0, bad = 0, i, x, cur;
    var prev = JSON.parse(JSON.stringify(dosStudies));
    for (i = 0; i < o.studies.length; i++) {
      x = o.studies[i];
      if (!dosValidStudy(x)) { bad++; continue; }
      x = { id: x.id, client: String(x.client || ''), name: String(x.name || 'Étude'), created: +x.created || Date.now(), updated: +x.updated || Date.now(), data: { v: x.data.v, on: x.data.on || {} }, kpi: x.kpi || {} };
      cur = dosFind(x.id);
      if (!cur) { dosStudies.push(x); add++; }
      else if (x.updated > cur.updated) { dosStudies[dosStudies.indexOf(cur)] = x; upd++; }
      else { same++; }
    }
    if (!dosPersist()) { dosStudies = prev; return; }
    renderDossiers();
    refreshAll();
    var parts = [];
    parts.push(add + ' étude(s) ajoutée(s)');
    if (upd) { parts.push(upd + ' mise(s) à jour par une version plus récente'); }
    if (same) { parts.push(same + ' déjà présente(s) et conservée(s)'); }
    if (bad) { parts.push(bad + ' illisible(s) ignorée(s)'); }
    showModal('Import terminé', parts.join(' · ') + '.', 'OK', null);
  };
  rd.onerror = function () { showModal('Lecture impossible', 'Le fichier n’a pas pu être lu.', 'OK', null); };
  rd.readAsText(file);
}
document.getElementById('dosFile').addEventListener('change', function (e) { dosImportFile(e.target.files && e.target.files[0]); });
document.getElementById('dosSearch').addEventListener('input', renderDossiers);
document.getElementById('prompt').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); promptSubmit(); } else if (e.key === 'Escape') { closePrompt(); } });

window.addEventListener('resize', fitPages);
window.addEventListener('orientationchange', function () { setTimeout(fitPages, 200); });

buildMaps();
loadState();
dosLoad();
buildForm();
</script>
