<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MasterTCO</title>
<style>
:root{
  --brand:#00529b;
  --green:#1a9b6c;
  --orange:#e0642a;
  --red:#c62828;
  --bg:#f3f5f8;
  --card:#ffffff;
  --text:#1b2430;
  --muted:#6b7683;
  --line:#dde2e9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
#app{max-width:760px;margin:0 auto;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.top .tag{font-size:11.5px;opacity:.8;text-align:right;line-height:1.25;letter-spacing:.02em}
.wm{display:inline-flex;align-items:baseline;white-space:nowrap;text-transform:uppercase;line-height:1;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
.wm .a{font-weight:300;letter-spacing:.3em;margin-right:.32em}
.wm .b{font-weight:800;letter-spacing:.14em}
.top .wm{font-size:19px;color:#fff}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:15px;font-weight:600;padding:10px 6px;border-radius:10px 10px 0 0;cursor:pointer;font-family:inherit}
.tab.on{background:var(--bg);color:var(--brand)}
.view{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font-size:16px;color:var(--brand)}
.card .note{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card .note.blk{color:#a35a00;font-weight:600}
.cbody{margin-top:4px;transition:opacity .15s}
.card.off .cbody{opacity:.4}
.card.off h2{color:var(--muted)}
.sep{margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.field{margin-top:10px}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.fhead label{font-size:13px;font-weight:600}
.fhead .hint{font-weight:400;color:var(--muted)}
.mbadge{display:none;flex:none;border-radius:8px;background:#fdeaea;color:var(--red);font-size:11px;font-weight:700;padding:3px 8px}
.field.miss .fhead label{color:var(--red)}
.field.miss .inp{border-color:var(--red);background:#fff6f6}
.field.miss .mbadge{display:inline-block}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.inp:focus-within{border-color:var(--brand)}
.inp input,.inp select.full{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:11px 12px;background:transparent;color:var(--text);font-family:inherit}
.inp input:disabled,.inp select:disabled{color:var(--muted)}
.inp .unit{padding:0 12px;font-size:13px;color:var(--muted);white-space:nowrap;background:#f6f8fa;align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--line)}
.inp select.usel{flex:none;max-width:52%;border:0;border-left:1px solid var(--line);outline:0;background:#f6f8fa;color:var(--brand);font-size:14px;font-weight:600;padding:0 8px;align-self:stretch;font-family:inherit}
.calc{margin-top:8px;font-size:13px;color:var(--brand);background:#eaf2fb;border-radius:8px;padding:6px 10px}
.calc.alert{color:#8a4b00;background:#fff4e5}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:0;background:#c5ccd6;position:relative;cursor:pointer;padding:0;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--green)}
.sw.on span{left:25px}
.modebar{background:#fff;border-radius:14px;padding:10px 12px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modebar .mt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.mslider{position:relative;display:flex;background:#e6edf5;border-radius:12px;padding:3px}
.mthumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--brand);border-radius:10px;transition:transform .22s}
.mslider.right .mthumb{transform:translateX(100%)}
.mopt{position:relative;flex:1;text-align:center;padding:11px 4px;font-weight:700;font-size:14px;color:var(--brand);transition:color .2s;border:0;background:transparent;font-family:inherit;cursor:pointer}
.mopt.on{color:#fff}
.live{background:linear-gradient(135deg,#0b3d91,#00529b);color:#fff}
.live h2{color:#fff}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lbox{background:rgba(255,255,255,.14);border-radius:10px;padding:10px}
.lbox .t{font-size:12px;opacity:.85}
.lbox .v{font-size:18px;font-weight:700;margin-top:2px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.main{background:var(--brand);color:#fff}
.btn.sec{background:#e6edf5;color:var(--brand)}
.btn.danger{background:#fdeaea;color:#b42318}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.warn{background:#fff4e5;border:1px solid #f5c98b;color:#8a4b00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.warn.red{background:#fff1f1;border-color:#f0b4b4;color:var(--red)}
.warn .redlist{margin:6px 0 8px;padding-left:18px;color:var(--red)}
.warn .redlist li{margin-bottom:2px}
.warn .btn{padding:9px 12px;font-size:14px;margin-top:2px}
.toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.pgwrap{margin:0 auto 14px;overflow:hidden;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.pgscale{transform-origin:top left;width:794px}
#modal{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;max-height:86vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox .redlist{margin:0 0 12px;padding-left:18px;color:var(--red);font-size:14px}
/* Pages A4 (96 dpi) */
.page{width:794px;height:1122px;padding:34px 44px 52px;background:#fff;color:#1b2430;position:relative;overflow:hidden;font-size:13px;line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.ph{border-bottom:1px solid #cfd6df;padding-bottom:12px;margin-bottom:14px}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.wmwrap{display:inline-block}
.wmwrap .wm{font-size:17px;color:#1b2430}
.wmwrap .wm .b{color:var(--brand)}
.wmbar{height:2px;margin-top:7px;background:var(--brand)}
.ph-r{text-align:right;font-size:11.5px;color:#6b7683;line-height:1.45}
.ph-t{font-size:22px;font-weight:800;color:#0b2a4a;line-height:1.15}
.ph-s{font-size:12.5px;color:#6b7683;margin-top:3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.kpi{border-radius:12px;padding:10px 16px;color:#fff}
.kpi.g{background:var(--green)}
.kpi.b{background:var(--brand)}
.kpi .k1{font-size:12px;opacity:.92;text-transform:uppercase;letter-spacing:.4px}
.kpi .k2{font-size:28px;font-weight:800;margin-top:1px}
.kpi .k3{font-size:12px;opacity:.9}
.basis{font-size:11.5px;color:#6b7683;margin:6px 0 8px}
.st{font-size:15px;font-weight:700;color:var(--brand);margin:12px 0 6px;border-left:4px solid var(--brand);padding-left:8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{background:#eef3f9;color:#00386b;text-align:right;padding:6px 8px;font-weight:700}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 8px;text-align:right;border-bottom:1px solid #e6eaf0}
table.t.sm{font-size:11.5px}
table.t.sm th{padding:4px 6px}
table.t.sm td{padding:3px 6px}
table.t tr.hl td{font-weight:800;background:#eaf7f1;color:#0d6b49}
.flex2{display:flex;gap:16px;align-items:flex-start}
.fx1{flex:0 0 380px}
.fx2{flex:1;min-width:0}
.foot{position:absolute;left:44px;right:44px;bottom:20px;display:flex;justify-content:space-between;font-size:11px;color:#8a94a1;border-top:1px solid #e6eaf0;padding-top:6px}
.keys{margin:0;padding-left:18px;font-size:12.5px}
.keys li{margin-bottom:3px}
.pill{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:0 5px 5px 0;background:#e3f5ec;color:#0d6b49}
.callout{background:#eaf2fb;border-left:4px solid var(--brand);padding:8px 12px;border-radius:6px;font-size:12px;margin:10px 0}
.callout.ok{background:#e9f7f0;border-color:var(--green)}
.callout.bad{background:#fff3e8;border-color:var(--orange)}
/* Seuils et sensibilité */
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{border:1px solid #dde3ea;border-radius:10px;padding:9px 12px 10px;background:#fbfcfe}
.tc .l{font-size:10px;text-transform:uppercase;letter-spacing:.45px;color:#6b7683;font-weight:700}
.tc .q{font-size:10.5px;color:#6b7683;margin-top:1px}
.tc .v{font-size:20px;font-weight:800;color:#0b2a4a;margin-top:4px;line-height:1.1}
.tc .c{font-size:11px;color:#3a4552;margin-top:3px}
.tc .m{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;border-radius:8px;padding:2px 8px}
.m.ok{background:#e3f5ec;color:#0d6b49}
.m.ko{background:#fff1e6;color:#a34a0b}
.m.na{background:#eef0f3;color:#6b7683}
table.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:11.5px}
table.hm th{font-weight:700;color:#3a4552;padding:4px 6px;text-align:center;background:#f2f5f9;border-radius:4px}
table.hm th.rh{text-align:right}
table.hm td{text-align:center;padding:6px 4px;border-radius:4px;font-weight:700;color:#1b2430}
table.hm td.cur{outline:2px solid #0b2a4a;outline-offset:-2px}
.annex{font-size:9.4px;line-height:1.26}
.a1grid{display:flex;gap:18px}
.a1col{flex:1;min-width:0}
.a1g{margin-bottom:6px}
.a1g h4{margin:0 0 2px;font-size:9.8px;color:var(--brand);border-bottom:1px solid #cfd8e3;padding-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.a1r{display:flex;justify-content:space-between;gap:8px;padding:1px 0;border-bottom:1px dotted #dfe5ec}
.a1r span:first-child{color:#3a4552}
.a1r span:last-child{font-weight:700;text-align:right}
table.a2{width:100%;border-collapse:collapse;font-size:8.8px;line-height:1.25}
table.a2 th{background:#eef3f9;color:#00386b;text-align:left;padding:3px 5px;font-weight:700}
table.a2 td{padding:2.2px 5px;border-bottom:1px solid #e6eaf0;vertical-align:top}
table.a2 td:first-child{font-weight:700;width:21%}
table.a2 td:nth-child(2){color:#3a4552;width:55%}
table.a2 td:last-child{text-align:right;font-weight:700;width:24%}
table.a2 tr.sec td{background:#f4f7fb;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:8.4px;text-align:left}
#stage{position:absolute;left:-10000px;top:0;width:794px}
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,#modal{display:none !important}
  #printArea{display:block}
  #printArea .page{break-after:page;page-break-after:always}
  #printArea .page:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="wm"><span class="a">Master</span><span class="b">TCO</span></div><span class="tag">Coût total de possession<br>électrique et diesel</span></div>
    <div class="tabs">
      <button class="tab on" type="button" data-action="tab" data-tab="saisie" id="tab-saisie">Données</button>
      <button class="tab" type="button" data-action="tab" data-tab="rapport" id="tab-rapport">Rapport</button>
    </div>
  </header>

  <section class="view" id="view-saisie">
    <div class="modebar">
      <div class="mt">Type de rapport</div>
      <div class="mslider"><div class="mthumb"></div>
        <button type="button" class="mopt" data-action="mode" data-mode="conso">Consommation</button>
        <button type="button" class="mopt" data-action="mode" data-mode="complet">Étude complète</button>
      </div>
    </div>
    <div id="missBanner"></div>
    <div id="formHost"></div>
    <div class="card live" id="liveBox"></div>
    <div class="btns">
      <button class="btn main" type="button" data-action="go-rapport">Voir le rapport</button>
      <div class="row2">
        <button class="btn sec" type="button" data-action="reset">Réinitialiser</button>
        <button class="btn danger" type="button" data-action="clear">Tout effacer</button>
      </div>
    </div>
  </section>

  <section class="view" id="view-rapport" style="display:none">
    <div class="modebar">
      <div class="mt">Type de rapport</div>
      <div class="mslider"><div class="mthumb"></div>
        <button type="button" class="mopt" data-action="mode" data-mode="conso">Consommation</button>
        <button type="button" class="mopt" data-action="mode" data-mode="complet">Étude complète</button>
      </div>
    </div>
    <div id="reportWarn"></div>
    <div class="toolbar">
      <button class="btn main" type="button" data-action="pdf" id="btnPdf">Télécharger le rapport en PDF</button>
      <button class="btn sec" type="button" data-action="tab" data-tab="saisie">Modifier les données</button>
    </div>
    <div id="pagesHost"></div>
  </section>
</div>

<div id="stage"></div>
<div id="printArea"></div>

<div id="modal">
  <div class="mbox">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <div id="mList"></div>
    <div class="row2">
      <button class="btn sec" type="button" data-action="modal-cancel" id="mCancel">Annuler</button>
      <button class="btn danger" type="button" data-action="modal-ok" id="mOk">Confirmer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===================== DONNÉES PAR DÉFAUT ===================== */
var STORAGE_KEY = 'masterTCO_v5';
var OLD_KEYS = ['masterTCO_v4', 'masterTCO_v3', 'ecoCamionData_v2'];

var DEFAULTS = {
  titre: 'Tracteur 44 t : électrique vs diesel',
  client: '',
  auteur: 'GCA Trucks Marseille',
  mode: 'complet',
  kmPer: '100000', kmUnit: 'an', kmNb: '', joursAn: '220', joursSem: '5', annees: '5',
  consMode: 'essai', km: '368,4', kwh: '319', consDirect: '86,6',
  pElec: '0,20', pElecBase: 'ttc', tvaElec: '20',
  cDiesel: '25', pDiesel: '2,50', pDieselBase: 'ttc', tvaDiesel: '20', ticpe: '0,594',
  pHC: '0,15', pHP: '0,19', partHC: '80', kva: '170', prixKva: '25', contratNb: '1',
  hivPct: '15', hivMois: '4', chargePct: '0',
  rembTicpe: '0',
  rechMode: 'pct', partPublic: '20', rechKwh: '200', rechDur: '45', rechDurU: 'min', rechPow: '150',
  rechFreq: '1', rechFreqU: 'jour', pPublic: '0,55', pPublicBase: 'ttc',
  coutChauf: '35',
  modeE: 'achat', prixE: '290000', loyE: '5200', durLocE: '5', durLocUE: 'ans', optE: '2900',
  modeD: 'achat', prixD: '115000', loyD: '2100', durLocD: '5', durLocUD: 'ans', optD: '1150',
  aideAchat: '0', aideBorne: '0',
  finPartE: '80', finTauxE: '5', finDureeE: '5', finUE: 'ans',
  finPartD: '80', finTauxD: '5', finDureeD: '5', finUD: 'ans',
  resE: '30', resD: '35', resU: 'pct',
  borneInv: '45000', borneNb: '1', borneAbo: '1500', borneAboU: 'an',
  entE: '6000', entD: '11000', entU: 'an',
  adbL: '1,3', adbU: 'l100', adbP: '0,85',
  assE: '7500', assD: '7000', assU: 'an',
  capBat: '350', batDeg: '1,5', batDegU: 'an', batSeuil: '70', batRempl: '70000', batEff: '3',
  bornePuis: '150', socArr: '20', socFin: '100', fenetre: '10',
  carbP: '0,12', carbYear: '2', pegD: '0', pegE: '0',
  fiscGain: '0', certif: '0',
  evElec: '0', evDiesel: '0', evAutres: '0',
  scDiesel: '-10', scElec: '10', scKm: '-10', scBatDeg: '2', scRes: '-20',
  sensAmp: '10',
  co2D: '2,65', co2E: '0,06'
};

var DEFAULT_ON = {
  energie: true, contrat: false, saison: true, recharge: false, chauf: true, remb: false,
  achat: true, aides: false, fin: false, revente: true, borne: true, entretien: true, adblue: true,
  assur: true, batterie: true, regl: false, fisc: false, evol: true, scen: true, sens: true, co2: true
};
var CONSO_OFF = ['achat', 'aides', 'fin', 'revente', 'borne', 'entretien', 'adblue', 'assur', 'batterie', 'chauf', 'regl', 'fisc'];

var U_KM = [['an', 'km/an'], ['mois', 'km/mois'], ['sem', 'km/semaine'], ['jour', 'km/jour']];
var U_BASE_KWH = [['ttc', '€/kWh TTC'], ['ht', '€/kWh HT']];
var U_BASE_L = [['ttc', '€/L TTC'], ['ht', '€/L HT']];
var U_AN_MOIS = [['an', '€ par an'], ['mois', '€ par mois']];
var U_DUREE = [['ans', 'ans'], ['mois', 'mois']];
var U_RES = [['pct', '% du prix'], ['eur', '€ HT']];
var U_ACQ = [['achat', 'Achat (comptant ou crédit)'], ['location', 'Location (loyer)'], ['cbail', 'Crédit-bail']];

/* Dépendances (tout le calendrier vient de la carte Projection) */
function posNum(v) {
  var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}
function recOcc(s, o) { return !!o.recharge && (s.rechMode === 'kwh' || s.rechMode === 'dur'); }
function needD(s, o) { return (recOcc(s, o) && s.rechFreqU === 'jour') || !!o.batterie; }
function needW(s, o) { return recOcc(s, o) && s.rechFreqU === 'sem'; }
function needM(s, o) { return recOcc(s, o) && s.rechFreqU === 'mois'; }
function showJoursAn(s, o) { return s.kmUnit === 'an' && (needD(s, o) || needW(s, o) || needM(s, o)); }
function showJoursSem(s, o) {
  if (s.kmUnit === 'sem' || s.kmUnit === 'mois') { return needD(s, o); }
  return needW(s, o) || needM(s, o);
}
function leaseMonthsS(s, X) {
  var dur = posNum(s['durLoc' + X]);
  return Math.max(0, Math.round(s['durLocU' + X] === 'mois' ? dur : dur * 12));
}
function ownsAtEnd(mode, months, n) { return mode === 'achat' || (mode === 'cbail' && months > 0 && months <= n * 12); }
function ownsS(s, X) {
  var n = Math.min(15, Math.max(1, Math.round(posNum(s.annees))));
  return ownsAtEnd(s['mode' + X], leaseMonthsS(s, X), n);
}
function priceUsed(s, o, X) {
  if (s['mode' + X] === 'achat') { return true; }
  return s['mode' + X] === 'cbail' && !!o.revente && s.resU === 'pct' && ownsS(s, X);
}

var GROUPS = [

var TEXT_KEYS = { titre: 1, client: 1, auteur: 1 };
var SEL_KEYS = { mode: 1 };
var FIELD = {};
var GROUP_OF = {};
var GROUP_BY_ON = {};

function buildMaps() {
  var gi, fi, g, f;
  for (gi = 0; gi < GROUPS.length; gi++) {
    g = GROUPS[gi];
    if (g.on) { GROUP_BY_ON[g.on] = g; }
    for (fi = 0; fi < g.fields.length; fi++) {
      f = g.fields[fi];
      if (f.k) {
        FIELD[f.k] = f;
        GROUP_OF[f.k] = g;
        if (f.select) { SEL_KEYS[f.k] = 1; }
      }
      if (f.unitKey) { SEL_KEYS[f.unitKey] = 1; }
    }
  }
}
function isText(k) { return !!(TEXT_KEYS[k] || SEL_KEYS[k]); }

/* ===================== OUTILS ===================== */
function num(v) {
  var s = String(v === undefined || v === null ? '' : v).replace(/\s/g, '').replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmt(n, d) {
  if (!isFinite(n)) { return '0'; }
  return n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function eur(n, d) { return fmt(n, d === undefined ? 0 : d) + ' €'; }
function ans(n) { return n + (n > 1 ? ' ans' : ' an'); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function readData(s) {
  var d = {};
  var k;
  for (k in s) {
    if (Object.prototype.hasOwnProperty.call(s, k)) {
      d[k] = isText(k) ? s[k] : num(s[k]);
    }
  }
  return d;
}
function copyObj(o) {
  var c = {};
  var k;
  for (k in o) {
    if (Object.prototype.hasOwnProperty.call(o, k)) { c[k] = o[k]; }
  }
  return c;
}

/* ===================== CALCULS (tous les montants en HT) ===================== */
var WEEKS_PER_YEAR = 52;
var MONTHS_PER_YEAR = 12;

function annualKm(d) {
  return d.kmUnit === 'an' ? d.kmPer : d.kmPer * d.kmNb;
}
function periodsPerYear(d) {
  var jS = d.joursSem;
  var days, weeks, months;
  if (d.kmUnit === 'jour') {
    days = d.kmNb;
    weeks = jS > 0 ? days / jS : 0;
    months = weeks * MONTHS_PER_YEAR / WEEKS_PER_YEAR;
  } else if (d.kmUnit === 'sem') {
    weeks = d.kmNb;
    days = weeks * jS;
    months = weeks * MONTHS_PER_YEAR / WEEKS_PER_YEAR;
  } else if (d.kmUnit === 'mois') {
    months = d.kmNb;
    weeks = months * WEEKS_PER_YEAR / MONTHS_PER_YEAR;
    days = weeks * jS;
  } else {
    days = d.joursAn;
    weeks = jS > 0 ? days / jS : 0;
    months = weeks * MONTHS_PER_YEAR / WEEKS_PER_YEAR;
  }
  return { days: days, weeks: weeks, months: months };
}
function leaseMonths(d, X) {
  var dur = d['durLoc' + X];
  return Math.max(0, Math.round(d['durLocU' + X] === 'mois' ? dur : dur * 12));
}

function loanInterestByYear(P, ratePct, term, termUnit, n) {
  var arr = [];
  var y, m, it, yr, bal, pay, i, months;
  for (y = 0; y <= n; y++) { arr.push(0); }
  if (P <= 0 || ratePct <= 0) { return arr; }
  months = Math.max(1, Math.round(termUnit === 'mois' ? term : term * 12));
  i = ratePct / 100 / 12;
  pay = P * i / (1 - Math.pow(1 + i, -months));
  bal = P;
  for (m = 1; m <= months; m++) {
    it = bal * i;
    yr = Math.ceil(m / 12);
    if (yr <= n) { arr[yr] += it; }
    bal = bal - (pay - it);
  }
  return arr;
}
function rentInYear(mode, rent, months, opt, y) {
  if (mode === 'achat' || months <= 0) { return 0; }
  var from = 12 * (y - 1) + 1;
  var to = 12 * y;
  /* Une location simple doit couvrir toute la durée étudiée. Si le contrat initial
     expire avant la fin de l'étude, le loyer est prolongé au même tarif comme
     hypothèse explicite de renouvellement (signalée dans le rapport). */
  if (mode === 'location') { return rent * Math.min(12, Math.max(0, to - from + 1)); }
  var cnt = Math.max(0, Math.min(to, months) - from + 1);
  var c = rent * cnt;
  if (mode === 'cbail' && months >= from && months <= to) { c += opt; }
  return c;
}

function compute(d, on) {
  var n = Math.round(d.annees);
  if (n < 1) { n = 1; }
  if (n > 15) { n = 15; }
  var eOn = on.energie ? 1 : 0;
  var P = periodsPerYear(d);
  var kmAn = annualKm(d);
  var conso100 = d.consMode === 'direct' ? d.consDirect : (d.km > 0 ? d.kwh / d.km * 100 : 0);
  var hivF = on.saison ? 1 + d.hivPct / 100 * Math.min(12, Math.max(0, d.hivMois)) / 12 : 1;
  var chgF = on.saison ? 1 + d.chargePct / 100 : 1;
  var adj = hivF * chgF;
  var consoReal = conso100 * adj;
  var tvaE = 1 + d.tvaElec / 100;
  var tvaD = 1 + d.tvaDiesel / 100;
  var pSimpleHT = d.pElecBase === 'ht' ? d.pElec : d.pElec / tvaE;

function niceStep(x) {

  var e = Math.floor(Math.log(x) / Math.LN10);

}

  if (maxV < 0) { maxV = 0; }
  if (maxV === minV) { maxV = 1; }

  return { min: Math.floor(minV / step) * step, max: Math.ceil(maxV / step) * step, step: step };
}

function beText(be0, be, r) {
  if (be0) { return 'Immédiat'; }
  if (be === null) { return 'Au-delà de ' + ans(r.n); }
  return fmt(be, 1) + ' ans';
}
function beMain(r) { return beText(r.be0, r.be, r); }
function beWithRes(r) {
  if (r.be === null && r.beRes !== null) { return 'en fin de période'; }
  return beText(r.be0, r.beRes, r);
}
function sgn(v) { return (v > 0 ? '+' : '') + fmt(v, 0); }
function disclaimer() {
  return '<div class="callout">Étude indicative, fondée sur les hypothèses détaillées en annexes. Les prix, aides, valeurs de revente et conditions de financement varient selon le client et le moment : à confirmer par une offre commerciale.</div>';
}
function consoText(r, on) {
  return fmt(r.conso100, 1) + ' kWh/100 km' + (on.saison && Math.abs(r.adj - 1) > 1e-9 ? ' à l’essai (' + fmt(r.consoReal, 1) + ' en conditions réelles)' : '');
}
function basisLine(r, d, on) {
  return '<div class="basis">Scénario réaliste · ' + fmt(r.kmAn, 0) + ' km/an sur ' + ans(r.n) + ' · ' + consoText(r, on) + ' contre ' + fmt(d.cDiesel, 1) + ' L/100 km · électricité ' + fmt(r.pAll1, 3) + ' €/kWh HT · gazole ' + fmt(r.pDieHT, 3) + ' €/L HT.</div>';
}

function energyBlock(r, d, on) {
  var h = '<div class="st">Coût annuel de l’énergie à ' + fmt(r.kmAn, 0) + ' km/an · HT</div>';
  h += '<div class="flex2"><div class="fx1">';
  h += barChart(380, 220, [{ label: 'Énergie, année 1', a: r.an.eleHT, b: r.an.dieHT }], { na: 'Électrique', nb: 'Diesel', ca: '#1a9b6c', cb: '#e0642a', legGap: 110 });
  h += '</div><div class="fx2"><table class="t sm"><tr><th></th><th>Électrique</th><th>Diesel</th><th>Écart</th></tr>';
  h += '<tr><td>Par an</td><td>' + eur(r.an.eleHT) + '</td><td>' + eur(r.an.dieHT) + '</td><td>' + eur(r.an.ecoHT) + '</td></tr>';
  h += '<tr><td>Au km</td><td>' + eur(r.perKm.eleHT, 3) + '</td><td>' + eur(r.perKm.dieHT, 3) + '</td><td>' + eur(r.perKm.dieHT - r.perKm.eleHT, 3) + '</td></tr>';
  h += '<tr><td>Aux 100 km</td><td>' + eur(r.perKm.eleHT * 100, 2) + '</td><td>' + eur(r.perKm.dieHT * 100, 2) + '</td><td>' + eur((r.perKm.dieHT - r.perKm.eleHT) * 100, 2) + '</td></tr>';
  h += '</table>';
  if (on.contrat) { h += '<div class="basis">Contrat du dépôt : ' + fmt(d.partHC, 0) + ' % en heures creuses, part fixe de ' + eur(r.fixedContrat) + ' par an imputée à ce camion.</div>'; }
  h += '</div></div>';

  h += '<div class="st">' + (d.consMode === 'direct' ? 'Pour 100 km' : 'Essai de référence : ' + fmt(r.ref.km, 1) + ' km') + ' · HT</div>';
  h += '<table class="t"><tr><th></th><th>Électrique</th><th>Diesel</th><th>Économie</th></tr>';
  h += '<tr><td>Énergie consommée</td><td>' + fmt(r.ref.kwh, 1) + ' kWh</td><td>' + fmt(r.ref.L, 1) + ' L</td><td></td></tr>';
  h += '<tr><td>Consommation aux 100 km</td><td>' + fmt(r.conso100, 1) + ' kWh</td><td>' + fmt(d.cDiesel, 1) + ' L</td><td></td></tr>';
  h += '<tr><td>Coût de l’énergie</td><td>' + eur(r.ref.eleHT, 2) + '</td><td>' + eur(r.ref.dieHT, 2) + '</td><td>' + eur(r.ref.ecoHT, 2) + '</td></tr>';
  h += '<tr class="hl"><td>Économie aux 100 km</td><td colspan="3">' + eur(r.ref.km > 0 ? r.ref.ecoHT / r.ref.km * 100 : 0, 2) + '</td></tr>';
  h += '</table>';

  h += '<div class="st">Consommations annuelles (année 1)</div>';
  h += '<table class="t"><tr><th></th><th>Électrique</th><th>Diesel</th></tr>';
  if (on.saison) { h += '<tr><td>Consommation moyenne réelle (hiver et charge)</td><td>' + fmt(r.consoReal, 1) + ' kWh/100 km</td><td>' + fmt(d.cDiesel, 1) + ' L/100 km</td></tr>'; }
  h += '<tr><td>Énergie</td><td>' + fmt(r.an.kwh, 0) + ' kWh</td><td>' + fmt(r.an.L, 0) + ' L</td></tr>';
  if (on.adblue) { h += '<tr><td>AdBlue</td><td>–</td><td>' + fmt(r.oc.adbLitres, 0) + ' L</td></tr>'; }
  if (on.recharge) { h += '<tr><td>dont recharge en borne publique' + (d.rechMode === 'auto' ? ' (calcul automatique)' : '') + '</td><td>' + fmt(r.an.pub, 0) + ' kWh (' + fmt(r.share1 * 100, 0) + ' %)</td><td>–</td></tr>'; }
  h += '<tr><td>dont TICPE sur le gazole</td><td>–</td><td>' + eur(r.an.ticpe) + '</td></tr>';
  if (on.remb) { h += '<tr><td>Remboursement partiel de TICPE (déduit)</td><td>–</td><td>– ' + eur(r.an.remb) + '</td></tr>'; }
  h += '</table>';
  return h;
}

function scenarioBlock(r, rp, d, on, complet) {
  if (!on.scen || !rp || !rp.valid) { return ''; }
  var h = '<div class="st">Scénarios : prudent et réaliste · HT</div>';
  h += '<table class="t sm"><tr><th></th><th>Prudent</th><th>Réaliste</th></tr>';
  function row(label, a, b, hl) { return '<tr' + (hl ? ' class="hl"' : '') + '><td>' + label + '</td><td>' + a + '</td><td>' + b + '</td></tr>'; }
  if (complet) {
    h += row('Économie annuelle d’exploitation', eur(rp.opSav), eur(r.opSav), false);
    if (on.achat) { h += row('Temps d’équilibre économique', beMain(rp), beMain(r), false); }
    h += row('Économie sur ' + ans(r.n), eur(rp.tcoSav), eur(r.tcoSav), true);
  } else {
    h += row('Économie annuelle', eur(rp.an.ecoHT), eur(r.an.ecoHT), false);
    h += row('Économie sur ' + ans(r.n), eur(rp.totEneHT), eur(r.totEneHT), true);
  }
  if (on.co2) { h += row('CO₂ évité par an', fmt(rp.co2Year, 0) + ' t', fmt(r.co2Year, 0) + ' t', false); }
  h += '</table>';
  h += '<div class="basis">Réaliste : données saisies. Prudent : ' + scenarioText(d, on) + '.</div>';
  return h;
}
function scenarioText(d, on) {
  var parts = [];
  if (on.energie) { parts.push('gazole ' + sgn(d.scDiesel) + ' %'); parts.push('électricité ' + sgn(d.scElec) + ' %'); }
  parts.push('kilométrage ' + sgn(d.scKm) + ' %');
  if (on.batterie) { parts.push('perte de capacité de la batterie ' + fmt(d.scBatDeg, 1) + ' %/an'); }
  if (on.revente && ownsS(state, 'E')) { parts.push('revente de l’électrique ' + sgn(d.scRes) + ' %'); }
  return parts.join(', ');
}

/* Consommation seule : page 1 */
function pageConso1(r, d, on) {
  var h = '<div class="page">' + headHtml(d);
  h += '<div class="kpis">';
  h += kpi('g', 'Économie annuelle', eur(r.an.ecoHT), fmt(r.an.pctHT, 0) + ' % de moins que le diesel');
  h += kpi('g', 'Économie sur ' + ans(r.n), eur(r.totEneHT), 'énergie, cumul sur ' + ans(r.n));
  h += kpi('b', 'Économie aux 100 km', eur(r.ref.km > 0 ? r.ref.ecoHT / r.ref.km * 100 : 0, 2), d.consMode === 'direct' ? 'pour 100 km parcourus' : 'sur l’essai de référence');
  if (on.co2) { h += kpi('b', 'CO₂ évité par an', fmt(r.co2Year, 0) + ' t', fmt(r.co2Total, 0) + ' t sur ' + ans(r.n)); }
  else { h += kpi('b', 'Coût de l’énergie au km', eur(r.perKm.eleHT, 3), 'contre ' + eur(r.perKm.dieHT, 3) + ' pour le diesel'); }
  h += '</div>' + basisLine(r, d, on);
  h += energyBlock(r, d, on);
  h += footHtml(d, '') + '</div>';
  return h;
}

/* Consommation seule : page 2 */
function pageConso2(r, d, on) {
  var h = '<div class="page">' + headHtml(d);
  h += '<div class="st">Coût de l’énergie cumulé sur ' + ans(r.n) + ' · HT</div>';
  h += lineChart(706, 235, r.n, r.cumEneE, r.cumEneD, { na: 'Camion électrique (cumul)', nb: 'Camion diesel (cumul)', ca: '#1a9b6c', cb: '#e0642a', x0: 'Départ' });
  h += '<div class="st">Détail année par année · HT</div>';
  h += '<table class="t sm"><tr><th></th><th>Électrique</th><th>Diesel</th><th>Économie de l’année</th><th>Économie cumulée</th></tr>';
  var y;
  var stepC = Math.max(1, Math.ceil(r.n / 8));
  for (y = 1; y <= r.n; y++) {
    if (y % stepC !== 0 && y !== r.n) { continue; }
    h += '<tr><td>Année ' + y + '</td><td>' + eur(r.yr.eleHT[y]) + '</td><td>' + eur(r.yr.dieHT[y]) + '</td><td>' + eur(r.yr.dieHT[y] - r.yr.eleHT[y]) + '</td><td>' + eur(r.cumEneSav[y]) + '</td></tr>';
  }
  h += '<tr class="hl"><td>Total ' + ans(r.n) + '</td><td colspan="4">' + eur(r.totEneHT) + ' d’économie</td></tr>';
  h += '</table>';
  if (stepC > 1) { h += '<div class="basis">Détail affiché une année sur ' + stepC + '.</div>'; }
  h += scenarioBlock(r, CUR_RP, d, on, false);
  if (on.co2) {
    h += '<div class="st">Émissions de CO₂ à l’usage</div>';
    h += '<table class="t sm"><tr><th></th><th>Électrique</th><th>Diesel</th><th>Évité</th></tr>';
    h += '<tr><td>Par an</td><td>' + fmt(r.kgE / 1000, 1) + ' t</td><td>' + fmt(r.kgD / 1000, 1) + ' t</td><td>' + fmt(r.co2Year, 1) + ' t</td></tr>';
    h += '<tr class="hl"><td>Sur ' + ans(r.n) + '</td><td>' + fmt(r.kgETotal / 1000, 1) + ' t</td><td>' + fmt(r.kgDTotal / 1000, 1) + ' t</td><td>' + fmt(r.co2Total, 1) + ' t</td></tr>';
    h += '</table>';
  }
  h += disclaimer();
  h += footHtml(d, '') + '</div>';
  return h;
}

/* Étude complète : page 1 synthèse */
function pageComplet1(r, d, on) {
  var h = '<div class="page">' + headHtml(d);
  var resOn = on.revente && (r.ownE || r.ownD);
  h += '<div class="kpis">';
  h += kpi('g', 'Économie annuelle', eur(r.opSav), 'exploitation (énergie, entretien, AdBlue…)');
  h += kpi('g', 'Économie sur ' + ans(r.n), eur(r.tcoSav), 'coût total, tous postes retenus' + (resOn ? ', revente comprise' : ''));
  h += kpi('b', 'Temps d’équilibre économique', beMain(r), resOn ? 'hors revente · avec revente : ' + beWithRes(r) : 'hors valeur de revente');
  h += kpi('b', 'CO₂ évité par an', on.co2 ? fmt(r.co2Year, 0) + ' t' : '–', on.co2 ? fmt(r.co2Total, 0) + ' t sur ' + ans(r.n) : 'poste non pris en compte');
  h += '</div>' + basisLine(r, d, on);
  var netNote = resOn || r.cE.recettes > 0;
  h += '<div class="st">Coût total par camion sur ' + ans(r.n) + (netNote ? ' (avant revente et recettes)' : '') + ' · HT</div>';
  var bars = [
    { label: 'Électrique', vals: stackVals(r.cE), sub: netNote ? 'Coût net : ' + eur(r.tcoE) : '' },
    { label: 'Diesel', vals: stackVals(r.cD), sub: netNote ? 'Coût net : ' + eur(r.tcoD) : '' }
  ];
  h += stackedChart(706, 310, bars, COMPS);
  h += '<div class="st">Détail du coût total sur ' + ans(r.n) + ' · HT</div>';
  var rows = [
    ['Prix d’achat (net des aides)', r.cE.achat, r.cD.achat, on.achat && (r.cE.achat > 0 || r.cD.achat > 0)],
    ['Loyers (location, crédit-bail)', r.cE.loyer, r.cD.loyer, on.achat && (r.cE.loyer > 0 || r.cD.loyer > 0)],
    ['Borne de recharge (part de ce camion)', r.cE.borne, r.cD.borne, on.borne],
    ['Énergie', r.cE.ene, r.cD.ene, on.energie],
    ['Entretien', r.cE.ent, r.cD.ent, on.entretien],
    ['AdBlue', r.cE.adb, r.cD.adb, on.adblue],
    ['Assurance et taxes', r.cE.ass, r.cD.ass, on.assur],
    ['Financement (intérêts)', r.cE.fin, r.cD.fin, on.fin],
    ['Remplacement de la batterie', r.cE.batt, 0, on.batterie && r.cE.batt > 0],
    ['Temps chauffeur en recharge', r.cE.chauf, 0, on.chauf],
    ['Taxes à venir (carbone, péages)', r.cE.taxes, r.cD.taxes, on.regl]
  ];
  h += '<table class="t sm"><tr><th></th><th>Électrique</th><th>Diesel</th><th>Avantage électrique</th></tr>';
  var i;
  for (i = 0; i < rows.length; i++) {
    if (rows[i][3]) {
      h += '<tr><td>' + rows[i][0] + '</td><td>' + eur(rows[i][1]) + '</td><td>' + eur(rows[i][2]) + '</td><td>' + eur(rows[i][2] - rows[i][1]) + '</td></tr>';
    }
  }
  if (on.fisc) {
    h += '<tr><td>Avantages fiscaux et certificats (déduits)</td><td>– ' + eur(r.cE.recettes) + '</td><td>' + eur(0) + '</td><td>' + eur(r.cE.recettes) + '</td></tr>';
  }
  if (resOn) {
    h += '<tr><td>Valeur de revente (déduite)</td><td>' + (r.ownE ? '– ' + eur(r.resE) : '–') + '</td><td>' + (r.ownD ? '– ' + eur(r.resD) : '–') + '</td><td>' + eur(r.resE - r.resD) + '</td></tr>';
  }
  h += '<tr class="hl"><td>Coût total de possession</td><td>' + eur(r.tcoE) + '</td><td>' + eur(r.tcoD) + '</td><td>' + eur(r.tcoSav) + '</td></tr>';
  h += '</table>';
  h += footHtml(d, '') + '</div>';
  return h;
}

/* Étude complète : page 2 énergie */
function pageComplet2(r, d, on) {
  var h = '<div class="page">' + headHtml(d);
  h += '<div class="kpis">';
  h += kpi('g', 'Économie d’énergie annuelle', eur(r.an.ecoHT), fmt(r.an.pctHT, 0) + ' % de moins que le diesel');
  h += kpi('b', 'Économie d’énergie sur ' + ans(r.n), eur(r.totEneHT), 'cumul sur ' + ans(r.n));
  h += '</div>' + basisLine(r, d, on);
  h += energyBlock(r, d, on);
  h += footHtml(d, '') + '</div>';
  return h;
}

/* Étude complète : page 3 coût cumulé */
function pageComplet3(r, d, on) {
  var resOn = on.revente && (r.ownE || r.ownD);
  var h = '<div class="page">' + headHtml(d);
  h += '<div class="st">Coût cumulé sur ' + ans(r.n) + (resOn ? ', revente déduite en fin de période' : '') + ' · HT</div>';
  h += lineChart(706, 290, r.n, r.cumEn, r.cumDn, { na: 'Camion électrique (cumul)', nb: 'Camion diesel (cumul)', ca: '#1a9b6c', cb: '#e0642a', x0: 'Départ', label0: true });
  var msg;
  if (r.be0) { msg = 'Le camion électrique est moins coûteux dès le départ.'; }
  else if (r.be === null && r.beRes === null) { msg = 'Dans cette simulation, l’électrique n’a pas rattrapé le diesel au bout de ' + ans(r.n) + (resOn ? ', même revente comprise.' : '.'); }
  else if (r.be === null) { msg = 'Le surcoût initial du camion électrique n’est compensé qu’en fin de période (année ' + r.n + '), grâce à la valeur de revente.'; }
  else { msg = 'Le surcoût initial du camion électrique est rattrapé après environ <b>' + fmt(r.be, 1) + ' ans</b> (flux de trésorerie, hors revente).'; }
  if (resOn) { msg += ' Valeur de revente déduite en fin de période : électrique ' + eur(r.resE) + ', diesel ' + eur(r.resD) + '.'; }
  h += '<div class="callout">' + msg + '</div>';
  h += '<div class="st">Cumul année par année · HT</div>';
  h += '<table class="t sm"><tr><th></th><th>Électrique</th><th>Diesel</th><th>Économie cumulée</th></tr>';
  var y;
  var stepK = Math.max(1, Math.ceil(r.n / 8));
  for (y = 0; y <= r.n; y++) {
    if (y % stepK !== 0 && y !== r.n) { continue; }
    h += '<tr' + (y === r.n ? ' class="hl"' : '') + '><td>' + (y === 0 ? 'Départ (année 0)' : 'Année ' + y + (y === r.n && resOn ? ' · revente déduite' : '')) + '</td><td>' + eur(r.cumEn[y]) + '</td><td>' + eur(r.cumDn[y]) + '</td><td>' + eur(r.cumDn[y] - r.cumEn[y]) + '</td></tr>';
  }
  h += '</table>';
  if (stepK > 1) { h += '<div class="basis">Détail affiché une année sur ' + stepK + '.</div>'; }
  h += scenarioBlock(r, CUR_RP, d, on, true);
  h += footHtml(d, '') + '</div>';
  return h;
}

/* Page seuils de rentabilité et sensibilité */
function thrCard(t, S) {
  var h = '<div class="tc"><div class="l">' + esc(t.label) + '</div>';
  h += '<div class="q">' + (t.kind === 'min' ? 'Minimum pour être rentable' : 'Maximum pour rester rentable') + '</div>';
  var pct, cls, txt;
  if (t.seuil === null) {
    h += '<div class="v">Aucun seuil détecté</div><div class="c">Actuel : ' + fmt(t.cur, t.dec) + t.unit + ' · plage testée × 0,02 à × 20</div>'; 
    txt = 'Aucun croisement détecté dans la plage testée';
    h += '<span class="m ' + (S.base >= 0 ? 'ok' : 'na') + '">' + txt + '</span>';
  } else {
    h += '<div class="v">' + fmt(t.seuil, t.dec) + t.unit + '</div><div class="c">Actuel : ' + fmt(t.cur, t.dec) + t.unit + '</div>';
    pct = t.cur !== 0 ? (t.seuil - t.cur) / Math.abs(t.cur) * 100 : 0;
    if (S.base >= 0) { cls = 'ok'; txt = 'Marge de sécurité : ' + fmt(Math.abs(pct), 0) + ' %'; }
    else { cls = 'ko'; txt = 'À atteindre : ' + sgn(pct) + ' %'; }
    h += '<span class="m ' + cls + '">' + txt + '</span>';
  }
  return h + '</div>';
}
function heatColor(v, maxAbs) {
  var a = maxAbs > 0 ? Math.min(1, Math.abs(v) / maxAbs) : 0;
  var alpha = 0.12 + 0.55 * a;
  return v >= 0 ? 'rgba(26,155,108,' + alpha.toFixed(3) + ')' : 'rgba(198,40,40,' + alpha.toFixed(3) + ')';
}
function pageSens(r, d, on, S) {
  var complet = isComplet();
  var what = complet ? 'l’économie sur ' + ans(r.n) + ' (coût total)' : 'l’économie d’énergie sur ' + ans(r.n);
  var h = '<div class="page">' + headHtml(d);
  h += '<div class="st">Seuils de rentabilité</div>';
  h += '<div class="basis" style="margin-top:0">Valeur de chaque donnée pour laquelle ' + what + ' devient nulle, toutes les autres données restant inchangées. Base actuelle : <b>' + eur(S.base) + '</b>.</div>';
  h += '<div class="thr">';
  var i;
  for (i = 0; i < S.thr.length; i++) { h += thrCard(S.thr[i], S); }
  if (complet && on.achat) {
    h += '<div class="tc"><div class="l">Temps d’équilibre économique</div><div class="q">Durée pour rattraper le surcoût</div><div class="v">' + beMain(r) + '</div><div class="c">Hors valeur de revente</div>';
    h += '<span class="m ' + (r.be !== null ? 'ok' : 'na') + '">' + (r.be !== null ? 'Avant la fin de l’étude' : 'Avec revente : ' + beWithRes(r)) + '</span></div>';
  }
  h += '</div>';

  if (S.vars.length > 0) {
    h += '<div class="st">Sensibilité : effet d’une variation de ± ' + fmt(S.amp * 100, 0) + ' % sur ' + what + '</div>';
    h += tornadoChart(706, S.vars, S.base, S.amp);
  }

  var k, j, maxAbs = 0;
  for (k = 0; k < S.grid.length; k++) { for (j = 0; j < S.grid[k].length; j++) { maxAbs = Math.max(maxAbs, Math.abs(S.grid[k][j])); } }
  h += '<div class="st">' + (complet ? 'Économie sur ' + ans(r.n) : 'Économie d’énergie sur ' + ans(r.n)) + ' selon le kilométrage et le prix du gazole · HT</div>';
  h += '<table class="hm"><tr><th class="rh">km/an \\ gazole HT</th>';
  for (j = 0; j < S.steps.length; j++) { h += '<th>' + fmt(r.pDieHT * Math.max(0.01, S.steps[j]), 3) + ' €/L</th>'; }
  h += '</tr>';
  for (k = 0; k < S.steps.length; k++) {
    h += '<tr><th class="rh">' + fmt(r.kmAn * Math.max(0.01, S.steps[k]), 0) + '</th>';
    for (j = 0; j < S.steps.length; j++) {
      h += '<td' + (k === 2 && j === 2 ? ' class="cur"' : '') + ' style="background:' + heatColor(S.grid[k][j], maxAbs) + '">' + fmt(S.grid[k][j] / 1000, 0) + ' k€</td>';
    }
    h += '</tr>';
  }
  h += '</table>';
  h += '<div class="basis">Lecture : case encadrée = situation actuelle ; vert = électrique plus avantageux, rouge = diesel plus avantageux. Pas de ± ' + fmt(S.amp * 100, 0) + ' % sur chaque axe.</div>';
  h += footHtml(d, '') + '</div>';
  return h;
}

var BLOCK_NAMES = [

  }
  pages.push(annex1(r, d, on));
  pages.push(annex2(r, d, on));
  var tot = pages.length;
  var i;
  for (i = 0; i < pages.length; i++) {
    pages[i] = pages[i].split('{{PG}}').join(String(i + 1)).split('{{TOT}}').join(String(tot));
  }
  return pages;
}

/* ===================== INTERFACE ===================== */
function migrateValues(v) {
  var m = copyObj(v);
  var i, old;
  var parts = ['Part', 'Taux', 'Duree', 'U'];
  if (typeof m.kmAn === 'string' && typeof m.kmPer !== 'string') { m.kmPer = m.kmAn; }
  if (typeof m.perEntretien === 'string' && typeof m.entU !== 'string') { m.entU = m.perEntretien; }
  for (i = 0; i < parts.length; i++) {
    old = 'fin' + parts[i];
    if (typeof m[old] === 'string') {
      if (typeof m[old + 'E'] !== 'string') { m[old + 'E'] = m[old]; }
      if (typeof m[old + 'D'] !== 'string') { m[old + 'D'] = m[old]; }
    }
  }
  return m;
}
function applyStored(o) {
  var k;
  var v = migrateValues(o.v || {});
  for (k in state) {
    if (Object.prototype.hasOwnProperty.call(v, k) && typeof v[k] === 'string') { state[k] = v[k]; }
  }
  if (o.on) {
    for (k in ons) {
      if (Object.prototype.hasOwnProperty.call(o.on, k)) { ons[k] = !!o.on[k]; }
    }
  }
}
function loadState() {
  var raw = null;
  var keys = [STORAGE_KEY].concat(OLD_KEYS);
  var i;
  for (i = 0; i < keys.length; i++) {
    try { raw = localStorage.getItem(keys[i]); } catch (e) { raw = null; }
    if (raw) {
      try { applyStored(JSON.parse(raw)); } catch (e2) {}
      return;
    }
  }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: state, on: ons })); } catch (e) {}
}

function modelWarnings(d, on, r) {
  var w = [];
  if (on.achat && (r.leaseShortE || r.leaseShortD)) {
    w.push('Le loyer de location simple est prolongé au même tarif après l’échéance du contrat initial ; confirmer le tarif et la disponibilité du véhicule de renouvellement.');
  }
  if (isComplet()) {
    if (!on.entretien) { w.push('Entretien désactivé : ce poste est exclu du coût total.'); }
    if (!on.adblue) { w.push('AdBlue désactivé : ce poste est exclu du coût total diesel.'); }
    if (!on.chauf && on.recharge) { w.push('Coût du temps de chauffeur désactivé : les heures de recharge publique ne sont pas valorisées.'); }
    if (!on.batterie) { w.push('Vieillissement et remplacement de batterie désactivés : aucune dégradation ni aucun coût de remplacement n’est intégré.'); }
    if (!on.assur) { w.push('Assurance désactivée : ce poste est exclu du coût total.'); }
    if (!on.borne) { w.push('Investissement et abonnement de recharge au dépôt désactivés : vérifier qu’ils sont déjà pris en charge ailleurs.'); }
    if (on.energie && !on.recharge && r.bat && !r.bat.okRange) { w.push('L’autonomie estimée est inférieure au kilométrage journalier : la recharge en route n’est pas chiffrée car la recharge publique est désactivée.'); }
    if (on.recharge && d.rechMode === 'auto' && !on.batterie) { w.push('Le mode de recharge publique automatique nécessite le modèle de batterie ; la recharge automatique ne peut pas être estimée correctement.'); }
    if (on.batterie && d.capBat > 0 && d.bornePuis > 0 && r.bat && r.bat.needHN > d.fenetre) { w.push('Le temps de recharge estimé au dépôt dépasse la fenêtre disponible ; une borne plus puissante ou une recharge complémentaire peut être nécessaire.'); }
    if (on.batterie && (d.socArr < 0 || d.socFin > 100 || d.socFin <= d.socArr)) { w.push('Les seuils de charge de la batterie sont incohérents : vérifier le SOC d’arrivée et le SOC cible.'); }
    if (on.recharge && (d.rechPow <= 0 || (d.rechMode === 'dur' && d.rechDur <= 0))) { w.push('Les paramètres de puissance ou de durée de recharge publique ne permettent pas d’estimer une recharge exploitable.'); }
    if (on.revente) { w.push('La valeur de revente est une estimation forfaitaire saisie par l’utilisateur ; elle n’est pas prédite à partir du kilométrage, de l’âge ou de l’état de santé de la batterie.'); }
  }
  if (on.recharge) { w.push('La recharge publique est un modèle simplifié : pertes de charge, courbe de puissance, disponibilité des bornes, files d’attente et détours ne sont pas simulés.'); }
  if (on.co2 && on.batterie && r.bat && r.bat.replYears.length > 0) { w.push('Les émissions de CO₂ à l’usage intègrent la consommation électrique liée au vieillissement de la batterie, mais pas les émissions de fabrication/remplacement de la batterie.'); }
  return w;
}

function renderReport() {
  var d = readData(state);
  var on = effOn();
  var r = compute(d, on);
  var warn = document.getElementById('reportWarn');
  var btn = document.getElementById('btnPdf');
  var w = '';
  var miss = missingList();
  if (!r.valid) {
    w += '<div class="warn">Données incomplètes : renseigne le kilométrage et la consommation (ou désactive l’énergie) pour générer le rapport.</div>';
    btn.disabled = true;
  } else {
    btn.disabled = false;
  }
  if (miss.length > 0) {
    w += '<div class="warn red"><b>' + miss.length + ' donnée(s) manquante(s) ou invalide(s)</b> : vérifie que tu ne les as pas oubliées.' + missingHtml(miss) + '<button type="button" class="btn sec" data-action="first-miss">Les compléter dans les données</button></div>';
  }
  var alerts = modelWarnings(d, on, r);
  if (alerts.length > 0) {
    w += '<div class="warn"><b>Points de vigilance du modèle</b><ul class="redlist">';
    for (var ai = 0; ai < alerts.length; ai++) { w += '<li>' + esc(alerts[ai]) + '</li>'; }
    w += '</ul></div>';
  }
  warn.innerHTML = w;
  var pages = buildPages(r, d, on);
  var host = document.getElementById('pagesHost');
  var h = '';
  var i;
  for (i = 0; i < pages.length; i++) {
    h += '<div class="pgwrap"><div class="pgscale">' + pages[i] + '</div></div>';
  }
  host.innerHTML = h;
  btn.textContent = 'Télécharger le rapport en PDF (' + pages.length + ' pages)';
  fitPages();
  var pageEls = host.getElementsByClassName('page');
  var overflowPages = [];
  for (var pi = 0; pi < pageEls.length; pi++) {
    if (pageEls[pi].scrollHeight > pageEls[pi].clientHeight + 2) { overflowPages.push(pi + 1); }
  }
  if (overflowPages.length > 0) {
    warn.innerHTML += '<div class="warn red"><b>Rapport dense :</b> le contenu dépasse la hauteur prévue sur la/les page(s) ' + overflowPages.join(', ') + '. Réduis les options facultatives avant l’export pour éviter une page tronquée.</div>';
  }
}

function fitPages() {
  var host = document.getElementById('pagesHost');
  var w = host.clientWidth;
  if (!w) { return; }
  var sc = Math.min(1, w / 794);
  var wraps = host.getElementsByClassName('pgwrap');
  var i, sEl;
  for (i = 0; i < wraps.length; i++) {
    sEl = wraps[i].firstChild;
    sEl.style.transform = 'scale(' + sc + ')';
    wraps[i].style.width = (794 * sc) + 'px';
    wraps[i].style.height = (1122 * sc) + 'px';
  }
}

/* ----- PDF ----- */
function slug(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function startPdf() {
  var d = readData(state);
  var on = effOn();
  var r = compute(d, on);
  if (!r.valid) { return; }
  var pages = buildPages(r, d, on);
  if (!window.html2canvas || !window.jspdf) {
    printFallback(pages);
    return;
  }
  var btn = document.getElementById('btnPdf');
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Génération du PDF…';
  var stage = document.getElementById('stage');
  stage.innerHTML = pages.join('');
  var els = stage.getElementsByClassName('page');
  var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  var idx = 0;
  var name = 'MasterTCO' + (d.client ? '-' + slug(d.client) : '') + '.pdf';

  function finish(ok) {
    stage.innerHTML = '';
    btn.disabled = false;
    btn.textContent = label;
    if (!ok) { printFallback(pages); }
  }
  function next() {
    if (idx >= els.length) {
      pdf.save(name);
      finish(true);
      return;
    }
    window.html2canvas(els[idx], { scale: 3, backgroundColor: '#ffffff', useCORS: true, scrollX: 0, scrollY: 0 }).then(function (canvas) {
      if (idx > 0) { pdf.addPage(); }
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
      idx++;
      next();
    }).catch(function () {
      finish(false);
    });
  }
  next();
}
function downloadPdf() {
  var miss = missingList();
  if (miss.length > 0) {
    showModal('Données manquantes', miss.length + ' donnée(s) ne sont pas renseignées ou sont invalides. Les as-tu oubliées ?', 'Télécharger quand même', startPdf, missingHtml(miss), 'Compléter', goToFirstMissing);
  } else {
    startPdf();
  }
}
function printFallback(pages) {
  var pa = document.getElementById('printArea');
  pa.innerHTML = pages.join('');
  window.print();
}

/* ----- Événements ----- */
var KM_DEFAULT_NB = { jour: '220', sem: '46', mois: '11' };
function onFieldEvent(e) {
  var t = e.target;
  var key = t.getAttribute ? t.getAttribute('data-key') : null;
  if (!key) { return; }
  if (e.type === 'change' && t.tagName === 'INPUT' && state[key] === t.value) { return; }
  var prevAnnual = (key === 'kmUnit') ? annualKm(readData(state)) : 0;
  state[key] = t.value;
  if (key === 'kmUnit') {
    state.kmNb = KM_DEFAULT_NB[t.value] || '';
    var nbP = t.value === 'an' ? 1 : num(state.kmNb);
    if (prevAnnual > 0 && nbP > 0) {
      state.kmPer = (t.value === 'an' ? String(Math.round(prevAnnual)) : String(Math.round(prevAnnual / nbP * 10) / 10)).replace('.', ',');
    }
  }
  if (e.type === 'change' || t.tagName === 'SELECT') { fillInputs(); }
  saveState();
  refreshAll();
}
document.addEventListener('input', onFieldEvent);
document.addEventListener('change', onFieldEvent);

document.addEventListener('click', function (e) {
  var el = e.target;
  var action = null;
  while (el && el !== document) {
    if (el.getAttribute && el.getAttribute('data-action')) {
      action = el.getAttribute('data-action');
      break;
    }
    el = el.parentNode;
  }
  if (!action || el.disabled) { return; }
  if (action === 'tab') { showTab(el.getAttribute('data-tab')); }
  else if (action === 'go-rapport') { showTab('rapport'); }
  else if (action === 'toggle') {
    var key = el.getAttribute('data-on');
    ons[key] = !ons[key];
    saveState();
    refreshAll();
  }
  else if (action === 'mode') {
    state.mode = el.getAttribute('data-mode');
    saveState();
    refreshAll();
    if (reportVisible()) { renderReport(); }
  }
  else if (action === 'first-miss') { goToFirstMissing(); }
  else if (action === 'reset') {
    showModal('Réinitialiser les données ?', 'Les valeurs et les interrupteurs reviennent à l’exemple de départ (tracteur 44 t, essai de 368,4 km).', 'Réinitialiser', doReset);
  }
  else if (action === 'clear') {
    showModal('Tout effacer ?', 'Tous les champs seront vidés. Les interrupteurs et les unités restent tels quels. Tu pourras revenir à l’exemple avec « Réinitialiser ».', 'Tout effacer', doClear);
  }
  else if (action === 'pdf') { downloadPdf(); }
  else if (action === 'modal-cancel') {
    var cc = modalCancel;
    closeModal();
    if (cc) { cc(); }
  }
  else if (action === 'modal-ok') {
    var cb = modalOk;
    closeModal();
    if (cb) { cb(); }
  }
});

window.addEventListener('resize', fitPages);
window.addEventListener('orientationchange', function () { setTimeout(fitPages, 200); });

buildMaps();
loadState();
buildForm();
</script>
